=\"149.38\" r=\"3.4\" fill=\"#253b2e\"/><text x=\"190.00\" y=\"173.38\" text-anchor=\"middle\" font-size=\"19\" fill=\"#253b2e\" stroke=\"#fbfcf5\" stroke-width=\"4\" paint-order=\"stroke\" stroke-linejoin=\"round\">I</text><circle cx=\"306.25\" cy=\"149.38\" r=\"3.4\" fill=\"#253b2e\"/><text x=\"306.25\" y=\"173.38\" text-anchor=\"middle\" font-size=\"19\" fill=\"#253b2e\" stroke=\"#fbfcf5\" stroke-width=\"4\" paint-order=\"stroke\" stroke-linejoin=\"round\">B</text></g></svg>","caption":""}},{"id":16,"title":"Calculer avec les vecteurs","text":"Simplifie 2[[u]] − 3([[u]] − [[v]]).","options":["−[[u]] − 3[[v]]","5[[u]] − 3[[v]]","−[[u]] + [[v]]","−[[u]] + 3[[v]]"],"answer":3,"hint":"Distribue −3 aux deux termes de la parenthèse.","explain":"2[[u]] − 3([[u]] − [[v]]) = 2[[u]] − 3[[u]] + 3[[v]] = −[[u]] + 3[[v]]. Le produit de deux signes négatifs donne un signe positif.","visual":null},{"id":17,"title":"Calculer les coordonnées","text":"Dans un repère, A(−2 ; 1) et B(3 ; −2). Quelles sont les coordonnées de [[AB]] ?","options":["(1 ; −1)","(−5 ; 3)","(5 ; −3)","(5 ; 3)"],"answer":2,"hint":"Pour chaque coordonnée : extrémité moins origine.","explain":"[[AB]] = (x<sub>B</sub> − x<sub>A</sub> ; y<sub>B</sub> − y<sub>A</sub>) = (3 − (−2) ; −2 − 1) = (5 ; −3). On ne mélange pas l’ordre des soustractions.","visual":null},{"id":18,"title":"Inverser un déplacement","text":"Dans un repère, A(−2 ; 1) et B(3 ; −2). Quelles sont les coordonnées de [[BA]] ?","options":["(−5 ; 3)","(5 ; −3)","(−5 ; −3)","(1 ; −1)"],"answer":0,"hint":"Le vecteur [[BA]] est l’opposé de [[AB]].","explain":"[[BA]] = (−2 − 3 ; 1 − (−2)) = (−5 ; 3). On peut aussi prendre l’opposé de (5 ; −3), les coordonnées de [[AB]] : les deux signes changent.","visual":null},{"id":19,"title":"Trouver l’image d’un point","text":"M(−1 ; 2). La translation de vecteur [[u]](3 ; −4) envoie M sur N. Quelles sont les coordonnées de N ?","options":["(−4 ; 6)","(3 ; −4)","(4 ; −6)","(2 ; −2)"],"answer":3,"hint":"Écris [[MN]] = [[u]], ou ajoute le déplacement aux coordonnées de M.","explain":"N a pour coordonnées (−1 + 3 ; 2 − 4) = (2 ; −2). Vérification : [[MN]] = (2 − (−1) ; −2 − 2) = (3 ; −4).","visual":{"type":"svg","svg":"<svg viewBox=\"0 0 380 260\" role=\"img\" aria-label=\"Le point M est placé en moins un, deux dans un repère orthonormé. Un petit vecteur u montre un déplacement de trois vers la droite et quatre vers le bas.\" xmlns=\"http://www.w3.org/2000/svg\"><g font-family=\"Georgia,serif\"><path d=\"M116.11 225.00L116.11 35.00\" fill=\"none\" stroke=\"#d6dfc9\" stroke-width=\"0.8\"/><path d=\"M137.22 225.00L137.22 35.00\" fill=\"none\" stroke=\"#d6dfc9\" stroke-width=\"0.8\"/><path d=\"M158.33 225.00L158.33 35.00\" fill=\"none\" stroke=\"#d6dfc9\" stroke-width=\"0.8\"/><path d=\"M179.44 225.00L179.44 35.00\" fill=\"none\" stroke=\"#d6dfc9\" stroke-width=\"0.8\"/><path d=\"M200.56 225.00L200.56 35.00\" fill=\"none\" stroke=\"#d6dfc9\" stroke-width=\"0.8\"/><path d=\"M221.67 225.00L221.67 35.00\" fill=\"none\" stroke=\"#d6dfc9\" stroke-width=\"0.8\"/><path d=\"M242.78 225.00L242.78 35.00\" fill=\"none\" stroke=\"#d6dfc9\" stroke-width=\"0.8\"/><path d=\"M263.89 225.00L263.89 35.00\" fill=\"none\" stroke=\"#d6dfc9\" stroke-width=\"0.8\"/><path d=\"M116.11 225.00L263.89 225.00\" fill=\"none\" stroke=\"#d6dfc9\" stroke-width=\"0.8\"/><path d=\"M116.11 203.89L263.89 203.89\" fill=\"none\" stroke=\"#d6dfc9\" stroke-width=\"0.8\"/><path d=\"M116.11 182.78L263.89 182.78\" fill=\"none\" stroke=\"#d6dfc9\" stroke-width=\"0.8\"/><path d=\"M116.11 161.67L263.89 161.67\" fill=\"none\" stroke=\"#d6dfc9\" stroke-width=\"0.8\"/><path d=\"M116.11 140.56L263.89 140.56\" fill=\"none\" stroke=\"#d6dfc9\" stroke-width=\"0.8\"/><path d=\"M116.11 119.44L263.89 119.44\" fill=\"none\" stroke=\"#d6dfc9\" stroke-width=\"0.8\"/><path d=\"M116.11 98.33L263.89 98.33\" fill=\"none\" stroke=\"#d6dfc9\" stroke-width=\"0.8\"/><path d=\"M116.11 77.22L263.89 77.22\" fill=\"none\" stroke=\"#d6dfc9\" stroke-widt or=\"middle\" font-size=\"12\" fill=\"#6b7d62\" stroke=\"#fbfcf5\" stroke-width=\"4\" paint-order=\"stroke\" stroke-linejoin=\"round\">-3</text><text x=\"166.44\" y=\"165.67\" text-anchor=\"middle\" font-size=\"12\" fill=\"#6b7d62\" stroke=\"#fbfcf5\" stroke-width=\"4\" paint-order=\"stroke\" stroke-linejoin=\"round\">-2</text><text x=\"166.44\" y=\"144.56\" text-anchor=\"middle\" font-size=\"12\" fill=\"#6b7d62\" stroke=\"#fbfcf5\" stroke-width=\"4\" paint-order=\"stroke\" stroke-linejoin=\"round\">-1</text><text x=\"166.44\" y=\"102.33\" text-anchor=\"middle\" font-size=\"12\" fill=\"#6b7d62\" stroke=\"#fbfcf5\" stroke-width=\"4\" paint-order=\"stroke\" stroke-linejoin=\"round\">1</text><text x=\"166.44\" y=\"81.22\" text-anchor=\"middle\" font-size=\"12\" fill=\"#6b7d62\" stroke=\"#fbfcf5\" stroke-width=\"4\" paint-order=\"stroke\" stroke-linejoin=\"round\">2</text><text x=\"166.44\" y=\"60.11\" text-anchor=\"middle\" font-size=\"12\" fill=\"#6b7d62\" stroke=\"#fbfcf5\" stroke-width=\"4\" paint-order=\"stroke\" stroke-linejoin=\"round\">3</text><text x=\"167.44\" y=\"136.44\" text-anchor=\"middle\" font-size=\"13\" fill=\"#6b7d62\" stroke=\"#fbfcf5\" stroke-width=\"4\" paint-order=\"stroke\" stroke-linejoin=\"round\">O</text><circle cx=\"158.33\" cy=\"77.22\" r=\"3.4\" fill=\"#253b2e\"/><text x=\"145.33\" y=\"67.22\" text-anchor=\"middle\" font-size=\"19\" fill=\"#253b2e\" stroke=\"#fbfcf5\" stroke-width=\"4\" paint-order=\"stroke\" stroke-linejoin=\"round\">M</text><defs><marker id=\"f1135\" markerWidth=\"12\" markerHeight=\"12\" refX=\"11.3\" refY=\"6\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0 0L12 6L0 12L3 6Z\" fill=\"#326c91\"/></marker></defs><path d=\"M179.44 56.11L242.78 140.56\" stroke=\"#326c91\" stroke-width=\"2.7\" fill=\"none\" marker-end=\"url(#f1135)\"/><text x=\"238.11\" y=\"79.78\" text-anchor=\"middle\" font-size=\"19\" fill=\"#326c91\" stroke=\"#fbfcf5\" stroke-width=\"4\" paint-order=\"stroke\" stroke-linejoin=\"round\">u</text></g></svg>","caption":"Une graduation vaut 1. La flèche représente u, placé ailleurs que M."}},{"id":20,"title":"Additionner par coordonnées","text":"[[u]](2 ; −3) et [[v]](−1 ; 4). Quelles sont les coordonnées de [[u]] + [[v]] ?","options":["(3 ; −7)","(1 ; 1)","(1 ; −7)","(−2 ; −12)"],"answer":1,"hint":"Additionne les abscisses entre elles, puis les ordonnées entre elles.","explain":"[[u]] + [[v]] = (2 + (−1) ; −3 + 4) = (1 ; 1). On ne multiplie pas les coordonnées pour additionner deux vecteurs.","visual":null},{"id":21,"title":"Combiner deux vecteurs","text":"[[u]](2 ; −3) et [[v]](−1 ; 4). Quelles sont les coordonnées de 2[[u]] − [[v]] ?","options":["(5 ; −10)","(3 ; −2)","(5 ; −2)","(3 ; −10)"],"answer":0,"hint":"Calcule d’abord 2[[u]], puis soustrais chaque coordonnée de [[v]].","explain":"2[[u]] = (4 ; −6), donc 2[[u]] − [[v]] = (4 − (−1) ; −6 − 4) = (5 ; −10). Soustraire −1 revient à ajouter 1.","visual":null},{"id":22,"title":"Calculer un milieu","text":"A(−2 ; 1) et B(4 ; 5). Quelles sont les coordonnées du milieu I de [AB] ?","options":["(6 ; 4)","(2 ; 6)","(1 ; 3)","(3 ; 2)"],"answer":2,"hint":"Pour un milieu, on prend la moyenne des abscisses et la moyenne des ordonnées.","explain":"I a pour coordonnées ({{−2 + 4/2}} ; {{1 + 5/2}}) = (1 ; 3). La demi-différence des coordonnées donnerait celles d’un vecteur, pas celles du milieu.","visual":null},{"id":23,"title":"Calculer une norme","text":"Dans un repère orthonormé, [[u]] a pour coordonnées (3 ; −4). Quelle est sa norme ?","options":["−1","25","7","5"],"answer":3,"hint":"Applique Pythagore : la norme au carré est 3² + (−4)².","explain":"‖[[u]]‖² = 3² + (−4)² = 9 + 16 = 25. La norme est positive : ‖[[u]]‖ = 5. La formule demande un repère orthonormé ; 25 est le carré de la norme.","visual":null},{"id":24,"title":"Reconnaître la colinéarité","text":"[[u]](2 ; −3) et [[v]](−4 ; 6). Quelle relation prouve qu’ils sont colinéaires ?","options":["[[v]] = 2[[u]]","[[v]] = −2[[u]]","[[v]] = −[[u]]","[[v]] = {{1/2}}[[u]]"],"answer":1,"hint":"Cherche un même coefficient pour passer des deux coordonnées de [[u]] à celles de [[v]].","explain":"−2 × 2 = −4 et −2 × (−3) = 6. Ainsi [[v]] = −2[[u]] : les vecteurs sont colinéaires et, ici, de sens opposés. Le coefficient doit être le même pour les deux coordonnées.","visual":null},{"id":25,"title":"Utiliser le déterminant","text":"[[u]](3 ; 2) et [[v]](6 ; 5). Que vaut det([[u]], [[v]]) = x y′ − y x′ ?","options":["3","27","−3","0"],"answer":0,"hint":"Calcule 3 × 5 − 2 × 6, en conservant cet ordre.","explain":"det([[u]], [[v]]) = 15 − 12 = 3. Ce déterminant n’est pas nul : [[u]] et [[v]] ne sont pas colinéaires. Le déterminant est un nombre, pas un vecteur.","visual":null},{"id":26,"title":"Justifier un alignement","text":"A(−1 ; 2), B(2 ; 4) et C(5 ; 6). Quelle affirmation est exacte ?","options":["Ils sont alignés car [[AB]] = [[AC]]","Ils ne sont pas alignés car leurs abscisses diffèrent","Ils sont alignés car [[AC]] = 2[[AB]]","Ils sont alignés car [[AC]] = −2[[AB]]"],"answer":2,"hint":"Calcule deux vecteurs ayant la même origine A.","explain":"[[AB]] = (3 ; 2) et [[AC]] = (6 ; 4) = 2[[AB]]. Ces vecteurs sont colinéaires, donc A, B et C sont alignés. Ici, B est même le milieu de [AC].","visual":null},{"id":27,"title":"Deux droites : quelle position ?","text":"A(0 ; 1), B(3 ; 3), C(−1 ; −2) et D(5 ; 2). Les droites (AB) et (CD) sont…","options":["sécantes","strictement parallèles","confondues","perpendiculaires"],"answer":1,"hint":"Compare [[AB]] et [[CD]], puis vérifie si C appartient à (AB).","explain":"[[AB]] = (3 ; 2) et [[CD]] = (6 ; 4) = 2[[AB]] : les droites sont parallèles. Mais [[AC]] = (−1 ; −3) et det([[AB]], [[AC]]) = −9 + 2 = −7 ≠ 0. Donc C ∉ (AB) : les droites sont distinctes et strictement parallèles.","visual":null},{"id":28,"title":"Défi 1 · Un paramètre","text":"Pour quelle(s) valeur(s) réelle(s) de x les vecteurs [[u]](x ; 2) et [[v]](3 ; x − 1) sont-ils colinéaires ?","options":["x = 3 seulement","x = −2 seulement","Aucune valeur réelle","x = −2 ou x = 3"],"answer":3,"hint":"Le déterminant doit être nul. Cherche une factorisation de x² − x − 6.","explain":"det([[u]], [[v]]) = x(x − 1) − 6 = x² − x − 6 = (x − 3)(x + 2). Le produit est nul si et seulement si x = 3 ou x = −2. Les deux valeurs conviennent ; on ne garde pas seulement la valeur positive.","visual":null},{"id":29,"title":"Défi 2 · Croiser deux médianes","text":"A(0 ; 0), B(6 ; 0), C(0 ; 4). I est le milieu de [BC], N celui de [AB] et [[AM]] = {{2/3}}[[AI]]. Quelle relation est vraie ?","options":["[[CM]] = {{2/3}}[[CN]]","[[CM]] = {{3/2}}[[CN]]","[[CM]] = {{1/3}}[[CN]]","[[CM]] = −{{2/3}}[[CN]]"],"answer":0,"hint":"Calcule I et N, puis M. Compare ensuite les coordonnées de [[CM]] et [[CN]].","explain":"I(3 ; 2), N(3 ; 0) et M(2 ; {{4/3}}). Ainsi [[CM]] = (2 ; −{{8/3}}) et [[CN]] = (3 ; −4). Chaque coordonnée de [[CM]] est égale aux deux tiers de celle de [[CN]] : [[CM]] = {{2/3}}[[CN]]. M appartient donc aussi à la médiane [CN].","visual":{"type":"svg","svg":"<svg viewBox=\"0 0 380 260\" role=\"img\" aria-label=\"Triangle A zéro zéro, B six zéro, C zéro quatre. I est le milieu de BC, N le milieu de AB. M est sur AI aux deux tiers depuis A, et sur CN.\" xmlns=\"http://www.w3.org/2000/svg\"><g font-family=\"Georgia,serif\"><path d=\"M88.21 197.86L291.79 197.86\" fill=\"none\" stroke=\"#869a78\" stroke-width=\"1.7\"/><path d=\"M291.79 197.86L88.21 62.14\" fill=\"none\" stroke=\"#869a78\" stroke-width=\"1.7\"/><path d=\"M88.21 62.14L88.21 197.86\" fill=\"none\" stroke=\"#869a78\" stroke-width=\"1.7\"/><path d=\"M88.21 197.86L190.00 130.00\" fill=\"none\" stroke=\"#35674e\" stroke-width=\"2.3\"/><path d=\"M88.21 62.14L190.00 197.86\" fill=\"none\" stroke=\"#326c91\" stroke-width=\"2.1\" stroke-dasharray=\"6 5\"/><circle cx=\"88.21\" cy=\"197.86\" r=\"3.4\" fill=\"#253b2e\"/><text x=\"76.21\" y=\"218.86\" text-anchor=\"middle\" font-size=\"19\" fill=\"#253b2e\" stroke=\"#fbfcf5\" stroke-width=\"4\" paint-order=\ const KEY='qfm-vecteurs-seconde-v1';const URLQUIZ='https://faicelmaths20.github.io/missaoui-maths/qfm-vecteurs-seconde/';
const GROUPS=['Les premiers repères','Construire et calculer','Coordonnées et raisonnement','Les 3 défis'];const RANGES=[[0,8],[8,16],[16,27],[27,30]];const TOTAL=Q.length;function groupIndex(i){return RANGES.findIndex(([a,b])=>i>=a&&i<b);}
const FIRE='<svg class="flame" viewBox="0 0 60 75" aria-hidden="true"><path d="M32 2C42 23 19 24 39 38C46 30 45 23 44 19C66 44 56 72 30 73C4 73-2 45 16 28C13 43 24 44 23 31C22 18 32 16 32 2Z" fill="#ffb947"/><path d="M31 36C40 50 26 49 37 59C42 67 34 73 28 71C15 69 14 55 25 47C23 57 30 56 31 36Z" fill="#fff0a3"/></svg>';
const empty=()=>({version:1,index:0,answers:Array(TOTAL).fill(null),hints:Array(TOTAL).fill(false),started:false});let state=empty(),selected=null,storageOK=true,returnFocus=null,errorsOnly=false;
try{const raw=JSON.parse(localStorage.getItem(KEY));if(raw&&raw.version===1&&Array.isArray(raw.answers)&&raw.answers.length===TOTAL&&raw.answers.every(x=>x===null||Number.isInteger(x)&&x>=0&&x<4)&&Array.isArray(raw.hints)&&raw.hints.length===TOTAL&&raw.hints.every(x=>typeof x==='boolean')&&Number.isInteger(raw.index)&&raw.index>=0&&raw.index<TOTAL){state=raw;}}catch(e){storageOK=false;}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){storageOK=false;}}
function fmt(s){return s.replace(/\{\{([^/{}]+)\/([^{}]+)\}\}/g,(_,n,d)=>`<span class="frac" role="math" aria-label="${n} sur ${d}"><span aria-hidden="true">${n}</span><span aria-hidden="true">${d}</span></span>`).replace(/\[\[([^\]]+)\]\]/g,(_,v)=>`<span class="vector ${v==='0'?'zero':''}" role="math" aria-label="vecteur ${v}"><svg viewBox="0 0 40 8" preserveAspectRatio="none" aria-hidden="true"><path d="M1 6H38L32 1M38 6L33 7" stroke="currentColor" stroke-width="1.4" fill="none"/></svg><span aria-hidden="true">${v}</span></span>`);}
function count(){return state.answers.filter(x=>x!==null).length;}function score(){return Q.filter((q,i)=>state.answers[i]===q.answer).length;}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.hidden=true,4000);}
function shareQuiz(){window.open('https://wa.me/?text='+encodeURIComponent('QFM Vecteurs · Seconde — 30 questions progressives, des figures, des coups de pouce et 3 défis. Par Faicel Missaoui :\n'+URLQUIZ),'_blank','noopener,noreferrer');}
async function copyLink(){try{await navigator.clipboard.writeText(URLQUIZ);toast('Lien copié : prêt à partager.');}catch(e){window.prompt('Copiez ce lien pour le partager :',URLQUIZ);}}
function home(){document.getElementById('main').innerHTML=`<section class="hero"><div><span class="pill">SECONDE · VECTEURS</span><h1>Comprendre le mouvement.<br><em>Raisonner en vecteurs.</em></h1><p>30 questions pour lire une figure, construire un déplacement et calculer avec les coordonnées. Un coup de pouce quand il faut, une explication après chaque réponse.</p><div class="hero-actions"><button class="btn primary" onclick="begin()">${state.started?'Reprendre · question '+(state.index+1):'Commencer le parcours'} <span aria-hidden="true">→</span></button><button class="btn" onclick="go(27)">Les 3 défis ${FIRE.replace('class="flame"','style="width:19px;height:24px"')}</button></div><p class="note">Une seule bonne réponse. Sans chronomètre. ${count()?count()+' réponse(s) enregistrée(s) sur '+TOTAL+'.':''}</p></div><div class="journey"><div class="journey-top"><div><div class="big-number">30</div><p>questions · 4 étapes</p></div><svg class="hero-art" viewBox="0 0 160 95" aria-hidden="true"><defs><marker id="heroArrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#54764a"/></marker></defs><path d="M15 75L100 75L140 20L55 20Z" fill="#cedeb0" fill-opacity=".55" stroke="#b3c795" stroke-width="1.5"/><path d="M15 75L100 75M15 75L55 20" fill="none" stroke="#54764a" stroke-width="2" marker-end="url(#heroArrow)"/><path d="M15 75L140 20" fill="none" stroke="#ab8438" stroke-width="2"/><circle cx="140" cy="20" r="4" fill="#ab8438"/></svg></div>${GROUPS.map((g,i)=>`<div class="stage-item"><b>${RANGES[i][0]+1}–${RANGES[i][1]}</b><span>${g}</span></div>`).join('')}</div></section><div class="legend"><span>Coups de pouce sans pénalité</span><span>Corrections expliquées</span><span>Progression enregistrée sur cet appareil</span></div>`;}
function begin(){go(state.index);}
function go(i){if(!Number.isInteger(i)||i<0||i>=Q.length)return;state.started=true;state.index=i;selected=state.answers[i];persist();render();document.getElementById('questionTitle').focus({preventScroll:true});window.scrollTo({top:0,behavior:'auto'});}
function visual(q){if(!q.visual)return '';return `<figure class="vis">${q.visual.svg}${q.visual.caption?`<figcaption>${q.visual.caption}</figcaption>`:''}</figure>`;}
function render(){const i=state.index,q=Q[i],done=state.answers[i]!==null,n=count(),good=state.answers[i]===q.answer;document.getElementById('main').innerHTML=`<div class="workspace"><div><div class="status"><span>${n} / ${TOTAL} questions validées</span><b>${score()} bonne${score()>1?'s':''} réponse${score()>1?'s':''}</b></div><div class="track" role="progressbar" aria-valuenow="${n}" aria-valuemin="0" aria-valuemax="${TOTAL}" aria-label="Questions validées"><i style="width:${n/TOTAL*100}%"></i></div><section class="card"><div class="card-inner"><div class="question-meta"><span class="counter">QUESTION ${String(i+1).padStart(2,'0')} / ${TOTAL}</span><span class="level ${i>=27?'challenge':''}">${i>=27?'🔥 Défi '+(i-26)+'/3':GROUPS[groupIndex(i)]}</span></div><h1 class="question-title" id="questionTitle" tabindex="-1">${q.title}</h1><p class="question-text">${fmt(q.text)}</p>${visual(q)}<div class="answers" role="group" aria-label="Choisir une réponse">${q.options.map((v,j)=>`<button class="choice ${selected===j?'selected':''} ${done&&j===q.answer?'good':''} ${done&&j===state.answers[i]&&!good?'bad':''}" ${done?'disabled':''} aria-pressed="${selected===j}" onclick="choose(${j})"><span class="letter">${'ABCD'[j]}</span><span class="value">${fmt(v)}</span><span class="mark" aria-hidden="true">${done&&j===q.answer?'✓':done&&j===state.answers[i]?'×':''}</span></button>`).join('')}</div><button class="hint-toggle" onclick="hint()" aria-expanded="${state.hints[i]}" aria-controls="hintbox">✧ ${state.hints[i]?'Coup de pouce utilisé':'Un coup de pouce ?'}</button><div class="hint-box" id="hintbox" ${state.hints[i]?'':'hidden'}>${fmt(q.hint)}</div><div id="feedback" ${done?'':'hidden'} class="feedback ${good?'success':''}" role="status">${done?`<h3>${good?FIRE+'Bravo, bien raisonné !':'Une étape pour progresser'}</h3>${!good?`<p class="correctline">Bonne réponse : ${fmt(q.options[q.answer])}</p>`:''}<p>${fmt(q.explain)}</p>`:''}</div></div><div class="actions"><button class="btn quiet" onclick="go(${i-1})" ${i===0?'disabled':''}>← Précédente</button><div class="nav-next">${!done?'<button class="btn primary" id="validate" onclick="validate()" '+(selected===null?'disabled':'')+'>Valider</button>':`<button class="btn primary" onclick="${n===TOTAL?'results()':'next()'}">${n===TOTAL?'Voir mon bilan':'Question suivante →'}</button>`}</div></div></section></div><aside class="sidebar" aria-label="Navigation dans le parcours"><h2>Votre parcours</h2><div class="maps">${GROUPS.map((g,k)=>`<div><p class="map-title">${k===3?'🔥 ':''}${g}</p><div class="grid">${Q.slice(...RANGES[k]).map((v)=>{let j=v.id-1,a=state.answers[j];return `<button class="dot ${j===i?'current':''} ${a===null?'':a===v.answer?'good':'bad'}" onclick="go(${j})" aria-label="Question ${j+1}${a===null?', à faire':a===v.answer?', réussie':', à revoir'}" ${j===i?'aria-current="step"':''}>${j+1}</button>`;}).join('')}</div></div>`).join('')}</div><p class="key">✓ Vert : réussie · Rose : à revoir<br>Chaque numéro permet de naviguer.</p><p class="save-info">${storageOK?'Progression enregistrée sur cet appareil.':'Enregistrement indisponible : gardez cette page ouverte.'}</p><button class="btn" onclick="results()">${n===TOTAL?'Mon bilan final':'Voir ma progression'}</button><button class="btn quiet" onclick="home()">Retour à l’accueil</button></aside></div>`;}
function choose(j){if(state.answers[state.index]!==null)return;selected=j;render();document.querySelectorAll('.choice')[j].focus({preventScroll:true});}
function hint(){state.hints[state.index]=true;persist();document.getElementById('hintbox').hidden=false;const b=document.querySelector('.hint-toggle');b.setAttribute('aria-expanded','true');b.textContent='✧ Coup de pouce utilisé';}
function validate(){if(selected===null||state.answers[state.index]!==null)return;state.answers[state.index]=selected;persist();const yes=selected===Q[state.index].answer;render();if(yes)celebrate();document.getElementById('feedback').scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'nearest'});}
function next(){let j=state.index+1;if(j>=TOTAL)j=state.answers.findIndex(x=>x===null);if(j<0)results();else go(j);}
function celebrate(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<18;i++){const e=document.createElement('i');e.className='spark';e.style.setProperty('--dx',Math.cos(i/18*Math.PI*2)*(80+Math.random()*160)+'px');e.style.setProperty('--dy',Math.sin(i/18*Math.PI*2)*140+'px');e.style.background=i%2?'#c5a256':'#83ab67';document.body.append(e);setTimeout(()=>e.remove(),1000);}}
function results(){const n=count(),sc=score();document.getElementById('main').innerHTML=`<section class="result"><div class="card"><div class="card-inner"><span class="eyebrow">${n===TOTAL?'Parcours terminé':'Votre point d’étape'}</span><h1>${n===TOTAL?'Chaque question fait progresser.':'Votre progression, à votre rythme.'}</h1><div class="score">${n===TOTAL?(sc*20/TOTAL).toLocaleString('fr-FR',{maximumFractionDigits:2}):sc}<small> / ${n===TOTAL?'20':n+' validées'}</small></div><p>${n===TOTAL?sc/TOTAL>=.85?'Très belle maîtrise. Prenez le temps d’expliquer vos méthodes.':sc/TOTAL>=.6?'Des bases solides. Les corrections vous aideront à franchir le prochain cap.':'Continuez pas à pas : reprendre une erreur est déjà un progrès.':(TOTAL-n)+' questions restent à explorer.'}</p><p>${sc} bonne${sc>1?'s':''} réponse${sc>1?'s':''} sur ${n} question${n>1?'s':''} validée${n>1?'s':''}.</p><div class="stats">${GROUPS.map((g,k)=>`<div class="stat"><b>${Q.slice(...RANGES[k]).filter(q=>state.answers[q.id-1]===q.answer).length} / ${RANGES[k][1]-RANGES[k][0]}</b><span>${g}</span></div>`).join('')}</div><p class="note">${state.hints.filter(Boolean).length} coup(s) de pouce utilisé(s), sans pénalité. Le score reflète la première réponse validée à chaque question.</p><div class="result-actions">${n<TOTAL?'<button class="btn primary" onclick="go(state.answers.findIndex(x=>x===null))">Continuer le parcours →</button>':''}<button class="btn" onclick="copyLink()">Copier le lien du quiz</button><button class="btn" onclick="shareQuiz()">Partager sur WhatsApp</button><button class="btn quiet" onclick="askReset()">Recommencer</button></div></div></div><div class="review"><h2>Reprendre et comprendre</h2><p class="note">Ouvrez une question pour retrouver votre réponse et son explication.</p><label class="review-filter"><input type="checkbox" onchange="toggleErrors(this.checked)" ${errorsOnly?'checked':''}>Revoir uniquement mes erreurs (${n-sc})</label>${errorsOnly&&n===sc?'<p>Aucune erreur parmi les réponses validées.</p>':''}${Q.filter(q=>state.answers[q.id-1]!==null&&(!errorsOnly||state.answers[q.id-1]!==q.answer)).map(q=>{const a=state.answers[q.id-1],ok=a===q.answer;return `<details><summary>${ok?'✓':'↺'} Question ${q.id} · ${q.title}</summary><p>${fmt(q.text)}</p>${visual(q)}<p class="${ok?'right':'wrong'}">Votre réponse : ${fmt(q.options[a])}</p>${!ok?`<p class="right">Bonne réponse : ${fmt(q.options[q.answer])}</p>`:''}<p>${fmt(q.explain)}</p></details>`;}).join('')}</div></section>`;window.scrollTo({top:0,behavior:'auto'});}
function toggleErrors(checked){const y=window.scrollY;errorsOnly=checked;results();document.querySelector('.review-filter input').focus({preventScroll:true});window.scrollTo({top:y,behavior:'auto'});}
function askReset(){returnFocus=document.activeElement;document.getElementById('modal').hidden=false;document.getElementById('cancelReset').focus();}
function closeReset(){document.getElementById('modal').hidden=true;returnFocus?.focus();}
function resetQuiz(){errorsOnly=false;state=empty();selected=null;persist();document.getElementById('modal').hidden=true;go(0);}
document.addEventListener('keydown',e=>{if(!document.getElementById('modal').hidden){if(e.key==='Escape'){closeReset();return;}if(e.key==='Tab'){const b=document.querySelectorAll('.modal button'),first=b[0],last=b[b.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}}});
home();
</script><noscript><p style="padding:30px">Activez JavaScript dans votre navigateur pour utiliser le QFM interactif.</p></noscript></body></html>
