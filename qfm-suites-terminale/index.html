const KEY='qfm-suites-terminale-v1';const URLQUIZ='https://faicelmaths20.github.io/missaoui-maths/qfm-suites-terminale/';
const GROUPS=['Les fondamentaux','Monotonie et convergence','Calculer les limites','Les 10 défis'];
const FIRE='<svg class="flame" viewBox="0 0 60 75" aria-hidden="true"><path d="M32 2C42 23 19 24 39 38C46 30 45 23 44 19C66 44 56 72 30 73C4 73-2 45 16 28C13 43 24 44 23 31C22 18 32 16 32 2Z" fill="#ffb947"/><path d="M31 36C40 50 26 49 37 59C42 67 34 73 28 71C15 69 14 55 25 47C23 57 30 56 31 36Z" fill="#fff0a3"/></svg>';
const empty=()=>({version:1,index:0,answers:Array(40).fill(null),hints:Array(40).fill(false),started:false});let state=empty(),selected=null,storageOK=true,returnFocus=null;
try{const raw=JSON.parse(localStorage.getItem(KEY));if(raw&&raw.version===1&&Array.isArray(raw.answers)&&raw.answers.length===40&&raw.answers.every(x=>x===null||Number.isInteger(x)&&x>=0&&x<4)&&Array.isArray(raw.hints)&&raw.hints.length===40&&raw.hints.every(x=>typeof x==='boolean')&&Number.isInteger(raw.index)&&raw.index>=0&&raw.index<40){state=raw;}}catch(e){storageOK=false;}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){storageOK=false;}}
function fmt(s){return s.replace(/\{\{([^{}]+)\}\}/g,(_,body)=>{let tag=false,sep=-1;for(let k=0;k<body.length;k++){if(body[k]==='<')tag=true;else if(body[k]==='>')tag=false;else if(body[k]==='/'&&!tag){sep=k;break;}}if(sep<0)return body;const n=body.slice(0,sep),d=body.slice(sep+1),label=(n+' sur '+d).replace(/<[^>]*>/g,'').replace(/"/g,'&quot;');return `<span class="frac" role="math" aria-label="${label}"><span aria-hidden="true">${n}</span><span aria-hidden="true">${d}</span></span>`;});}
function count(){return state.answers.filter(x=>x!==null).length;}function score(){return Q.filter((q,i)=>state.answers[i]===q.answer).length;}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.hidden=true,4000);}
function shareQuiz(){window.open('https://wa.me/?text='+encodeURIComponent('QFM Suites · Terminale spécialité — 40 questions, des coups de pouce et 10 défis. Par Faicel Missaoui :\n'+URLQUIZ),'_blank','noopener,noreferrer');}
async function copyLink(){try{await navigator.clipboard.writeText(URLQUIZ);toast('Lien copié : prêt à partager.');}catch(e){window.prompt('Copiez ce lien pour le partager :',URLQUIZ);}}
function home(){document.getElementById('main').innerHTML=`<section class="hero"><div><span class="pill">TERMINALE SPÉCIALITÉ · SUITES</span><h1>Les suites,<br>du réflexe au <em>défi.</em></h1><p>40 questions pour faire le bilan sur les suites : des premières définitions aux raisonnements de synthèse. Un coup de pouce et une correction expliquée à chaque étape.</p><div class="hero-actions"><button class="btn primary" onclick="begin()">${state.started?'Reprendre · question '+(state.index+1):'Commencer le parcours'} <span aria-hidden="true">→</span></button><button class="btn" onclick="go(30)">Les 10 défis ${FIRE.replace('class="flame"','style="width:19px;height:24px"')}</button></div><p class="note">Une seule bonne réponse. Sans chronomètre. Gardez un brouillon pour les défis. ${count()?count()+(count()===1?' réponse enregistrée sur 40.':' réponses enregistrées sur 40.'):''}</p></div><div class="journey"><div class="journey-top"><div><div class="big-number">40</div><p>questions · 4 étapes</p></div>${FIRE}</div>${GROUPS.map((g,i)=>`<div class="stage-item"><b>${i*10+1}–${i*10+10}</b><span>${g}</span></div>`).join('')}</div></section><div class="legend"><span>Coups de pouce sans pénalité</span><span>Corrections expliquées</span><span>Progression enregistrée sur cet appareil</span></div>`;}
function begin(){go(state.index);}
function go(i){state.started=true;state.index=i;selected=state.answers[i];persist();render();document.getElementById('questionTitle').focus({preventScroll:true});window.scrollTo({top:0,behavior:'auto'});}
function visual(q){if(q.visual==='python')return '<div class="code-wrap"><pre aria-label="Programme Python"><code>def seuil():\n    u = 12\n    n = 0\n    while u &gt;= 6.1:\n        u = 0.5 * u + 3\n        n = n + 1\n    return n</code></pre></div>';return '';}
function render(){const i=state.index,q=Q[i],done=state.answers[i]!==null,n=count(),good=state.answers[i]===q.answer;document.getElementById('main').innerHTML=`<div class="workspace"><div><div class="status"><span>${n} / 40 questions validées</span><b>${score()} bonne${score()>1?'s':''} réponse${score()>1?'s':''}</b></div><div class="track" role="progressbar" aria-valuenow="${n}" aria-valuemin="0" aria-valuemax="40" aria-label="Questions validées"><i style="width:${n/40*100}%"></i></div><section class="card"><div class="card-inner"><div class="question-meta"><span class="counter">QUESTION ${String(i+1).padStart(2,'0')} / 40</span><span class="level ${i>=30?'challenge':''}">${i>=30?'🔥 Défi '+(i-29)+'/10':GROUPS[Math.floor(i/10)]}</span></div><h1 class="question-title" id="questionTitle" tabindex="-1">${q.title}</h1><p class="convention">ℕ = {0 ; 1 ; 2 ; …}. Sauf indication contraire, les limites sont prises lorsque n → +∞.</p><p class="question-text">${fmt(q.text)}</p>${visual(q)}<div class="answers" role="group" aria-label="Choisir une réponse">${q.options.map((v,j)=>`<button class="choice ${selected===j?'selected':''} ${done&&j===q.answer?'good':''} ${done&&j===state.answers[i]&&!good?'bad':''}" ${done?'disabled':''} aria-pressed="${selected===j}" onclick="choose(${j})"><span class="letter">${'ABCD'[j]}</span><span class="value">${fmt(v)}</span><span class="mark" aria-hidden="true">${done&&j===q.answer?'✓':done&&j===state.answers[i]?'×':''}</span></button>`).join('')}</div><button class="hint-toggle" onclick="hint()" aria-expanded="${state.hints[i]}" aria-controls="hintbox">✧ ${state.hints[i]?'Coup de pouce utilisé':'Un coup de pouce ?'}</button><div class="hint-box" id="hintbox" ${state.hints[i]?'':'hidden'}>${fmt(q.hint)}</div><div id="feedback" ${done?'':'hidden'} class="feedback ${good?'success':''}" role="status">${done?`<h3>${good?FIRE+'Bravo, bien raisonné !':'Une étape pour progresser'}</h3>${!good?`<p class="correctline">Bonne réponse : ${fmt(q.options[q.answer])}</p>`:''}<p>${fmt(q.explain)}</p>`:''}</div></div><div class="actions"><button class="btn quiet" onclick="go(${i-1})" ${i===0?'disabled':''}>← Précédente</button><div class="nav-next">${!done?'<button class="btn primary" id="validate" onclick="validate()" '+(selected===null?'disabled':'')+'>Valider</button>':`<button class="btn primary" onclick="${n===40?'results()':'next()'}">${n===40?'Voir mon bilan':i===39?'Continuer le parcours →':'Question suivante →'}</button>`}</div></div></section></div><aside class="sidebar" aria-label="Navigation dans le parcours"><h2>Votre parcours</h2><div class="maps">${GROUPS.map((g,k)=>`<div><p class="map-title">${k===3?'🔥 ':''}${g}</p><div class="grid">${Q.slice(k*10,k*10+10).map((v)=>{let j=v.id-1,a=state.answers[j];return `<button class="dot ${j===i?'current':''} ${a===null?'':a===v.answer?'good':'bad'}" onclick="go(${j})" aria-label="Question ${j+1}${a===null?', à faire':a===v.answer?', réussie':', à revoir'}" ${j===i?'aria-current="step"':''}>${j+1}</button>`;}).join('')}</div></div>`).join('')}</div><p class="key">✓ Vert : réussie · Rose : à revoir<br>Chaque numéro permet de naviguer.</p><p class="save-info">${storageOK?'Progression enregistrée sur cet appareil.':'Enregistrement indisponible : gardez cette page ouverte.'}</p><button class="btn" onclick="results()">${n===40?'Mon bilan final':'Voir ma progression'}</button><button class="btn quiet" onclick="home()">Retour à l’accueil</button></aside></div>`;}
function choose(j){if(state.answers[state.index]!==null)return;selected=j;render();document.querySelectorAll('.choice')[j].focus({preventScroll:true});}
function hint(){state.hints[state.index]=true;persist();document.getElementById('hintbox').hidden=false;const b=document.querySelector('.hint-toggle');b.setAttribute('aria-expanded','true');b.textContent='✧ Coup de pouce utilisé';}
function validate(){if(selected===null||state.answers[state.index]!==null)return;state.answers[state.index]=selected;persist();const yes=selected===Q[state.index].answer;render();if(yes)celebrate();document.getElementById('feedback').scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'nearest'});}
function next(){let j=state.index+1;if(j>=40)j=state.answers.findIndex(x=>x===null);if(j<0)results();else go(j);}
function celebrate(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<18;i++){const e=document.createElement('i');e.className='spark';e.style.setProperty('--dx',Math.cos(i/18*Math.PI*2)*(80+Math.random()*160)+'px');e.style.setProperty('--dy',Math.sin(i/18*Math.PI*2)*140+'px');e.style.background=i%2?'#ffdc85':'#85defa';document.body.append(e);setTimeout(()=>e.remove(),1000);}}
function results(){const n=count(),sc=score();document.getElementById('main').innerHTML=`<section class="result"><div class="card"><div class="card-inner"><span class="eyebrow">${n===40?'Parcours terminé':'Votre point d’étape'}</span><h1>${n===40?'Chaque question fait progresser.':'Votre progression, à votre rythme.'}</h1><div class="score">${sc}<small> / ${n||0} ${n<40?'questions validées':'questions'}</small></div><p>${n===40?sc>=34?'Très belle maîtrise. Prenez le temps d’expliquer vos méthodes.':sc>=24?'Des bases solides. Les corrections vous aideront à franchir le prochain cap.':'Continuez pas à pas : reprendre une erreur est déjà un progrès.':(40-n)+' questions restent à explorer.'}</p><div class="stats">${GROUPS.map((g,k)=>`<div class="stat"><b>${Q.slice(k*10,k*10+10).filter(q=>state.answers[q.id-1]===q.answer).length} / 10</b><span>${g}</span></div>`).join('')}</div><p class="note">${state.hints.filter(Boolean).length} coup(s) de pouce utilisé(s), sans pénalité. Le score reflète la première réponse validée à chaque question.</p><div class="result-actions">${n<40?'<button class="btn primary" onclick="go(state.answers.findIndex(x=>x===null))">Continuer le parcours →</button>':''}<button class="btn" onclick="copyLink()">Copier le lien du quiz</button><button class="btn" onclick="shareQuiz()">Partager sur WhatsApp</button><button class="btn quiet" onclick="askReset()">Recommencer</button></div></div></div><div class="review"><h2>Reprendre et comprendre</h2><p class="note">Ouvrez une question pour retrouver votre réponse et son explication.</p>${Q.filter(q=>state.answers[q.id-1]!==null).map(q=>{const a=state.answers[q.id-1],ok=a===q.answer;return `<details><summary>${ok?'✓':'↺'} Question ${q.id} · ${q.title}</summary><p>${fmt(q.text)}</p>${visual(q)}<p class="${ok?'right':'wrong'}">Votre réponse : ${fmt(q.options[a])}</p>${!ok?`<p class="right">Bonne réponse : ${fmt(q.options[q.answer])}</p>`:''}<p>${fmt(q.explain)}</p></details>`;}).join('')}</div></section>`;window.scrollTo({top:0,behavior:'auto'});}
function askReset(){returnFocus=document.activeElement;document.getElementById('modal').hidden=false;document.getElementById('cancelReset').focus();}
function closeReset(){document.getElementById('modal').hidden=true;returnFocus?.focus();}
function resetQuiz(){state=empty();selected=null;persist();document.getElementById('modal').hidden=true;go(0);}
document.addEventListener('keydown',e=>{if(!document.getElementById('modal').hidden){if(e.key==='Escape'){closeReset();return;}if(e.key==='Tab'){const b=document.querySelectorAll('.modal button'),first=b[0],last=b[b.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}}});
home();
