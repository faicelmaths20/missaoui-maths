<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d0f14"><title>QFM · Second degré · 30 questions</title><meta name="description" content="30 questions progressives vers le niveau avancé : équations, inéquations, discriminant, graphiques et paramètres. Corrections par Faicel Missaoui."><style>
    :root{--bg:#0d0f14;--card:#151a22;--ink:#eee9df;--muted:#9eacb7;--green:#3eb89f;--gold:#d5b96f;--red:#db6258;--line:rgba(255,255,255,.11)}
    *{box-sizing:border-box}html{min-height:100%;background:var(--bg)}body{min-height:100vh;margin:0;color:var(--ink);font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at 8% 0%,rgba(62,184,159,.12),transparent 31rem),radial-gradient(circle at 92% 12%,rgba(213,185,111,.1),transparent 28rem),var(--bg)}
    button,input{font:inherit}.shell{min-height:100vh;display:flex;flex-direction:column;padding:0 20px}.header{width:min(1120px,100%);margin:auto auto 0;min-height:112px;display:grid;grid-template-columns:1.2fr 1fr .65fr;align-items:center;gap:22px;border-bottom:1px solid rgba(213,185,111,.38)}
    .brand{display:flex;align-items:center;gap:13px}.logo{width:68px;height:68px;object-fit:contain;filter:drop-shadow(0 8px 20px rgba(0,0,0,.28))}.name{margin:0;color:#f5ead0;font:700 clamp(1.18rem,2vw,1.48rem) Georgia,serif}.role{margin:4px 0 0;color:#93a1ad;font-size:.76rem}.title{text-align:center}.kicker,.contact span{display:block;color:var(--gold);font-size:.69rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase}.title h1{margin:7px 0 0;font:700 clamp(1.2rem,2.6vw,1.78rem)/1.08 Georgia,serif}.contact{text-align:right}.contact strong{display:block;margin-top:5px;font-size:1.2rem}
    .stage{width:min(920px,100%);margin:auto;flex:1;padding:48px 0 52px}.card{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:25px;background:linear-gradient(145deg,rgba(255,255,255,.035),transparent 42%),var(--card);box-shadow:0 28px 70px rgba(0,0,0,.35)}.card:before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:linear-gradient(var(--green),var(--gold))}.watermark{position:absolute;right:-45px;bottom:-66px;width:270px;height:270px;object-fit:contain;opacity:.035;pointer-events:none}
    .inside{position:relative;z-index:1;padding:30px 34px}.badge{display:inline-flex;align-items:center;border:1px solid rgba(62,184,159,.34);border-radius:999px;padding:5px 10px;background:rgba(62,184,159,.12);color:#88dfcc;font-size:.75rem;font-weight:700}.hero{min-height:520px;display:grid;align-content:center}.hero h2{max-width:690px;margin:16px 0 10px;font:700 clamp(2rem,5vw,3.45rem)/1.05 Georgia,serif;color:#f6f0e5}.lead{color:#aeb9c2;line-height:1.6}.skills{display:flex;flex-wrap:wrap;gap:9px;margin:22px 0}.skills span{padding:8px 12px;border:1px solid rgba(213,185,111,.24);border-radius:999px;background:rgba(213,185,111,.07);color:#dfcc98;font-size:.78rem}.field{display:grid;gap:9px;max-width:520px;color:#dfe5e9;font-size:.86rem;font-weight:700}.field em{color:#7f8d98;font-style:normal;font-weight:400}.field input{height:48px;border:1px solid rgba(255,255,255,.13);border-radius:12px;padding:0 14px;background:rgba(5,8,12,.36);color:#f4f0e8;outline:none}.field input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(62,184,159,.15)}
    .btn{min-height:48px;border:0;border-radius:13px;padding:0 20px;cursor:pointer;font-weight:800}.primary{margin-top:22px;background:var(--green);color:#06140f;box-shadow:0 12px 26px rgba(62,184,159,.2)}.primary:hover{background:#56c9b1}.btn:disabled{cursor:not-allowed;opacity:.45}.progressline{margin:0 4px 18px}.progresscopy{display:flex;justify-content:space-between;margin-bottom:10px;color:#9cabb6;font-size:.8rem;font-weight:700}.progresscopy strong{color:var(--gold)}.bar{height:7px;overflow:hidden;border-radius:99px;background:rgba(255,255,255,.08)}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--gold));transition:width .25s}
    .level{border-color:rgba(213,185,111,.33);background:rgba(213,185,111,.06);color:#d9c387}.question{margin:13px 0 22px;color:#f6f1e8;font:700 clamp(1.36rem,3vw,1.82rem)/1.35 Georgia,serif}.figure{display:block;width:min(520px,100%);height:auto;margin:0 auto 22px;border:1px solid rgba(255,255,255,.08);border-radius:19px;background:#111923;box-shadow:0 16px 32px rgba(0,0,0,.22)}
    .vartable{width:min(610px,100%);margin:0 auto 22px;display:grid;grid-template-columns:95px 1fr;overflow:hidden;border:1px solid rgba(255,255,255,.16);border-radius:16px;background:#111923}.vartable>div{min-height:52px;display:flex;align-items:center;border-bottom:1px solid rgba(255,255,255,.12)}.vartable>div:nth-last-child(-n+2){border-bottom:0}.vlabel{justify-content:center;border-right:1px solid rgba(255,255,255,.12);font:italic 1rem Georgia,serif}.vaxis,.varrows{justify-content:space-between;padding:0 28px}.vaxis strong,.varrows strong{color:#f1d792}.varrows{min-height:76px!important;color:#67cfb9;font-size:2rem}
    .answers{display:grid;gap:11px}.choice{min-height:58px;display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:11px;padding:12px 15px;border:1px solid rgba(255,255,255,.1);border-radius:14px;background:rgba(7,11,15,.38);cursor:pointer;transition:.16s}.choice:hover{transform:translateY(-1px);border-color:rgba(62,184,159,.45);background:rgba(62,184,159,.06)}.choice.selected{border-color:rgba(62,184,159,.78);background:rgba(62,184,159,.11)}.choice.correct{border-color:rgba(62,184,159,.85);background:rgba(62,184,159,.13)}.choice.wrong{border-color:rgba(219,98,88,.82);background:rgba(219,98,88,.12)}.letter{width:32px;height:32px;display:grid;place-items:center;border-radius:9px;background:rgba(255,255,255,.06);color:var(--gold);font-weight:800}.option{color:#e6e9e9;font-size:.94rem;line-height:1.5}.mark{font-size:1.2rem}.correct .mark{color:#58cdb4}.wrong .mark{color:#ef7f74}
    .feedback{margin-top:18px;padding:15px 17px;border:1px solid;border-radius:15px}.feedback.good{border-color:rgba(62,184,159,.42);background:rgba(62,184,159,.08);color:#75d8c3}.feedback.bad{border-color:rgba(219,98,88,.42);background:rgba(219,98,88,.08);color:#ef9188}.feedback strong{display:block}.feedback p{margin:8px 0 0;color:#c5cfd6;font-size:.9rem;line-height:1.6}.actions{display:flex;justify-content:flex-end}
    .result{text-align:center}.score{width:154px;height:154px;margin:18px auto;display:grid;place-content:center;border:2px solid rgba(62,184,159,.52);border-radius:50%;background:radial-gradient(circle,rgba(62,184,159,.15),rgba(62,184,159,.025));box-shadow:0 0 0 10px rgba(62,184,159,.045)}.score strong{font:700 3.1rem/.9 Georgia,serif;color:#f4ead0}.score span{color:#8fdcc9;font-weight:700}.result h2{font:700 2rem Georgia,serif}.resultlead{color:#aab6bf}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}.stats div{display:grid;gap:4px;padding:18px;border:1px solid rgba(255,255,255,.09);border-radius:15px;background:rgba(8,12,17,.34)}.stats strong{color:#d8c17d;font-size:1.45rem}.stats span{color:#8f9da8;font-size:.76rem}.review{text-align:left}.review h3{font:700 1.35rem Georgia,serif}.reviewitem{margin:10px 0;padding:16px;border:1px solid rgba(255,255,255,.09);border-radius:15px;background:rgba(7,10,14,.31)}.reviewitem b{color:#d9c27f}.reviewitem p{margin:6px 0;font-size:.84rem;line-height:1.5}.wrongtext{color:#e88e86}.righttext{color:#6fd2bd}.explain{color:#9caab5}.resultactions{display:flex;justify-content:center;flex-wrap:wrap;gap:11px;margin-top:22px}.whatsapp{background:#20b862;color:#fff}.restart{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.025);color:#e5e8e8}
    .footer{width:min(1120px,100%);margin:auto;padding:22px 0 26px;display:flex;justify-content:space-between;gap:20px;border-top:1px solid rgba(255,255,255,.07);color:#687783;font-size:.7rem}
    @media(max-width:760px){.shell{padding:0 13px}.header{min-height:auto;grid-template-columns:1fr auto;gap:15px;padding:15px 0 16px}.logo{width:53px;height:53px}.role{font-size:.64rem}.title{grid-column:1/-1;grid-row:2;padding-top:13px;border-top:1px solid rgba(255,255,255,.06)}.title h1{font-size:1.32rem}.contact strong{font-size:1rem}.stage{padding:26px 0 34px}.card{border-radius:19px}.inside{padding:25px 20px}.hero h2{font-size:2.25rem}.skills{display:grid}.vartable{grid-template-columns:70px 1fr}.vaxis,.varrows{padding:0 15px}.choice{grid-template-columns:30px 1fr auto;padding:11px 12px}.option{font-size:.86rem}.stats{grid-template-columns:1fr}.resultactions{display:grid}.resultactions button{width:100%}.footer{flex-direction:column;text-align:center}}
  

html{font-size:18px}body{line-height:1.5}.header{margin:0 auto}.role{font-size:.78rem}.kicker,.contact span{font-size:.72rem}.stage{padding-top:30px}.hero{min-height:0}.hero h2{line-height:1.12}.badge{font-size:.8rem}.skills span{font-size:.9rem}.field{font-size:1rem}.field input{font-size:1rem}.question{font-size:1.45rem;line-height:1.6}.math{font-family:Cambria,Georgia,serif;font-size:1.1em;font-weight:500}.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.22;margin:0 .18em;font-family:Cambria,Georgia,serif}.frac>span{padding:.04em .2em}.frac>span+span{border-top:1px solid currentColor}.choice{width:100%;text-align:left;color:var(--ink);font-family:inherit}.choice:disabled{cursor:default;opacity:1}.option{font-size:1rem;overflow-wrap:anywhere}.choice:hover:disabled{transform:none}.feedback p,.reviewitem p{font-size:1rem;line-height:1.75}.feedback{scroll-margin-top:20px}.hint{font-size:.85rem;color:#b8c4cc}.progresscopy{font-size:.9rem}.plot{margin:0 auto 24px;max-width:560px}.figure{width:100%;margin-bottom:8px}.plot figcaption{font-size:.8rem;text-align:center;color:#b8c4cc}.curve{color:#66e0c5}.linelegend{color:#ff9d95}.levellegend{color:#f1d792}.reviewitem h4{font-size:1.12rem;font-weight:500}.explain{color:#c5cfd6}.footer{font-size:.78rem;color:#a4b2bc}.btn{padding:12px 20px}.whatsapp{background:#188b49}.resultactions{align-items:center}button:focus-visible{outline:3px solid #f1d792;outline-offset:4px}.watermark{opacity:.045}.contact a{color:inherit;text-decoration:none}.inside{overflow-wrap:break-word}.stats span{font-size:.85rem}

ript>const frac=(n,d)=>`<span class="frac"><span>${n}</span><span>${d}</span></span>`;
const m=s=>`<span class="math">${s}</span>`;
const Q=[];
function question(l,q,right,others,e,trap,f){Q.push({l,q,o:[right,...others],a:0,e,trap,f});}
question('1 · Sans discriminant','Résoudre dans ℝ : '+m('(3x − 2)(x + 5) = 0'),m('{−5 ; '+frac('2','3')+'}'),[m('{5 ; '+frac('2','3')+'}'),m('{−5 ; '+frac('3','2')+'}'),m('{−5}')],'Un produit est nul si et seulement si au moins un facteur est nul. On obtient x = −5 ou 3x = 2, donc x = '+frac('2','3')+'.','Ne pas inverser le numérateur et le dénominateur en résolvant 3x = 2.');
question('1 · Deux racines carrées','Sans discriminant, résoudre : '+m('(2x − 3)² = 25'),m('{−1 ; 4}'),[m('{4}'),m('{−4 ; 1}'),m('{−11 ; 14}')],'2x − 3 = 5 ou 2x − 3 = −5. Les deux équations donnent respectivement x = 4 et x = −1.','L’égalité A² = 25 donne A = 5 ou A = −5, pas seulement A = 5.');
question('1 · Factoriser sans perdre une solution','Résoudre : '+m('x² = 7x'),m('{0 ; 7}'),[m('{7}'),m('{−7 ; 7}'),m('{0 ; −7}')],'x² − 7x = x(x − 7) = 0. Les solutions sont 0 et 7.','Diviser par x ferait perdre la solution x = 0.');
question('1 · Signe d’un carré','Résoudre dans ℝ : '+m('(x − 4)² + 6 = 0'),m('∅'),[m('{4 − √6 ; 4 + √6}'),m('{4}'),m('ℝ')],'Pour tout réel x, (x − 4)² ≥ 0, donc (x − 4)² + 6 ≥ 6 > 0. Il n’y a aucune solution réelle.','Un carré réel ne peut pas être égal à −6.');
question('1 · Différence de deux carrés','Sans développer, résoudre : '+m('(x + 2)² − (3x − 1)² = 0'),m('{−'+frac('1','4')+' ; '+frac('3','2')+'}'),[m('{'+frac('1','4')+' ; '+frac('3','2')+'}'),m('{−'+frac('1','4')+' ; −'+frac('3','2')+'}'),m('{'+frac('3','2')+'}')],'A² − B² = (A − B)(A + B). Ici, on obtient (3 − 2x)(4x + 1) = 0, donc x = '+frac('3','2')+' ou x = −'+frac('1','4')+'.','L’égalité A² = B² signifie A = B ou A = −B.');
question('1 · Facteur commun','Résoudre : '+m('(x − 1)(x + 4) = (x − 1)(2x − 3)'),m('{1 ; 7}'),[m('{7}'),m('{1 ; −7}'),m('ℝ')],'Tout ramener à gauche donne (x − 1)[x + 4 − (2x − 3)] = (x − 1)(7 − x) = 0.','On ne simplifie pas par x − 1 avant d’avoir traité le cas x = 1.');
question('2 · Calcul du discriminant','Quel est le discriminant de '+m('−3x² + 2x + 5')+' ?',m('64'),[m('−56'),m('−64'),m('16')],'a = −3, b = 2, c = 5. Ainsi Δ = b² − 4ac = 4 − 4 × (−3) × 5 = 64.','Le produit ac est négatif : soustraire 4ac revient ici à ajouter 60.');
question('2 · Racines rationnelles','Résoudre : '+m('2x² + 5x − 3 = 0'),m('{−3 ; '+frac('1','2')+'}'),[m('{3 ; −'+frac('1','2')+'}'),m('{−6 ; 1}'),m('{−3 ; −'+frac('1','2')+'}')],'Δ = 25 + 24 = 49. Les racines sont '+frac('−5 − 7','4')+' = −3 et '+frac('−5 + 7','4')+' = '+frac('1','2')+'.','Le dénominateur est 2a = 4, et non a = 2.');
question('2 · Racines exactes','Quel est l’ensemble solution de '+m('3x² − 4x − 2 = 0')+' ?',m('{'+frac('2 − √10','3')+' ; '+frac('2 + √10','3')+'}'),[m('{'+frac('4 − √10','3')+' ; '+frac('4 + √10','3')+'}'),m('{'+frac('2 − √10','6')+' ; '+frac('2 + √10','6')+'}'),m('{2 − √10 ; 2 + √10}')],'Δ = 16 + 24 = 40. Comme √40 = 2√10, '+frac('4 ± √40','6')+' = '+frac('2 ± √10','3')+'.','La simplification d’une fraction porte sur tout son numérateur.');
question('2 · Racine double','Résoudre : '+m('9x² − 12x + 4 = 0'),m('{'+frac('2','3')+'}'),[m('{−'+frac('2','3')+'}'),m('{−'+frac('2','3')+' ; '+frac('2','3')+'}'),m('∅')],'Δ = 144 − 144 = 0. Le trinôme est (3x − 2)² ; sa seule racine réelle est '+frac('2','3')+'.','Une racine double est une seule valeur réelle, pas deux valeurs opposées.');
question('2 · Absence de racine réelle','Résoudre dans ℝ : '+m('−2x² + 4x − 5 = 0'),m('∅'),[m('{1}'),m('{1 − √6 ; 1 + √6}'),m('ℝ')],'Δ = 16 − 40 = −24 < 0. On peut aussi écrire −2(x − 1)² − 3, qui est toujours strictement négatif.','Δ < 0 exclut les racines réelles ; cela ne signifie pas que le trinôme est nul partout.');
question('2 · Équation et domaine','Résoudre dans son domaine : '+m(frac('x² − 5x + 6','x − 2')+' = 0'),m('{3}'),[m('{2 ; 3}'),m('{2}'),m('∅')],'Le domaine exclut 2. Le numérateur vaut (x − 2)(x − 3), mais seule la racine 3 est autorisée ; le dénominateur y vaut 1.','Un quotient n’est nul que si son numérateur est nul et son dénominateur non nul.');
question('3 · Inégalité stricte','Résoudre : '+m('x² − 6x + 5 < 0'),m(']1 ; 5['),[m('[1 ; 5]'),m(']−∞ ; 1[ ∪ ]5 ; +∞['),m('ℝ')],'x² − 6x + 5 = (x − 1)(x − 5). Le coefficient dominant est positif : le signe est négatif entre 1 et 5.','Le signe < exclut les deux racines.');
question('3 · Coefficient dominant négatif','Résoudre : '+m('−2x² − 2x + 12 ≥ 0'),m('[−3 ; 2]'),[m(']−∞ ; −3] ∪ [2 ; +∞['),m(']−3 ; 2['),m('[−2 ; 3]')],'−2x² − 2x + 12 = −2(x + 3)(x − 2). Le signe est positif entre les racines −3 et 2, et nul aux bornes.','Le facteur −2 inverse le signe du produit (x + 3)(x − 2).');
question('3 · Racine double et signe','Résoudre : '+m('(2x + 1)² > 0'),m('ℝ ∖ {−'+frac('1','2')+'}'),[m('ℝ'),m(']−'+frac('1','2')+' ; +∞['),m('{−'+frac('1','2')+'}')],'Le carré est strictement positif sauf quand 2x + 1 = 0, c’est-à-dire x = −'+frac('1','2')+'.','La racine double est exclue, mais le signe ne change pas de part et d’autre.');
question('3 · Sans racine, mais quel signe ?','Résoudre : '+m('x² + 2x + 5 ≤ 0'),m('∅'),[m('ℝ'),m('{−1}'),m('[−3 ; 1]')],'x² + 2x + 5 = (x + 1)² + 4 ≥ 4. Le trinôme ne peut donc pas être négatif ou nul.','Ne pas confondre « aucune racine » avec « tous les réels sont solutions ».');
question('4 · Lecture graphique','Sur le domaine '+m('[−2 ; 4]')+', résoudre graphiquement '+m('f(x) ≥ 0')+'.',m('[−1 ; 3]'),[m(']−1 ; 3['),m('[−2 ; −1] ∪ [3 ; 4]'),m('[0 ; 2]')],'La courbe est au-dessus de l’axe des abscisses entre −1 et 3. Les intersections sont incluses car l’inégalité est large.','Lire les abscisses des points, et non leurs ordonnées.',{a:-1,b:2,c:3,xmin:-2,xmax:4,ymin:-6,ymax:5,marks:[[-1,0],[3,0]],label:'C_f'});
question('4 · Intersections avec l’axe','La courbe ci-dessous est donnée sur '+m('[−4 ; 2]')+'. Résoudre '+m('g(x) = 0')+'.',m('{−3 ; 1}'),[m('{−1 ; −4}'),m('[−3 ; 1]'),m('{−1}')],'Les points où la courbe coupe l’axe des abscisses ont pour abscisses −3 et 1. Ce sont les deux solutions de g(x) = 0.','Une équation demande ici deux valeurs, pas tous les points de l’intervalle entre elles.',{a:1,b:2,c:-3,xmin:-4,xmax:2,ymin:-5,ymax:6,marks:[[-3,0],[1,0]],label:'C_g'});
question('4 · Un niveau tangent','Sur '+m('[−2 ; 4]')+', résoudre '+m('f(x) < 2')+' à l’aide du graphique.',m('[−2 ; 1[ ∪ ]1 ; 4]'),[m('[−2 ; 4]'),m('{1}'),m(']−2 ; 1[ ∪ ]1 ; 4[')],'Le maximum 2 est atteint uniquement en x = 1. Toutes les autres abscisses du domaine donnent f(x) < 2 ; −2 et 4 sont donc inclus.','Une inégalité stricte n’exclut pas automatiquement les bornes du domaine.',{a:-1,b:2,c:1,xmin:-2,xmax:4,ymin:-8,ymax:4,h:2,marks:[[1,2]],label:'C_f'});
question('4 · Comparer deux courbes','Sur '+m('[−3 ; 4]')+', pour quelles abscisses a-t-on '+m('f(x) ≤ g(x)')+' ?',m('[−2 ; 3]'),[m('[−3 ; −2] ∪ [3 ; 4]'),m(']−2 ; 3['),m('[−1 ; 3]')],'La parabole C_f est sous la droite C_g entre les points d’intersection d’abscisses −2 et 3. Les points d’égalité sont inclus.','Comparer f et g revient à regarder laquelle des deux courbes est la plus haute, pas leur position par rapport à y = 0.',{a:1,b:-2,c:-3,xmin:-3,xmax:4,ymin:-5,ymax:7,line:[-1,3],marks:[[-2,5],[3,0]],label:'C_f'});
question('4 · Discriminant sur un graphique','La parabole représente un trinôme '+m('ax² + bx + c')+'. Que peut-on affirmer ?',m('a < 0 et Δ = 0'),[m('a > 0 et Δ = 0'),m('a < 0 et Δ > 0'),m('a < 0 et Δ < 0')],'La parabole est tournée vers le bas : a < 0. Elle touche l’axe en un seul point, son sommet : le trinôme possède une racine double, donc Δ = 0.','Toucher l’axe en un point n’est pas la même chose que ne jamais le rencontrer.',{a:-1,b:-4,c:-4,xmin:-5,xmax:1,ymin:-10,ymax:2,marks:[[-2,0]],label:'C_f'});
question('4 · Comparer à un niveau non nul','Sur '+m('[−2 ; 4]')+', résoudre graphiquement '+m('f(x) ≥ −3')+'.',m('[−2 ; 0] ∪ [2 ; 4]'),[m('[0 ; 2]'),m('[−2 ; 0[ ∪ ]2 ; 4]'),m('[−1 ; 3]')],'La courbe rencontre y = −3 pour x = 0 et x = 2. Elle est au-dessus ou sur cette droite à l’extérieur de [0 ; 2], dans le domaine donné.','Pour comparer à −3, il faut utiliser la droite y = −3 et non l’axe des abscisses.',{a:1,b:-2,c:-3,xmin:-2,xmax:4,ymin:-5,ymax:6,h:-3,marks:[[0,-3],[2,-3]],label:'C_f'});
question('4 · Retrouver le trinôme','Les trois points marqués ont les coordonnées exactes '+m('(−2 ; 0), (3 ; 0), (0 ; −3)')+'. Quelle expression correspond à la courbe ?',m(frac('1','2')+'(x + 2)(x − 3)'),[m('(x + 2)(x − 3)'),m('−'+frac('1','2')+'(x + 2)(x − 3)'),m(frac('1','2')+'(x − 2)(x + 3)')],'Les racines imposent f(x) = a(x + 2)(x − 3). Puis f(0) = −6a = −3 donne a = '+frac('1','2')+'.','Les racines déterminent les facteurs, mais un troisième point est nécessaire pour déterminer a.',{a:.5,b:-.5,c:-3,xmin:-3,xmax:4,ymin:-4,ymax:5,marks:[[-2,0],[3,0],[0,-3]],label:'C_f'});
question('5 · Double inéquation','Résoudre '+m('−1 ≤ x² − 4x + 2 < 2')+'.',m(']0 ; 1] ∪ [3 ; 4['),[m('[0 ; 1[ ∪ ]3 ; 4]'),m('[1 ; 3]'),m(']0 ; 4[')],'La forme canonique est (x − 2)² − 2. On cherche 1 ≤ (x − 2)² < 4, soit −2 < x − 2 ≤ −1 ou 1 ≤ x − 2 < 2. Ajouter 2 donne les deux intervalles indiqués.','Les deux inégalités doivent être vérifiées simultanément ; les bornes n’ont pas toutes le même statut.');
question('5 · Quotient et signes','Résoudre dans son domaine : '+m(frac('x² − 4','x − 1')+' ≥ 0'),m('[−2 ; 1[ ∪ [2 ; +∞['),[m('[−2 ; 1] ∪ [2 ; +∞['),m(']−∞ ; −2] ∪ ]1 ; 2]'),m('[−2 ; 2]')],'On exclut 1 et on factorise le numérateur : (x − 2)(x + 2). Le quotient a successivement les signes −, +, −, + sur les intervalles séparés par −2, 1 et 2. Les zéros −2 et 2 sont inclus, mais 1 reste interdit.','Ne jamais multiplier par x − 1 sans tenir compte de son signe.');
question('5 · Contraintes simultanées','Résoudre le système :<br>'+m('x² − 5x + 4 ≤ 0')+'<br>'+m('x² − x − 2 > 0'),m(']2 ; 4]'),[m('[1 ; 4]'),m('[2 ; 4]'),m(']−∞ ; −1[ ∪ [1 ; +∞[')],'La première condition donne [1 ; 4]. La seconde donne ]−∞ ; −1[ ∪ ]2 ; +∞[. Leur intersection est ]2 ; 4].','Un système impose une intersection, et x = 2 est exclu par la seconde inégalité.');
question('6 · Paramètre et signe global','Pour quelles valeurs de '+m('m')+' le trinôme '+m('x² − 2mx + m + 2')+' est-il strictement positif pour tout réel '+m('x')+' ?',m('m ∈ ]−1 ; 2['),[m('m ∈ [−1 ; 2]'),m('m ∈ ]−∞ ; −1[ ∪ ]2 ; +∞['),m('m ∈ ℝ')],'a = 1 > 0. La stricte positivité sur ℝ équivaut à Δ < 0. Or Δ = 4(m − 2)(m + 1), négatif pour −1 < m < 2.','Aux bornes m = −1 et m = 2, le trinôme s’annule : il n’est pas strictement positif partout.');
question('6 · Quand le degré change','Pour quelles valeurs de '+m('m')+' l’équation '+m('(m − 1)x² + 2x + 1 = 0')+' admet-elle exactement une solution réelle ?',m('m ∈ {1 ; 2}'),[m('m = 2 uniquement'),m('m = 1 uniquement'),m('m ≤ 2')],'Si m = 1, l’équation devient 2x + 1 = 0 : une solution. Si m ≠ 1, son discriminant est Δ = 8 − 4m ; une racine double exige m = 2.','Avant d’utiliser le discriminant, vérifier que le coefficient de x² n’est pas nul.');
question('6 · Modélisation','Un rectangle a un périmètre de 28 m. Un de ses côtés mesure '+m('x')+' mètres. Pour quelles valeurs de '+m('x')+' son aire est-elle au moins 45 m² ?',m('x ∈ [5 ; 9]'),[m('x ∈ ]0 ; 5] ∪ [9 ; 14['),m('x ∈ [7 ; 9]'),m('x ∈ ]5 ; 9[')],'L’autre côté mesure 14 − x et le domaine est 0 < x < 14. L’aire vérifie x(14 − x) ≥ 45, soit (x − 5)(x − 9) ≤ 0. On obtient [5 ; 9].','x désigne un côté quelconque, pas nécessairement le plus grand. Il n’y a donc pas à imposer x ≥ 7.');
question('6 · Synthèse avec paramètre','Pour quelles valeurs de '+m('m')+' l’équation '+m('x² − (m + 1)x + m = 0')+' possède-t-elle deux solutions réelles distinctes et strictement positives ?',m('m ∈ ]0 ; 1[ ∪ ]1 ; +∞['),[m('m ∈ [0 ; 1[ ∪ ]1 ; +∞['),m('m ∈ ]1 ; +∞['),m('m ∈ ℝ ∖ {1}')],'Le membre de gauche se factorise en (x − 1)(x − m). Les racines sont 1 et m. Elles sont distinctes si m ≠ 1 et toutes deux strictement positives si m > 0.','Exclure m = 0 (racine non positive) et m = 1 (racine double), mais garder les valeurs 0 < m < 1.');
// Balanced, fixed answer positions; each correct answer remains unique.
const positions=[1,3,0,2,0,2,3,1,2,0,1,3,3,1,2,0,1,2,0,3,2,3,1,0,0,2,1,3,1,2];
Q.forEach((q,n)=>{const correct=q.o.shift();q.o.splice(positions[n],0,correct);q.a=positions[n];q.id=n+1;});

const app=document.getElementById('app'),L=['A','B','C','D'];
const logo=document.querySelector('.logo').src;
let i=0,answers=Array(Q.length).fill(null),student='';
const escapeHTML=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const good=()=>answers.filter((v,n)=>v===Q[n].a).length;
const note=()=>Number((good()*20/Q.length).toFixed(1)).toLocaleString('fr-FR');
function figure(f,id){
 if(!f)return '';
 const W=480,H=350,left=48,right=25,top=24,bottom=42;
 const X=x=>left+(x-f.xmin)/(f.xmax-f.xmin)*(W-left-right),Y=y=>H-bottom-(y-f.ymin)/(f.ymax-f.ymin)*(H-top-bottom);
 const line=(x1,y1,x2,y2,attr='')=>`<line x1="${X(x1)}" y1="${Y(y1)}" x2="${X(x2)}" y2="${Y(y2)}" ${attr}/>`;
 let grid='',ticks='';
 for(let x=f.xmin;x<=f.xmax;x++){grid+=line(x,f.ymin,x,f.ymax,'stroke="#ffffff18"');ticks+=`<text x="${X(x)}" y="${H-15}" text-anchor="middle">${x}</text>`;}
 for(let y=f.ymin;y<=f.ymax;y++){grid+=line(f.xmin,y,f.xmax,y,'stroke="#ffffff18"');if(y%2===0)ticks+=`<text x="${left-9}" y="${Y(y)+6}" text-anchor="end">${y}</text>`;}
 const path=Array.from({length:301},(_,n)=>{const x=f.xmin+(f.xmax-f.xmin)*n/300;return `${n?'L':'M'}${X(x)},${Y(f.a*x*x+f.b*x+f.c)}`;}).join(' ');
 let extra='';if(f.h!==undefined)extra+=line(f.xmin,f.h,f.xmax,f.h,'stroke="#f1d792" stroke-width="3" stroke-dasharray="8 5"');
 if(f.line)extra+=line(f.xmin,f.line[0]*f.xmin+f.line[1],f.xmax,f.line[0]*f.xmax+f.line[1],'stroke="#ff9d95" stroke-width="3" stroke-dasharray="8 5"');
 return `<figure class="plot"><svg class="figure" viewBox="0 0 ${W} ${H}" role="img" aria-label="Graphique gradué de ${f.label}, abscisses de ${f.xmin} à ${f.xmax}. Une unité par carreau."><defs><clipPath id="clip${id}"><rect x="${left}" y="${top}" width="${W-left-right}" height="${H-top-bottom}"/></clipPath></defs>${grid}<g stroke="#b8c4cf" stroke-width="1.8">${line(f.xmin,0,f.xmax,0)}${line(0,f.ymin,0,f.ymax)}</g><g clip-path="url(#clip${id})">${extra}<path d="${path}" fill="none" stroke="#66e0c5" stroke-width="3.5"/></g>${f.marks.map(([x,y])=>`<circle cx="${X(x)}" cy="${Y(y)}" r="5" fill="#f1d792" stroke="#101820" stroke-width="2"/>`).join('')}<g fill="#e4ebf1" font-family="Arial" font-size="19">${ticks}<text x="${W-18}" y="${Y(0)-9}">x</text><text x="${X(0)+9}" y="20">y</text></g></svg><figcaption><span class="curve">━━ ${f.label.replace('_','')}</span>${f.line?' · <span class="linelegend">┄┄ Cg</span>':''}${f.h!==undefined?` · <span class="levellegend">┄┄ y = ${f.h}</span>`:''}<br>Une unité par carreau. Les points dorés sont exacts.</figcaption></figure>`;
}
function card(content){return `<div class="card"><img class="watermark" src="${logo}" alt=""><div class="inside">${content}</div></div>`;}
function startScreen(){app.innerHTML=card(`<div class="hero"><span class="badge">QFM · Parcours vers le niveau avancé</span><h2>Équations &amp; inéquations du second degré</h2><p class="lead">30 questions · 7 graphiques · correction immédiate · note sur 20</p><div class="skills"><span>Avec et sans discriminant</span><span>Signes et graphiques</span><span>Paramètres et modélisation</span></div><p class="lead">Une seule réponse exacte par question. Des bases indispensables aux défis avancés. Travaille dans ℝ, sans calculatrice.</p><label class="field">Ton prénom <em>(facultatif, non enregistré)</em><input id="student" maxlength="60" autocomplete="given-name" placeholder="Ton prénom"></label><button class="btn primary" onclick="start()">Commencer les 30 questions →</button></div>`);}
function start(){student=document.getElementById('student').value.trim();render();}
function render(){const q=Q[i],selected=answers[i],checked=selected!==null,done=answers.filter(v=>v!==null).length;app.innerHTML=`<div class="progressline"><div class="progresscopy"><span>Question ${i+1} / ${Q.length}</span><strong>Score : ${good()} / ${done}</strong></div><div class="bar" role="progressbar" aria-label="Questions traitées" aria-valuemin="0" aria-valuemax="30" aria-valuenow="${done}"><i style="width:${done/Q.length*100}%"></i></div></div>`+card(`<span class="badge level">${q.l}</span><h2 class="question">${q.q}</h2>${figure(q.f,q.id)}<div class="answers" role="group" aria-label="Choisir une réponse">${q.o.map((o,n)=>`<button class="choice ${checked&&n===q.a?'correct':''} ${checked&&n===selected&&n!==q.a?'wrong':''}" onclick="choose(${n})" ${checked?'disabled':''}><span class="letter">${L[n]}</span><span class="option">${o}</span><span class="mark">${checked&&n===q.a?'✓':checked&&n===selected?'✕':''}</span></button>`).join('')}</div><div id="feedback" aria-live="polite">${checked?`<div class="feedback ${selected===q.a?'good':'bad'}"><strong>${selected===q.a?'✓ Bonne réponse':'✕ À corriger'} · Réponse ${L[q.a]}</strong><p>${q.e}</p><p><b>À retenir :</b> ${q.trap}</p></div><div class="actions"><button id="next" class="btn primary" onclick="next()">${i===Q.length-1?'Voir ma note sur 20':'Question suivante'} →</button></div>`:'<p class="hint">Choisis une réponse : la correction s’affiche immédiatement.</p>'}</div>`);}
function choose(n){if(answers[i]!==null)return;answers[i]=n;render();document.getElementById('next').focus({preventScroll:true});}
function next(){if(answers[i]===null)return;if(i===Q.length-1)result();else{i++;render();}window.scrollTo(0,0);}
function result(){const count=good(),bad=Q.length-count;app.innerHTML=card(`<div class="result"><span class="badge">QFM · Bilan</span><div class="score"><strong>${note()}</strong><span>/20</span></div><h2>${student?escapeHTML(student)+', quiz terminé !':'Quiz terminé !'}</h2><p class="resultlead">${count>=27?'Excellent travail !':count>=21?'Très bon travail. Consolide les derniers points.':'Reprends tes erreurs : chaque correction explique la méthode.'}</p><div class="stats"><div><strong>${count}/30</strong><span>bonnes réponses</span></div><div><strong>${bad}</strong><span>questions à revoir</span></div><div><strong>${Math.round(count/30*100)} %</strong><span>de réussite</span></div></div><p class="hint">Barème : bonnes réponses × 20 ÷ 30, arrondi au dixième. Aucune pénalité.</p><div class="resultactions">${bad?'<button class="btn restart" id="reviewbutton" onclick="review()">Revoir uniquement mes erreurs</button>':'<p class="righttext">Sans faute : les 30 questions sont réussies.</p>'}<button class="btn whatsapp" onclick="share()">Partager sur WhatsApp</button><button class="btn restart" onclick="restart()">Recommencer</button></div><section id="review" class="review"></section></div>`);}
function review(){const el=document.getElementById('review');el.innerHTML='<h3>Mes erreurs expliquées</h3>'+Q.map((q,n)=>answers[n]===q.a?'':`<article class="reviewitem"><b>Question ${n+1} · ${q.l}</b><h4>${q.q}</h4>${figure(q.f,'review'+q.id)}<p class="wrongtext">Ta réponse : ${q.o[answers[n]]}</p><p class="righttext">Réponse exacte : ${q.o[q.a]}</p><p class="explain">${q.e}</p><p class="explain"><b>À retenir :</b> ${q.trap}</p></article>`).join('');document.getElementById('reviewbutton').hidden=true;el.scrollIntoView({behavior:'smooth'});}
function share(){const text=`J’ai obtenu ${note()}/20 au QFM « Second degré — 30 questions »${student?' ('+student+')':''}. À toi de jouer ! ${location.href.split('#')[0]}`;window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank','noopener,noreferrer');}
function restart(){i=0;answers=Array(Q.length).fill(null);student='';startScreen();window.scrollTo(0,0);}
startScreen();
</script></body></html>
