<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Système Tunisien — Missaoui Maths</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1A3A5C">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #1A3A5C;
    --tunisia: #C7385F;
    --tunisia-dark: #8B2745;
    --accent: #E8612C;
    --accent-light: #F6AD55;
    --muted: #5B7B9A;
    --light: #FFF5F7;
    --bg: #FAFAF7;
    --text: #1A202C;
    --border: #E2E8F0;
    --shadow: 0 4px 14px rgba(199, 56, 95, 0.12);
    --shadow-lg: 0 20px 50px rgba(199, 56, 95, 0.18);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }

  /* ── Topbar ── */
  .topbar {
    background: white;
    padding: 1rem 1.5rem;
    box-shadow: var(--shadow);
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky; top: 0; z-index: 50;
    border-bottom: 1px solid var(--border);
  }
  .topbar-brand {
    display: flex; align-items: center; gap: 0.8rem;
    text-decoration: none; color: var(--text);
  }
  .topbar-avatar {
    width: 40px; height: 40px;
    background: linear-gradient(135deg, var(--tunisia) 0%, #E8617F 100%);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    color: white; font-weight: 700;
  }
  .topbar-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.3rem; color: var(--primary);
    font-weight: 700; line-height: 1;
  }
  .topbar-role { font-size: 0.75rem; color: var(--muted); }
  .nav-link {
    padding: 0.5rem 0.9rem;
    text-decoration: none; color: var(--muted);
    font-size: 0.9rem; font-weight: 500;
    border-radius: 8px; transition: all 0.2s;
  }
  .nav-link:hover { background: var(--light); color: var(--tunisia); }

  /* ── Hero ── */
  .hero {
    background: linear-gradient(135deg, var(--tunisia) 0%, var(--tunisia-dark) 100%);
    color: white;
    padding: 3.5rem 2rem 5rem;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .hero::before, .hero::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.3;
  }
  .hero::before {
    width: 400px; height: 400px;
    background: var(--accent);
    top: -50%; right: -10%;
  }
  .hero::after {
    width: 500px; height: 500px;
    background: var(--accent-light);
    bottom: -50%; left: -10%;
  }
  .hero-content { position: relative; z-index: 1; max-width: 700px; margin: 0 auto; }
  .hero h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2.2rem, 5vw, 3.5rem);
    margin-bottom: 0.5rem;
  }
  .hero p { font-size: 1.05rem; opacity: 0.9; }
  .breadcrumb {
    margin-bottom: 1rem;
    color: rgba(255,255,255,0.85);
    font-size: 0.9rem;
  }
  .breadcrumb a { color: white; text-decoration: none; opacity: 0.8; }
  .breadcrumb a:hover { opacity: 1; }

  /* ── Container ── */
  .container {
    max-width: 1100px;
    margin: -3rem auto 4rem;
    padding: 0 1.5rem;
    position: relative;
    z-index: 2;
  }

  /* ── Levels grid ── */
  .levels-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 1.5rem;
  }

  .level-card {
    background: white;
    border-radius: 18px;
    padding: 2rem;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    text-decoration: none;
    color: var(--text);
    transition: all 0.3s;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    position: relative;
    overflow: hidden;
  }
  .level-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 5px;
    background: linear-gradient(90deg, var(--tunisia) 0%, var(--accent) 100%);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.4s ease;
  }
  .level-card:hover {
    transform: translateY(-6px);
    box-shadow: var(--shadow-lg);
    border-color: var(--tunisia);
  }
  .level-card:hover::before { transform: scaleX(1); }

  .level-icon {
    width: 60px; height: 60px;
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.6rem; color: white;
    margin-bottom: 0.8rem;
    background: linear-gradient(135deg, var(--tunisia) 0%, #E8617F 100%);
  }

  .level-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.6rem;
    color: var(--primary);
    font-weight: 700;
    margin-bottom: 0.3rem;
  }
  .level-subtitle {
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 0.8rem;
  }
  .level-stats {
    display: flex;
    gap: 0.5rem;
    margin: 0.8rem 0;
    flex-wrap: wrap;
  }
  .stat-tag {
    font-size: 0.75rem;
    padding: 0.25rem 0.7rem;
    background: var(--light);
    color: var(--tunisia);
    border-radius: 50px;
    font-weight: 600;
  }
  .level-arrow {
    margin-top: auto;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
    color: var(--accent);
    font-weight: 600;
    font-size: 0.9rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: gap 0.3s;
  }
  .level-arrow span { transition: transform 0.3s; }
  .level-card:hover .level-arrow span { transform: translateX(4px); }

  footer {
    text-align: center;
    padding: 2rem 1rem;
    color: var(--muted);
    font-size: 0.85rem;
    border-top: 1px solid var(--border);
    margin-top: 3rem;
  }

  @media (max-width: 600px) {
    .topbar { padding: 0.8rem 1rem; }
    .topbar-name { font-size: 1.1rem; }
    .container { padding: 0 1rem; margin-top: -2rem; }
    .level-card { padding: 1.5rem; }
    .level-title { font-size: 1.4rem; }
    .hero { padding: 2.5rem 1rem 4rem; }
  }
</style>
</head>
<body>

<div class="topbar">
  <a href="index.html" class="topbar-brand">
    <div class="topbar-avatar">FM</div>
    <div>
      <div class="topbar-name">Missaoui Maths</div>
      <div class="topbar-role">Système Tunisien 🇹🇳</div>
    </div>
  </a>
  <a href="index.html" class="nav-link">← Accueil</a>
</div>

<div class="hero">
  <div class="hero-content">
    <div class="breadcrumb">
      <a href="index.html">Accueil</a> <span style="opacity:0.5">/</span> Système Tunisien
    </div>
    <h1>Système Tunisien</h1>
    <p>Choisissez votre niveau</p>
  </div>
</div>

<div class="container">
  <div class="levels-grid" id="levelsGrid">
    <!-- Niveaux chargés dynamiquement -->
  </div>
</div>

<footer>
  <p>© Faicel Missaoui — Missaoui Maths</p>
</footer>

<script>
  // Track
  try {
    const s = JSON.parse(localStorage.getItem('mm_stats') || '{}');
    s.systeme_tunisie = (s.systeme_tunisie || 0) + 1;
    s._last = new Date().toISOString();
    localStorage.setItem('mm_stats', JSON.stringify(s));
  } catch(e) {}

  // Niveaux du système tunisien
  const levels = [
    { id: 'bac-math', icon: '🎓', title: 'Bac Mathématiques', subtitle: 'Section Mathématiques', color: '#C7385F' },
    { id: 'bac-sc', icon: '🔬', title: 'Bac Sciences Expérimentales', subtitle: 'Sc. Exp.', color: '#E8612C' },
    { id: 'bac-tech', icon: '⚙️', title: 'Bac Technique', subtitle: 'Tech & Info', color: '#2E7D5E' },
    { id: 'bac-eco', icon: '📊', title: 'Bac Économie-Gestion', subtitle: 'Économie', color: '#D69E2E' },
    { id: '3eme', icon: '📘', title: '3ème année secondaire', subtitle: 'Toutes sections', color: '#1A3A5C' },
    { id: '2eme', icon: '📗', title: '2ème année secondaire', subtitle: 'Tronc commun', color: '#4A5F8A' }
  ];

  // Récupérer les cours déposés par l'admin
  const courses = JSON.parse(localStorage.getItem('mm_courses') || '[]');

  const grid = document.getElementById('levelsGrid');
  levels.forEach(level => {
    const levelCourses = courses.filter(c => c.system === 'tunisie' && c.level === level.id);
    const card = document.createElement('a');
    card.href = `niveau.html?system=tunisie&level=${level.id}`;
    card.className = 'level-card';
    card.innerHTML = `
      <div class="level-icon" style="background: linear-gradient(135deg, ${level.color} 0%, ${level.color}CC 100%);">
        ${level.icon}
      </div>
      <h2 class="level-title">${level.title}</h2>
      <p class="level-subtitle">${level.subtitle}</p>
      <div class="level-stats">
        <span class="stat-tag">${levelCourses.length} cours</span>
        ${levelCourses.length > 0 ? '<span class="stat-tag">Disponible</span>' : '<span class="stat-tag" style="background:#E2E8F0; color:#5B7B9A;">À venir</span>'}
      </div>
      <div class="level-arrow">
        Voir les cours <span>→</span>
      </div>
    `;
    grid.appendChild(card);
  });
</script>

</body>
</html>
