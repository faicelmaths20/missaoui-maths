const sq = (s) => `${s}<sup>2</sup>`;
const svg = (body, label) => `<svg viewBox="0 0 340 230" role="img" aria-label="${label}" xmlns="http://www.w3.org/2000/svg"><g fill="none" stroke="#245e99" stroke-width="2.5" stroke-linejoin="round">${body}</g></svg>`;
const txt=(x,y,s,extra='')=>`<text x="${x}" y="${y}" fill="#193654" stroke="none" text-anchor="middle" ${extra}>${s}</text>`;
const mark=(a,b,c)=>{const u=b.map((v,i)=>v-a[i]),v=c.map((v,i)=>v-a[i]);const ul=Math.hypot(...u),vl=Math.hypot(...v),s=11;const p=u.map((v,i)=>a[i]+v/ul*s),q=v.map((v,i)=>a[i]+v/vl*s),m=p.map((v,i)=>v+q[i]-a[i]);return `<path d="M${p} L${m} L${q}" stroke-width="1.5"/>`;};

const Q=[
{id:1,stage:0,title:'Un carré parfait',text:`Que vaut ${root(144)} ?`,options:['72','12','14','−12'],answer:1,hint:'Cherche un nombre positif dont le produit par lui-même vaut 144.',steps:['12 × 12 = 144.','Une racine carrée est positive ou nulle. La réponse est donc 12.'],feedback:['Diviser 144 par 2 ne donne pas sa racine carrée.','12 est positif et 12² = 144.','14² = 196, et non 144.','−12 a bien pour carré 144, mais une racine carrée ne peut pas être négative.']},
{id:2,stage:0,title:'Revenir au carré',text:`Que vaut (${root(13)})<sup>2</sup> ?`,options:['26','169',root(26),'13'],answer:3,hint:'Relis la définition de la racine carrée : quel est son carré ?',steps:[`${root(13)} est le nombre positif dont le carré vaut 13.`,`Ainsi, (${root(13)})² = 13, sans calcul approché.`],feedback:['Mettre au carré ne signifie pas multiplier par 2.','169 est le carré de 13, pas le carré de sa racine carrée.','Le carré de la racine de 13 vaut exactement 13.','La définition donne directement ce résultat.']},
{id:3,stage:0,title:'Du carré à son côté',text:'Une mosaïque carrée a une aire de 169 cm². Quelle est la longueur de son côté ?',options:['13 cm','84,5 cm','338 cm','26 cm'],answer:0,visual:visuals.square,hint:'L’aire d’un carré est le carré de la longueur de son côté.',steps:['Si c est la longueur du côté en cm, alors c² = 169.',`Le côté est positif : c = ${root(169)} = 13. Il mesure 13 cm.`],feedback:['13² = 169 : la longueur correspond à l’aire donnée.','84,5 est la moitié de 169, mais 84,5² ne vaut pas 169.','338 est le double de 169 ; son carré est bien trop grand.','26² = 676, et non 169.']},
{id:4,stage:0,title:'Situer une racine',text:`Quel encadrement entre deux entiers consécutifs est correct pour ${root(58)} ?`,options:[`6 < ${root(58)} < 7`,`8 < ${root(58)} < 9`,`7 < ${root(58)} < 8`,`5 < ${root(58)} < 6`],answer:2,hint:'Repère les deux carrés parfaits qui entourent 58.',steps:['7² = 49 et 8² = 64. On a 49 < 58 < 64.',`Donc 7 < ${root(58)} < 8.`],feedback:['7² = 49 est inférieur à 58 : la racine de 58 dépasse 7.','8² = 64 dépasse 58 : la racine de 58 est inférieure à 8.','Les carrés 49 et 64 encadrent 58.','6² = 36 est inférieur à 58 : cet intervalle est trop petit.']},
{id:5,stage:0,title:'Arrondir avec précision',text:`À l’aide de la calculatrice, quel est l’arrondi au centième de ${root(11)} ?`,options:['3,31','3,32','3,3','3,33'],answer:1,hint:'Pour arrondir au centième, regarde le chiffre des millièmes.',steps:[`${root(11)} ≈ 3,31662479…`,'Le chiffre des millièmes est 6. On augmente donc le chiffre des centièmes : 3,32.'],feedback:['3,31 est une troncature au centième ; le chiffre suivant impose d’arrondir vers le haut.','Le chiffre des millièmes est 6 : l’arrondi est 3,32.','3,3 est l’arrondi au dixième, alors qu’on demande le centième.','3,33 est plus éloigné de la racine de 11 que 3,32.']},
{id:6,stage:0,title:'Trouver l’hypoténuse',text:'Le triangle RST est rectangle en S. Quel est son côté hypoténuse ?',options:['[RS]','[ST]','Les trois côtés','[RT]'],answer:3,visual:visuals.rotated,hint:'Cherche le côté opposé au sommet de l’angle droit, quelle que soit l’orientation du dessin.',steps:['L’angle droit est au sommet S.','Le côté qui ne touche pas S est [RT] : c’est l’hypoténuse.'],feedback:['[RS] touche le sommet S : c’est un côté de l’angle droit.','[ST] touche le sommet S : c’est un côté de l’angle droit.','Un triangle rectangle possède une seule hypoténuse.','[RT] est opposé à l’angle droit en S.']},
{id:7,stage:1,title:'Écrire la bonne égalité',text:'Le triangle EFG est rectangle en F. Quelle égalité de Pythagore peut-on écrire ?',options:['EG² = EF² + FG²','EF² = EG² + FG²','FG² = EF² + EG²','EG = EF + FG'],answer:0,hint:'Identifie d’abord l’hypoténuse : elle est opposée à F.',steps:['L’hypoténuse est [EG].','D’après le théorème de Pythagore, EG² = EF² + FG².'],feedback:['Le carré de l’hypoténuse EG est bien seul à gauche.','[EF] est un côté de l’angle droit, et non l’hypoténuse.','[FG] est un côté de l’angle droit, et non l’hypoténuse.','Pythagore porte sur les carrés des longueurs, pas sur leur somme directe.']},
{id:8,stage:1,title:'Calculer l’hypoténuse',text:'ABC est rectangle en A, avec AB = 8 cm et AC = 15 cm. Combien mesure BC ?',options:['23 cm','7 cm','17 cm','289 cm'],answer:2,visual:triangle(['A','B','C'],['8 cm','15 cm','?']),hint:'Calcule la somme des carrés des deux côtés de l’angle droit.',steps:['Dans ABC rectangle en A : BC² = AB² + AC².','BC² = 8² + 15² = 64 + 225 = 289.',`Comme BC > 0, BC = ${root(289)} = 17 cm.`],feedback:['8 + 15 est la somme des deux côtés, pas l’hypoténuse.','Soustraire les deux longueurs ne correspond pas au théorème.','17² = 289 = 8² + 15².','289 est la valeur de BC² en cm² ; il faut encore prendre la racine carrée.']},
{id:9,stage:1,title:'Retrouver un côté',text:'DEF est rectangle en E. DF = 25 cm et EF = 7 cm. Quelle est la longueur DE ?',options:['18 cm','24 cm',`${root(674)} cm`,'576 cm'],answer:1,hint:'DF est l’hypoténuse. Isole le carré de DE en soustrayant un carré.',steps:['Dans DEF rectangle en E : DF² = DE² + EF².','DE² = 25² − 7² = 625 − 49 = 576.',`DE = ${root(576)} = 24 cm, car DE est une longueur positive.`],feedback:['25 − 7 n’est pas le calcul de Pythagore : on soustrait les carrés.','24² + 7² = 576 + 49 = 625 = 25².','674 = 25² + 7² ; on doit ici soustraire, puisque 25 est l’hypoténuse.','576 est le carré de la longueur cherchée, pas la longueur.']},
{id:10,stage:1,title:'Garder la valeur exacte',text:'Un triangle rectangle a deux côtés de l’angle droit de 2 cm et 3 cm. Quelle est la longueur exacte de son hypoténuse ?',options:['5 cm','13 cm','3,61 cm',`${root(13)} cm`],answer:3,hint:'Écris d’abord le carré de l’hypoténuse. Une écriture avec une racine peut être exacte.',steps:['Le carré de l’hypoténuse vaut 2² + 3² = 4 + 9 = 13.',`Sa longueur exacte vaut donc ${root(13)} cm.`,'3,61 cm est seulement un arrondi au centième.'],feedback:['Additionner directement 2 et 3 ne donne pas l’hypoténuse.','13 est le carré de l’hypoténuse en cm².','3,61 cm est une approximation, alors que la valeur exacte est demandée.','La racine de 13 est l’écriture exacte de la longueur.']},
{id:11,stage:1,title:'Du calcul exact à l’arrondi',text:'MNP est rectangle en N. MP = 11 cm et MN = 5 cm. Quel est l’arrondi de NP au millimètre ?',options:['9,8 cm','9,7 cm','6,0 cm','12,1 cm'],answer:0,hint:'Le millimètre correspond à un dixième de centimètre. Calcule d’abord 11² − 5².',steps:['MP² = MN² + NP², donc NP² = 11² − 5² = 96.',`NP = ${root(96)} cm ≈ 9,797958… cm.`,'L’arrondi au millimètre est 9,8 cm, soit 98 mm.'],feedback:['9,797958… s’arrondit à 9,8 au dixième de centimètre.','9,7 est une troncature : le chiffre des centièmes impose l’arrondi supérieur.','11 − 5 ne calcule pas la longueur cherchée.','12,1 cm dépasse l’hypoténuse de 11 cm : ce résultat est impossible.']},
{id:12,stage:2,title:'Prouver un angle droit',text:'Dans KLM, KL = 20 cm, KM = 21 cm et LM = 29 cm. Quelle conclusion est correcte ?',options:['Rectangle en L','Non rectangle','Rectangle en K','Rectangle en M'],answer:2,hint:'Compare le carré du plus long côté à la somme des deux autres carrés.',steps:['[LM] est le plus long côté. LM² = 29² = 841.','KL² + KM² = 20² + 21² = 400 + 441 = 841.','La réciproque du théorème de Pythagore prouve que KLM est rectangle en K, en face de [LM].'],feedback:['Un angle droit en L aurait [KM] comme hypoténuse ; or [LM] est le plus long côté.','Les deux calculs exacts donnent 841 : la réciproque prouve que le triangle est rectangle.','L’égalité 29² = 20² + 21² prouve l’angle droit en K.','Un angle droit en M aurait [KL] comme hypoténuse ; or [LM] est le plus long côté.']},
{id:13,stage:2,title:'Ne pas se fier au dessin',text:'Un triangle a pour côtés 6 cm, 7 cm et 10 cm. Est-il rectangle ?',options:['Oui, car 6 + 7 > 10','Oui, car 10 est le plus grand côté','Oui, car 10² = 6² + 7²','Non, car 10² ≠ 6² + 7²'],answer:3,hint:'L’inégalité triangulaire permet de construire le triangle, mais elle ne prouve pas un angle droit.',steps:['Le côté de 10 cm serait l’hypoténuse si le triangle était rectangle.','10² = 100, tandis que 6² + 7² = 36 + 49 = 85.','Comme 100 ≠ 85, le théorème de Pythagore exclut un triangle rectangle.'],feedback:['6 + 7 > 10 garantit seulement que le triangle non aplati est constructible.','Le plus grand côté n’est une hypoténuse que si le triangle est rectangle.','Cette égalité est fausse : 100 ≠ 85.','Le carré du plus grand côté diffère de la somme des deux autres carrés.']},
{id:14,stage:2,title:'Mettre les unités d’accord',text:'EFG vérifie EF = 90 mm, FG = 1,2 dm et EG = 15 cm. Quelle est sa nature ?',options:['Rectangle en E','Rectangle en F','Non rectangle','Rectangle en G'],answer:1,hint:'Convertis toutes les longueurs en centimètres avant de comparer les carrés.',steps:['EF = 9 cm, FG = 12 cm et EG = 15 cm. [EG] est le plus long côté.','EG² = 225 et EF² + FG² = 81 + 144 = 225.','Par la réciproque de Pythagore, EFG est rectangle en F.'],feedback:['Le côté opposé à E est [FG], qui n’est pas le plus long.','Après conversion, 15² = 9² + 12² ; l’angle droit est en F.','Après conversion, les carrés vérifient bien l’égalité de Pythagore.','Le côté opposé à G est [EF], qui n’est pas le plus long.']},
{id:15,stage:2,title:'Modéliser un câble',text:'Un câble rectiligne relie le sommet d’un mât de 4,8 m à un point du sol situé à 1,4 m du pied du mât. Le mât est perpendiculaire au sol. Quelle est la longueur du câble ?',options:['5 m','6,2 m','3,4 m','25 m'],answer:0,visual:visuals.mast,hint:'Le câble est l’hypoténuse du triangle formé par le mât et le sol.',steps:['Le triangle est rectangle au pied du mât.','Le carré de la longueur du câble vaut 4,8² + 1,4² = 23,04 + 1,96 = 25.',`La longueur du câble est ${root(25)} = 5 m.`],feedback:['5² = 25 = 4,8² + 1,4².','4,8 + 1,4 additionne les deux côtés de l’angle droit.','3,4 m serait plus court que le mât : l’hypoténuse doit être le plus long côté.','25 est le carré de la longueur en m².']},
{id:16,stage:3,title:'Défi · Le contour d’un losange',text:'Les diagonales d’un losange mesurent 10 cm et 24 cm. Elles sont perpendiculaires et se coupent en leur milieu. Quel est son périmètre ?',options:['104 cm','34 cm','52 cm','68 cm'],answer:2,visual:visuals.diamond,hint:'Un côté du losange est l’hypoténuse d’un petit triangle. Utilise les demi-diagonales.',steps:['Les demi-diagonales mesurent 5 cm et 12 cm.','Un côté du losange a pour carré 5² + 12² = 25 + 144 = 169.',`Chaque côté mesure ${root(169)} = 13 cm.`,'Le périmètre vaut 4 × 13 = 52 cm.'],feedback:['Ce résultat utilise les diagonales entières au lieu des demi-diagonales.','10 + 24 est la somme des diagonales, pas le périmètre.','Les quatre côtés mesurent chacun 13 cm.','2 × (10 + 24) utilise à tort les diagonales comme des côtés.']},
{id:17,stage:3,title:'Défi · Une aire cachée',text:'Un rectangle a un côté de 16 cm et une diagonale de 20 cm. Quelle est son aire ?',options:['320 cm²','192 cm²','64 cm²','144 cm²'],answer:1,visual:visuals.rectangle,hint:'La diagonale permet de trouver l’autre côté. Calcule ensuite l’aire du rectangle.',steps:['Dans le triangle rectangle formé par une diagonale, l’autre côté a pour carré 20² − 16² = 400 − 256 = 144.',`Ce côté mesure ${root(144)} = 12 cm.`,'L’aire du rectangle vaut 16 × 12 = 192 cm².'],feedback:['20 est la diagonale ; elle n’est pas la largeur du rectangle.','La largeur vaut 12 cm, puis l’aire vaut 16 × 12.','20 − 16 ne donne pas la largeur : il faut d’abord soustraire les carrés.','144 est le carré de la largeur, pas l’aire du rectangle.']},
{id:18,stage:3,title:'Défi · Deux triangles, un calcul exact',text:'ABC est rectangle en A et BCD est rectangle en C. On donne AB = 3 cm, AC = 6 cm et CD = 2 cm. Quelle est la longueur exacte BD ?',options:[`${root(41)} cm`,'11 cm',`${root(85)} cm`,'7 cm'],answer:3,visual:visuals.double,hint:'Calcule BC², puis réutilise directement cette valeur dans le second triangle.',steps:['Dans ABC : BC² = AB² + AC² = 3² + 6² = 45.','Dans BCD : BD² = BC² + CD² = 45 + 2² = 49.',`Donc BD = ${root(49)} = 7 cm. Aucune approximation de BC n’est nécessaire.`],feedback:['Dans BCD, BD est l’hypoténuse : il faut ajouter CD² à BC², pas le soustraire.','3 + 6 + 2 additionne les côtés de plusieurs triangles ; ce n’est pas la longueur BD.','Le calcul exact donne 3² + 6² + 2² = 49, pas 85.','Les deux applications successives donnent BD² = 49.']},
{id:19,stage:3,title:'Défi · Une échelle qui glisse',text:'Une échelle de 5 m s’appuie sur un mur perpendiculaire au sol. Au départ, son pied est à 3 m du mur. Son sommet descend ensuite de 1 m, en restant contre le mur. De combien le pied s’est-il éloigné du mur ?',options:['1 m','4 m','2 m','3 m'],answer:0,visual:visuals.ladder,hint:'Calcule la hauteur initiale, puis la nouvelle distance au mur. La question porte sur le déplacement du pied.',steps:[`La hauteur initiale vaut ${root('25 − 9')} = ${root(16)} = 4 m.`,'La nouvelle hauteur vaut 4 − 1 = 3 m.',`La nouvelle distance du pied au mur vaut ${root('25 − 9')} = 4 m.`,'Le pied s’est éloigné de 4 − 3 = 1 m.'],feedback:['La distance au mur passe de 3 m à 4 m : le déplacement est de 1 m.','4 m est la nouvelle distance au mur, pas le déplacement depuis la position initiale.','Les deux positions donnent des distances de 3 m puis 4 m ; leur différence est 1 m.','3 m est la distance initiale au mur, pas le déplacement.']},
{id:20,stage:3,title:'Défi · Presque rectangle ?',text:`ABC vérifie AB = ${root(50)} cm, AC = ${root(72)} cm et BC = 11 cm. Quelle conclusion est exacte ?`,options:['Rectangle en A','Rectangle en B','Non rectangle','Rectangle en C'],answer:2,visual:visuals.almost,hint:'Évite les arrondis. Le carré d’une racine carrée se calcule exactement.',steps:[`${root(50)} < 8 et ${root(72)} < 9 : [BC], de longueur 11 cm, est le plus long côté.`,'BC² = 121, tandis que AB² + AC² = 50 + 72 = 122.','121 ≠ 122 : ABC n’est pas rectangle. Une égalité approchée ne suffit jamais à prouver un angle droit.'],feedback:['L’égalité nécessaire en A serait 121 = 122, ce qui est faux.','[AC] serait l’hypoténuse, alors qu’il est plus court que [BC].','Les deux valeurs exactes sont différentes : 121 et 122.','[AB] serait l’hypoténuse, alors qu’il est plus court que [BC].']}
];

const SITE='https://faicelmaths20.github.io/missaoui-maths/qfm-pythagore-racines-4e/';
const STORE='fm-qfm-pythagore-racines-4e-v1';
const stages=['Les bases','Calculer une longueur','Raisonner et modéliser','Les défis'];
const fresh=()=>({version:1,answers:Array(20).fill(null),hints:Array(20).fill(false),current:0,started:false,finished:false});
let state=fresh(),selected=null,hintOpen=false,storageOK=true,toastTimer;
try{const old=JSON.parse(localStorage.getItem(STORE));if(old&&old.version===1&&Array.isArray(old.answers)&&old.answers.length===20&&old.answers.every(a=>a===null||(Number.isInteger(a)&&a>=0&&a<4))&&Array.isArray(old.hints)&&old.hints.length===20&&old.hints.every(h=>typeof h==='boolean')&&Number.isInteger(old.current)&&old.current>=0&&old.current<20){state={...fresh(),...old,started:!!old.started,finished:!!old.finished&&old.answers.every(a=>a!==null)};}}catch{storageOK=false;}
const answered=()=>state.answers.filter(a=>a!==null).length;
const score=()=>state.answers.reduce((s,a,i)=>s+Number(a===Q[i].answer),0);
const usedHints=()=>state.hints.filter(Boolean).length;
const isGood=i=>state.answers[i]===Q[i].answer;
function save(){try{localStorage.setItem(STORE,JSON.stringify(state));}catch{storageOK=false;}}
const happy=`<svg viewBox="0 0 64 70" aria-hidden="true"><path d="M32 4 39 22 59 24 44 37 48 57 32 46 16 57 20 37 5 24 25 22Z" fill="#ffe096" stroke="#bf8e2e" stroke-width="2"/><circle cx="26" cy="29" r="2" fill="#233853"/><circle cx="38" cy="29" r="2" fill="#233853"/><path d="M26 36Q32 42 38 36" fill="none" stroke="#233853" stroke-width="2" stroke-linecap="round"/></svg>`;
const sad=`<svg viewBox="0 0 64 74" aria-hidden="true"><circle cx="32" cy="20" r="15" fill="#abc6ed" stroke="#e2edff" stroke-width="2"/><circle cx="27" cy="18" r="1.7" fill="#193351"/><circle cx="37" cy="18" r="1.7" fill="#193351"/><path d="M26 28Q32 22 38 28M32 36V54M32 41L15 49M32 41L49 49M32 54L20 69M32 54L44 69" fill="none" stroke="#d2e3fa" stroke-width="3" stroke-linecap="round"/></svg>`;
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{el.hidden=true},3200);}
function celebrate(final=false){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const star=document.createElement('div');star.className='shooting';star.setAttribute('aria-hidden','true');document.body.append(star);setTimeout(()=>star.remove(),1400);if(final){for(let i=0;i<16;i++){const s=document.createElement('div');s.className='sparkle';s.textContent='★';s.setAttribute('aria-hidden','true');const a=i*Math.PI/8;s.style.setProperty('--dx',Math.cos(a)*240+'px');s.style.setProperty('--dy',Math.sin(a)*220+'px');document.body.append(s);setTimeout(()=>s.remove(),1300);}}}
function figure(q){return q.visual?`<figure class="figure">${q.visual}<figcaption>Schéma non à l’échelle.</figcaption></figure>`:'';}
function steps(q){return `<ol class="steps">${q.steps.map(s=>`<li>${s}</li>`).join('')}</ol>`;}
function welcome(){document.getElementById('main').innerHTML=`<section class="hero"><div><span class="eyebrow">QFM · Classe de quatrième</span><h1>Racines carrées<br>&amp; <em>Pythagore</em></h1><p>20 questions pour prendre confiance, raisonner et relever les cinq défis finaux.</p><div class="heroactions"><button class="btn primary" id="start">${state.started?'Reprendre le QFM':'Commencer le QFM'} <span aria-hidden="true">›</span></button>${state.started?'<button class="btn quiet" id="startover">Recommencer</button>':''}</div>${state.started?`<p class="resumenote">${answered()} réponses enregistrées · ${score()} réussite${score()>1?'s':''}</p>`:''}</div><div class="journey"><div class="journeyhead"><div><div class="big">20</div><p>questions · 4 étapes</p></div><svg viewBox="0 0 100 75" aria-hidden="true"><path d="M10 8V65H90Z" fill="none" stroke="#98d7ff" stroke-width="2"/><path d="M10 55H20V65" fill="none" stroke="#ffe097" stroke-width="2"/><text x="48" y="36" fill="#ffe097" font-size="18" font-family="Georgia">a² + b²</text></svg></div><div class="stage"><b>01–06</b><span>Maîtriser les bases</span></div><div class="stage"><b>07–11</b><span>Calculer une longueur</span></div><div class="stage"><b>12–15</b><span>Raisonner et modéliser</span></div><div class="stage"><b>16–20</b><span>Relever les défis ★</span></div></div></section><div class="rules"><span>Une seule réponse par question</span><span>Coups de pouce sans pénalité</span><span>Correction après chaque réponse</span><span>Calculatrice autorisée</span></div>`;document.getElementById('start').onclick=()=>{state.started=true;state.finished=false;save();renderQuestion(true)};document.getElementById('startover')?.addEventListener('click',askReset);}
function mapHTML(){return Q.map((q,i)=>`<button class="dot ${i===state.current?'current':''} ${state.answers[i]===null?'':isGood(i)?'good':'bad'}" data-go="${i}" aria-label="Question ${i+1}${state.answers[i]===null?', sans réponse':isGood(i)?', réussie':', à revoir'}" ${i===state.current?'aria-current="step"':''}>${i+1}${state.answers[i]!==null?`<span class="tinymark" aria-hidden="true">${isGood(i)?'✓':'×'}</span>`:''}</button>`).join('');}
function feedbackHTML(q,a){const ok=a===q.answer;return `<section id="feedback" class="feedback ${ok?'good':''}" tabindex="-1" aria-labelledby="feedback-title"><div class="feedbackhead">${ok?happy:sad}<div><h3 id="feedback-title">${ok?'Bravo !':'Pas encore… tu peux progresser !'}</h3><p class="reason">${q.feedback[a]}</p></div></div><p class="correctanswer">Réponse : ${q.options[q.answer]}</p><h4>La correction, étape par étape</h4>${steps(q)}</section>`;}
function renderQuestion(scroll=false){selected=null;hintOpen=false;const i=state.current,q=Q[i],a=state.answers[i],done=a!==null;document.getElementById('main').innerHTML=`<section class="quiz-layout"><div><div class="status"><span>${answered()} / 20 réponses validées</span><span>Réussites : <strong>${score()} / 20</strong></span></div><div class="progress" role="progressbar" aria-label="Questions validées" aria-valuemin="0" aria-valuemax="20" aria-valuenow="${answered()}"><div style="width:${answered()*5}%"></div></div><article class="card"><div class="inner"><div class="qmeta"><span>QUESTION ${String(i+1).padStart(2,'0')} / 20</span><span class="level ${q.stage===3?'defi':''}">${q.stage===3?'★ ':''}${stages[q.stage]}</span></div><h1 class="qtitle" id="questionTitle" tabindex="-1">${q.title}</h1><p class="prompt" id="questionText">${q.text}</p>${figure(q)}<div class="answers" role="group" aria-labelledby="questionText">${q.options.map((op,k)=>`<button class="option ${done?(k===q.answer?'correct':k===a?'incorrect':''):''}" data-option="${k}" aria-pressed="${done&&k===a}" ${done?'disabled':''}><span class="letter" aria-hidden="true">${'ABCD'[k]}</span><span class="value">${op}</span>${done&&(k===a||k===q.answer)?`<span aria-hidden="true">${k===q.answer?'✓':'×'}</span>`:''}</button>`).join('')}</div><button class="hintbtn" id="hintButton" aria-expanded="false" aria-controls="hint">✦ Un coup de pouce${state.hints[i]?' · déjà consulté':''}</button><div class="hint" id="hint" hidden>${q.hint}</div>${done?feedbackHTML(q,a):''}</div><div class="actions"><button class="btn quiet" id="previous" ${i===0?'disabled':''}>Précédente</button><div class="right">${done?'':'<button class="btn primary" id="validate" disabled>Valider</button>'}<button class="btn ${done?'primary':'quiet'}" id="next">${i===19?'Voir le bilan':done?'Suivante':'Passer'}</button></div></div></article></div><aside class="sidebar"><h2>Votre parcours</h2><nav class="map" aria-label="Navigation entre les questions">${mapHTML()}</nav><p class="maplegend">✓ Réussie · × À revoir<br>Une réponse validée compte pour le score.</p><button class="btn small" id="summary">${answered()===20?'Voir mon bilan':'Aller à une question restante'}</button><button class="btn small quiet" id="restart">Recommencer</button><p class="saved">${storageOK?'La progression reste enregistrée sur cet appareil.':'La progression reste disponible tant que cette page est ouverte.'}</p></aside></section>`;bindQuestion();if(scroll){document.getElementById('main').scrollIntoView({block:'start'});document.getElementById('questionTitle').focus({preventScroll:true});}}
function bindQuestion(){document.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{if(state.answers[state.current]!==null)return;selected=Number(b.dataset.option);document.querySelectorAll('[data-option]').forEach(o=>{const chosen=Number(o.dataset.option)===selected;o.classList.toggle('selected',chosen);o.setAttribute('aria-pressed',String(chosen))});document.getElementById('validate').disabled=false});document.getElementById('hintButton').onclick=()=>{hintOpen=!hintOpen;document.getElementById('hint').hidden=!hintOpen;document.getElementById('hintButton').setAttribute('aria-expanded',String(hintOpen));if(hintOpen){state.hints[state.current]=true;save();}};document.getElementById('validate')?.addEventListener('click',submit);document.getElementById('next').onclick=()=>state.current<19?go(state.current+1):finish();document.getElementById('previous').onclick=()=>go(state.current-1);document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(Number(b.dataset.go)));document.getElementById('restart').onclick=askReset;document.getElementById('summary').onclick=finish;}
function go(i){if(i<0||i>=20)return;state.current=i;state.finished=false;save();renderQuestion(true);}
function submit(){const i=state.current;if(selected===null||state.answers[i]!==null)return;state.answers[i]=selected;const good=isGood(i);save();renderQuestion();const el=document.getElementById('feedback');el.focus({preventScroll:true});el.scrollIntoView({block:'nearest',behavior:'auto'});if(good)celebrate();}
function finish(){const missing=state.answers.indexOf(null);if(missing!==-1){go(missing);toast('Il reste '+(20-answered())+' question'+(20-answered()>1?'s':'')+' à valider avant le bilan.');return;}state.finished=true;save();renderResult();if(score()>=10)celebrate(true);}
function reviewHTML(){return Q.map((q,i)=>`<details data-review="${i}" ${isGood(i)?'':'data-wrong="true"'}><summary>${isGood(i)?'✓':'×'} ${String(i+1).padStart(2,'0')} · ${q.title}</summary><p class="prompt">${q.text}</p>${figure(q)}<p class="your ${isGood(i)?'good':''}">Votre réponse : ${q.options[state.answers[i]]}</p><p class="correctanswer">Réponse attendue : ${q.options[q.answer]}</p>${steps(q)}${state.hints[i]?'<p class="saved">Coup de pouce consulté.</p>':''}</details>`).join('');}
function renderResult(){const s=score(),stars=Math.ceil(s/4),defi=Q.reduce((n,q,i)=>n+(q.stage===3&&isGood(i)?1:0),0);document.getElementById('main').innerHTML=`<section class="result"><div class="card"><div class="inner"><div class="resulttop"><div><span class="eyebrow">Votre bilan</span><h1>${s===20?'Bravo, sans-faute !':s>=16?'Bravo, très beau parcours !':s>=10?'Bravo pour tes réussites !':'On reprend, tu vas progresser !'}</h1></div>${s>=10?happy:sad}</div><div class="score">${s}<small> / 20</small></div><div class="stars" aria-label="${stars} étoiles sur 5">${'★'.repeat(stars)}${'☆'.repeat(5-stars)}</div><p>${s===20?'Tu as réussi les 20 questions, y compris les cinq défis.':s>=10?'Les corrections ci-dessous t’aident à comprendre chaque erreur et à aller plus loin.':'Prends le temps de revoir les corrections. Les coups de pouce sont là pour t’aider lors d’un nouvel essai.'}</p><div class="stats"><div class="stat"><b>${s}</b><span>réussites</span></div><div class="stat"><b>${20-s}</b><span>à revoir</span></div><div class="stat"><b>${defi} / 5</b><span>défis réussis</span></div><div class="stat"><b>${usedHints()}</b><span>${usedHints()===1?'coup de pouce':'coups de pouce'}</span></div></div><div class="resultactions"><button class="btn primary" id="reviewErrors">${s===20?'Relire les corrections':'Revoir mes erreurs'}</button><button class="btn quiet" id="restartResult">Recommencer</button><button class="btn quiet" id="resultShare">Partager le QFM</button></div><p class="saved">Le score compte les réponses validées. Les coups de pouce ne retirent aucun point.</p></div></div><section class="review" id="review"><h2>Les 20 corrections</h2><label class="reviewlabel"><input type="checkbox" id="onlyWrong"> Afficher seulement mes erreurs</label>${reviewHTML()}</section></section>`;document.getElementById('restartResult').onclick=askReset;document.getElementById('resultShare').onclick=share;document.getElementById('onlyWrong').onchange=filterReview;document.getElementById('reviewErrors').onclick=()=>{document.getElementById('onlyWrong').checked=s<20;filterReview();document.querySelectorAll('[data-review]').forEach(d=>{d.open=!d.hidden});document.getElementById('review').scrollIntoView()};document.getElementById('main').scrollIntoView({block:'start'});}
function filterReview(){const only=document.getElementById('onlyWrong').checked;document.querySelectorAll('[data-review]').forEach(d=>{d.hidden=only&&isGood(Number(d.dataset.review))})}
let resetFocus;
function askReset(){resetFocus=document.activeElement;document.getElementById('resetDialog').showModal();document.getElementById('cancelReset').focus();}
function closeReset(){document.getElementById('resetDialog').close();resetFocus?.focus();}
function reset(){state=fresh();state.started=true;save();document.getElementById('resetDialog').close();renderQuestion(true);}
function share(){const message='QFM de Faicel Missaoui — Racines carrées et Pythagore, 4e. 20 questions progressives, coups de pouce, corrections et 5 défis. '+SITE;window.open('https://wa.me/?text='+encodeURIComponent(message),'_blank','noopener,noreferrer');}
document.getElementById('shareTop').onclick=share;
document.getElementById('cancelReset').onclick=closeReset;
document.getElementById('confirmReset').onclick=reset;
document.getElementById('resetDialog').addEventListener('cancel',()=>{setTimeout(()=>resetFocus?.focus(),0)});
if(state.finished)renderResult();else if(state.started)renderQuestion();else welcome();
</script></body></html>
