<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>QFM - Monotonie des trinômes</title>
  <meta name="description" content="Quiz progressif de Première spécialité sur la monotonie des trinômes, par Faicel Missaoui.">
  <style>
    :root{--bg:#0d0f14;--card:#151a22;--ink:#eee9df;--muted:#9eacb7;--green:#3eb89f;--gold:#d5b96f;--red:#db6258;--line:rgba(255,255,255,.11)}
    *{box-sizing:border-box}html{min-height:100%;background:var(--bg)}body{min-height:100vh;margin:0;color:var(--ink);font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at 8% 0%,rgba(62,184,159,.12),transparent 31rem),radial-gradient(circle at 92% 12%,rgba(213,185,111,.1),transparent 28rem),var(--bg)}
    button,input{font:inherit}.shell{min-height:100vh;display:flex;flex-direction:column;padding:0 20px}.header{width:min(1120px,100%);margin:auto auto 0;min-height:112px;display:grid;grid-template-columns:1.2fr 1fr .65fr;align-items:center;gap:22px;border-bottom:1px solid rgba(213,185,111,.38)}
    .brand{display:flex;align-items:center;gap:13px}.logo{width:68px;height:68px;object-fit:contain;filter:drop-shadow(0 8px 20px rgba(0,0,0,.28))}.name{margin:0;color:#f5ead0;font:700 clamp(1.18rem,2vw,1.48rem) Georgia,serif}.role{margin:4px 0 0;color:#93a1ad;font-size:.76rem}.title{text-align:center}.kicker,.contact span{display:block;color:var(--gold);font-size:.69rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase}.title h1{margin:7px 0 0;font:700 clamp(1.2rem,2.6vw,1.78rem)/1.08 Georgia,serif}.contact{text-align:right}.contact strong{display:block;margin-top:5px;font-size:1.2rem}
    .stage{width:min(920px,100%);margin:auto;flex:1;padding:48px 0 52px}.card{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:25px;background:linear-gradient(145deg,rgba(255,255,255,.035),transparent 42%),var(--card);box-shadow:0 28px 70px rgba(0,0,0,.35)}.card:before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:linear-gradient(var(--green),var(--gold))}.watermark{position:absolute;right:-45px;bottom:-66px;width:270px;height:270px;object-fit:contain;opacity:.035;pointer-events:none}
    .inside{position:relative;z-index:1;padding:30px 34px}.badge{display:inline-flex;align-items:center;border:1px solid rgba(62,184,159,.34);border-radius:999px;padding:5px 10px;background:rgba(62,184,159,.12);color:#88dfcc;font-size:.75rem;font-weight:700}.hero{min-height:520px;display:grid;align-content:center}.hero h2{max-width:690px;margin:16px 0 10px;font:700 clamp(2rem,5vw,3.45rem)/1.05 Georgia,serif;color:#f6f0e5}.lead{color:#aeb9c2;line-height:1.6}.skills{display:flex;flex-wrap:wrap;gap:9px;margin:22px 0}.skills span{padding:8px 12px;border:1px solid rgba(213,185,111,.24);border-radius:999px;background:rgba(213,185,111,.07);color:#dfcc98;font-size:.78rem}.field{display:grid;gap:9px;max-width:520px;color:#dfe5e9;font-size:.86rem;font-weight:700}.field em{color:#7f8d98;font-style:normal;font-weight:400}.field input{height:48px;border:1px solid rgba(255,255,255,.13);border-radius:12px;padding:0 14px;background:rgba(5,8,12,.36);color:#f4f0e8;outline:none}.field input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(62,184,159,.15)}
    .btn{min-height:48px;border:0;border-radius:13px;padding:0 20px;cursor:pointer;font-weight:800}.primary{margin-top:22px;background:var(--green);color:#06140f;box-shadow:0 12px 26px rgba(62,184,159,.2)}.primary:hover{background:#56c9b1}.btn:disabled{cursor:not-allowed;opacity:.45}.progressline{margin:0 4px 18px}.progresscopy{display:flex;justify-content:space-between;margin-bottom:10px;color:#9cabb6;font-size:.8rem;font-weight:700}.progresscopy strong{color:var(--gold)}.bar{height:7px;overflow:hidden;border-radius:99px;background:rgba(255,255,255,.08)}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--gold));transition:width .25s}
    .level{border-color:rgba(213,185,111,.33);background:rgba(213,185,111,.06);color:#d9c387}.question{margin:13px 0 22px;color:#f6f1e8;font:700 clamp(1.36rem,3vw,1.82rem)/1.35 Georgia,serif}.figure{display:block;width:min(520px,100%);height:auto;margin:0 auto 22px;border:1px solid rgba(255,255,255,.08);border-radius:19px;background:#111923;box-shadow:0 16px 32px rgba(0,0,0,.22)}
    .vartable{width:min(610px,100%);margin:0 auto 22px;display:grid;grid-template-columns:95px 1fr;overflow:hidden;border:1px solid rgba(255,255,255,.16);border-radius:16px;background:#111923}.vartable>div{min-height:52px;display:flex;align-items:center;border-bottom:1px solid rgba(255,255,255,.12)}.vartable>div:nth-last-child(-n+2){border-bottom:0}.vlabel{justify-content:center;border-right:1px solid rgba(255,255,255,.12);font:italic 1rem Georgia,serif}.vaxis,.varrows{justify-content:space-between;padding:0 28px}.vaxis strong,.varrows strong{color:#f1d792}.varrows{min-height:76px!important;color:#67cfb9;font-size:2rem}
    .answers{display:grid;gap:11px}.choice{min-height:58px;display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:11px;padding:12px 15px;border:1px solid rgba(255,255,255,.1);border-radius:14px;background:rgba(7,11,15,.38);cursor:pointer;transition:.16s}.choice:hover{transform:translateY(-1px);border-color:rgba(62,184,159,.45);background:rgba(62,184,159,.06)}.choice.selected{border-color:rgba(62,184,159,.78);background:rgba(62,184,159,.11)}.choice.correct{border-color:rgba(62,184,159,.85);background:rgba(62,184,159,.13)}.choice.wrong{border-color:rgba(219,98,88,.82);background:rgba(219,98,88,.12)}.letter{width:32px;height:32px;display:grid;place-items:center;border-radius:9px;background:rgba(255,255,255,.06);color:var(--gold);font-weight:800}.option{color:#e6e9e9;font-size:.94rem;line-height:1.5}.mark{font-size:1.2rem}.correct .mark{color:#58cdb4}.wrong .mark{color:#ef7f74}
    .feedback{margin-top:18px;padding:15px 17px;border:1px solid;border-radius:15px}.feedback.good{border-color:rgba(62,184,159,.42);background:rgba(62,184,159,.08);color:#75d8c3}.feedback.bad{border-color:rgba(219,98,88,.42);background:rgba(219,98,88,.08);color:#ef9188}.feedback strong{display:block}.feedback p{margin:8px 0 0;color:#c5cfd6;font-size:.9rem;line-height:1.6}.actions{display:flex;justify-content:flex-end}
    .result{text-align:center}.score{width:154px;height:154px;margin:18px auto;display:grid;place-content:center;border:2px solid rgba(62,184,159,.52);border-radius:50%;background:radial-gradient(circle,rgba(62,184,159,.15),rgba(62,184,159,.025));box-shadow:0 0 0 10px rgba(62,184,159,.045)}.score strong{font:700 3.1rem/.9 Georgia,serif;color:#f4ead0}.score span{color:#8fdcc9;font-weight:700}.result h2{font:700 2rem Georgia,serif}.resultlead{color:#aab6bf}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}.stats div{display:grid;gap:4px;padding:18px;border:1px solid rgba(255,255,255,.09);border-radius:15px;background:rgba(8,12,17,.34)}.stats strong{color:#d8c17d;font-size:1.45rem}.stats span{color:#8f9da8;font-size:.76rem}.review{text-align:left}.review h3{font:700 1.35rem Georgia,serif}.reviewitem{margin:10px 0;padding:16px;border:1px solid rgba(255,255,255,.09);border-radius:15px;background:rgba(7,10,14,.31)}.reviewitem b{color:#d9c27f}.reviewitem p{margin:6px 0;font-size:.84rem;line-height:1.5}.wrongtext{color:#e88e86}.righttext{color:#6fd2bd}.explain{color:#9caab5}.resultactions{display:flex;justify-content:center;flex-wrap:wrap;gap:11px;margin-top:22px}.whatsapp{background:#20b862;color:#fff}.restart{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.025);color:#e5e8e8}
    .footer{width:min(1120px,100%);margin:auto;padding:22px 0 26px;display:flex;justify-content:space-between;gap:20px;border-top:1px solid rgba(255,255,255,.07);color:#687783;font-size:.7rem}
    @media(max-width:760px){.shell{padding:0 13px}.header{min-height:auto;grid-template-columns:1fr auto;gap:15px;padding:15px 0 16px}.logo{width:53px;height:53px}.role{font-size:.64rem}.title{grid-column:1/-1;grid-row:2;padding-top:13px;border-top:1px solid rgba(255,255,255,.06)}.title h1{font-size:1.32rem}.contact strong{font-size:1rem}.stage{padding:26px 0 34px}.card{border-radius:19px}.inside{padding:25px 20px}.hero h2{font-size:2.25rem}.skills{display:grid}.vartable{grid-template-columns:70px 1fr}.vaxis,.varrows{padding:0 15px}.choice{grid-template-columns:30px 1fr auto;padding:11px 12px}.option{font-size:.86rem}.stats{grid-template-columns:1fr}.resultactions{display:grid}.resultactions button{width:100%}.footer{flex-direction:column;text-align:center}}
  </style>
</head>

  <script>
    const Q=[
      {l:"1 · Lecture graphique",q:"D’après la courbe, quelle affirmation est correcte ?",o:["f est strictement croissante sur ℝ.","f est strictement décroissante sur ]−∞ ; 2] puis strictement croissante sur [2 ; +∞[.","f est strictement croissante sur ]−∞ ; 2] puis strictement décroissante sur [2 ; +∞[.","f est strictement décroissante sur ℝ."],a:1,e:"La parabole descend jusqu’à son sommet d’abscisse 2, puis elle remonte. Le changement de variation se fait au sommet.",f:"up"},
      {l:"1 · Calcul du taux",q:"Pour f(x) = x² − 4x + 1 et a ≠ b, quelle expression obtient-on ?",o:["(f(a) − f(b)) / (a − b) = a + b − 4","(f(a) − f(b)) / (a − b) = a − b − 4","(f(a) − f(b)) / (a − b) = a + b + 4","(f(a) − f(b)) / (a − b) = 2a + 2b − 4"],a:0,e:"f(a) − f(b) = a² − b² − 4(a − b) = (a − b)(a + b − 4). On divise ensuite par a − b, qui est non nul."},
      {l:"2 · Signe et intervalle",q:"On suppose a et b distincts dans ]−∞ ; 2]. Quelle conclusion est rigoureuse ?",o:["a + b − 4 < 0, donc f est strictement décroissante sur ]−∞ ; 2].","a + b − 4 > 0, donc f est strictement croissante sur ]−∞ ; 2].","a + b − 4 = 0 pour tous a et b, donc f est constante.","Le signe dépend toujours de a et b : aucune conclusion n’est possible."],a:0,e:"Comme a ≤ 2, b ≤ 2 et a ≠ b, on a strictement a + b < 4. Le taux est donc négatif pour tous les couples distincts de l’intervalle."},
      {l:"2 · Tableau de variation",q:"Pour f(x) = x² − 4x + 1, quelle est la valeur à placer au sommet du tableau ?",o:["−3, minimum atteint pour x = 2","3, maximum atteint pour x = 2","1, minimum atteint pour x = 0","−4, minimum atteint pour x = 1"],a:0,e:"f(2) = 2² − 4×2 + 1 = −3. La parabole est tournée vers le haut : −3 est donc le minimum de f.",f:"table"},
      {l:"2 · Parabole tournée vers le bas",q:"On considère g(x) = −x² + 6x − 5. Que lit-on et que vérifie-t-on au sommet ?",o:["g admet un maximum égal à 4, atteint pour x = 3.","g admet un minimum égal à 4, atteint pour x = 3.","g admet un maximum égal à 3, atteint pour x = 4.","g ne possède aucun extremum."],a:0,e:"L’axe du sommet est x = 3 et g(3) = −9 + 18 − 5 = 4. Comme le coefficient de x² est négatif, cet extremum est un maximum.",f:"down"},
      {l:"3 · Démonstration complète",q:"Pour g(x) = −x² + 6x − 5, le taux vaut 6 − a − b. Quel tableau de variation en résulte ?",o:["g croît sur ]−∞ ; 3] puis décroît sur [3 ; +∞[.","g décroît sur ]−∞ ; 3] puis croît sur [3 ; +∞[.","g croît sur ℝ.","g décroît sur ℝ."],a:0,e:"À gauche de 3, a + b < 6 : le taux est positif. À droite de 3, a + b > 6 : le taux est négatif."},
      {l:"3 · Différence des images",q:"Pour h(x) = 2x² + 8x − 3 et a < b, quelle factorisation est exacte ?",o:["h(a) − h(b) = 2(a − b)(a + b + 4)","h(a) − h(b) = 2(a − b)(a + b − 4)","h(a) − h(b) = 2(a + b)(a − b + 4)","h(a) − h(b) = (a − b)(2a + 2b + 4)"],a:0,e:"2(a² − b²) + 8(a − b) = 2(a − b)(a + b + 4). Le changement de variation se situe en x = −2."},
      {l:"3 · Sommet fractionnaire",q:"Pour p(x) = −3x² + 3x + 2, quelle synthèse est exacte ?",o:["p croît jusqu’à 1/2, puis décroît ; son maximum vaut 11/4.","p décroît jusqu’à 1/2, puis croît ; son minimum vaut 11/4.","p croît jusqu’à 1, puis décroît ; son maximum vaut 2.","p est strictement décroissante sur ℝ."],a:0,e:"Le taux est −3(a + b − 1). Il est positif à gauche de 1/2 et négatif à droite. De plus, p(1/2) = 11/4.",f:"fraction"},
      {l:"4 · Généralisation",q:"Soit P(x) = Ax² + Bx + C avec A > 0 et α = −B/(2A). Quel tableau est toujours correct ?",o:["P décroît sur ]−∞ ; α], puis croît sur [α ; +∞[ ; P(α) est un minimum.","P croît sur ]−∞ ; α], puis décroît sur [α ; +∞[ ; P(α) est un maximum.","P est croissante sur ℝ dès que A > 0.","Le signe de A ne donne aucune information sur la nature de l’extremum."],a:0,e:"Le taux vaut A(u + v − 2α). Pour A > 0, il est négatif à gauche de α et positif à droite. Le sommet est donc un minimum.",f:"general"},
      {l:"4 · Piège de raisonnement",q:"Un élève trouve un taux d’accroissement positif pour un seul couple de points et conclut que le trinôme est croissant sur ℝ. Quelle critique est correcte ?",o:["La conclusion est correcte pour toute fonction polynôme.","Un seul couple ne suffit pas : il faut étudier tous les couples distincts de chaque intervalle considéré.","Il suffit de vérifier un deuxième couple choisi au hasard.","Le taux d’accroissement d’un trinôme est toujours positif."],a:1,e:"La monotonie est une propriété globale sur un intervalle. Une parabole peut avoir des sécantes de pentes opposées de part et d’autre de son sommet.",f:"secants"}

    function startScreen(){app.innerHTML=`<div class="card hero"><img class="watermark" src="${logo}" alt=""><div class="inside"><span class="badge">✦ Parcours progressif</span><h2>Teste ton raisonnement, pas seulement ta mémoire.</h2><p class="lead">10 questions · figures pédagogiques · correction immédiate · score sur 20</p><div class="skills"><span>Lire une parabole</span><span>Étudier un taux</span><span>Dresser un tableau</span></div><label class="field">Prénom et nom <em>(facultatif)</em><input id="student" placeholder="Écris ton nom"></label><button class="btn primary" onclick="start()">Commencer le quiz →</button></div></div>`}
    function start(){name=document.getElementById("student").value.trim();render()}
    function render(){const q=Q[i],pct=Math.round((i+(checked?1:0))/Q.length*100);app.innerHTML=`<div class="progressline"><div class="progresscopy"><span>Question ${i+1} sur ${Q.length}</span><strong>${pct}%</strong></div><div class="bar"><i style="width:${pct}%"></i></div></div><div class="card"><img class="watermark" src="${logo}" alt=""><div class="inside"><span class="badge level">${q.l}</span><h2 class="question">${q.q}</h2>${figure(q.f)}<div class="answers">${q.o.map((o,n)=>`<div class="choice ${selected===n?"selected":""} ${checked&&n===q.a?"correct":""} ${checked&&n===selected&&n!==q.a?"wrong":""}" onclick="choose(${n})"><span class="letter">${L[n]}</span><span class="option">${o}</span><span class="mark">${checked&&n===q.a?"✓":checked&&n===selected&&n!==q.a?"✕":""}</span></div>`).join("")}</div>${checked?`<div class="feedback ${selected===q.a?"good":"bad"}"><strong>${selected===q.a?"✓ Bonne réponse":"✕ À corriger"}</strong><p>${q.e}</p></div>`:""}<div class="actions"><button class="btn primary" ${selected===null?"disabled":""} onclick="${checked?"next()":"verify()"}">${checked?(i===Q.length-1?"Voir mon score →":"Question suivante →"):"Vérifier"}</button></div></div></div>`}
    function choose(n){if(checked)return;selected=n;render()}function verify(){if(selected===null)return;answers[i]=selected;checked=true;render()}
    function next(){if(i===Q.length-1){result();return}i++;selected=null;checked=false;render();scrollTo({top:0,behavior:"smooth"})}
    function result(){const good=answers.filter((v,n)=>v===Q[n].a).length,score=good*2,bad=Q.length-good;try{const key=`qfm_scores_${(name||"eleve").toLowerCase().replace(/\s+/g,"_")}`,hist=JSON.parse(localStorage.getItem(key)||"[]");localStorage.setItem(key,JSON.stringify([{title:"QFM - Monotonie des trinômes",score,total:20,date:new Date().toISOString(),url:location.href},...hist].slice(0,10)))}catch(e){}const msg=score>=18?"Excellent : les variations et les preuves sont maîtrisées.":score>=14?"Très bien : encore quelques signes ou intervalles à consolider.":score>=10?"En progrès : reprends les corrections des questions manquées.":"À retravailler : concentre-toi sur le sommet, le signe du taux et les deux intervalles.";const mistakes=Q.map((q,n)=>({q,n,c:answers[n]})).filter(x=>x.c!==x.q.a);app.innerHTML=`<div class="card"><div class="inside result"><span class="badge">✓ Résultat QFM</span><div class="score"><strong>${score}</strong><span>/20</span></div><h2>${name?`Bravo ${name} !`:"Quiz terminé !"}</h2><p class="resultlead">${msg}</p><div class="stats"><div><strong>${good}</strong><span>bonnes réponses</span></div><div><strong>${bad}</strong><span>points à revoir</span></div><div><strong>${score*5}%</strong><span>de réussite</span></div></div>${mistakes.length?`<section class="review"><h3>Révision de tes erreurs</h3>${mistakes.map(x=>`<article class="reviewitem"><b>Question ${x.n+1}</b><p>${x.q.q}</p><p class="wrongtext">Ta réponse : ${x.c===null?"aucune":x.q.o[x.c]}</p><p class="righttext">Bonne réponse : ${x.q.o[x.q.a]}</p><p class="explain">${x.q.e}</p></article>`).join("")}</section>`:`<p class="feedback good">Sans faute : démonstration parfaite.</p>`}<div class="resultactions"><button class="btn whatsapp" onclick="share(${score})">☏ Partager sur WhatsApp</button><button class="btn restart" onclick="restart()">↻ Recommencer</button></div></div></div>`;scrollTo({top:0,behavior:"smooth"})}
    function share(score){const who=name?` (${name})`:"",text=`J’ai obtenu ${score}/20 au QFM « Monotonie des trinômes »${who}. À toi de jouer : ${location.href}`;open(`https://wa.me/?text=${encodeURIComponent(text)}`,"_blank","noopener,noreferrer")}
    function restart(){i=0;selected=null;checked=false;answers=Array(Q.length).fill(null);startScreen();scrollTo({top:0,behavior:"smooth"})}startScreen();
  </script>
</body>
</html>
