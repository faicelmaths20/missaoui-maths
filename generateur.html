<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Générateur de cours</title><link rel="stylesheet" href="css/style.css"><style>textarea,input{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;margin:8px 0 18px;font-size:16px}pre{white-space:pre-wrap;background:#1d1a33;color:white;padding:20px;border-radius:18px;overflow:auto}</style></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-icon">M</span><span>Générateur</span></a></header><main class="section" style="padding-top:50px"><h2>Générateur automatique de cours + quiz</h2><p class="subtitle">Remplis les champs, puis copie le HTML généré dans un nouveau fichier GitHub.</p><label>Titre du chapitre</label><input id="titre" value="Statistiques"><label>Niveau</label><input id="niveau" value="3ème"><label>Définition principale</label><textarea id="definition">La moyenne est la somme des valeurs divisée par le nombre de valeurs.</textarea><label>Question de quiz</label><input id="question" value="Quelle est la moyenne de 4 ; 8 ; 12 ?"><label>Bonne réponse</label><input id="reponse" value="8"><button class="btn-3d primary" onclick="generer()">Générer le code</button><pre id="sortie"></pre></main><script>function generer(){const t=titre.value,n=niveau.value,d=definition.value,q=question.value,r=reponse.value;sortie.textContent=`<!DOCTYPE html>\n<html lang="fr">\n<head><meta charset="UTF-8"><title>${t} - ${n}</title><link rel="stylesheet" href="css/style.css"></head>\n<body><main class="section" style="padding-top:40px"><a href="index.html" class="btn-3d">← Retour</a><h2>${t}</h2><p class="subtitle">Niveau : ${n}</p><article class="chapter-card"><span class="tag">Définition</span><p>${d}</p></article><article class="chapter-card"><span class="tag">Quiz</span><h3>${q}</h3><button class="btn-3d small" onclick="alert('Bonne réponse : ${r}')">Voir la réponse</button></article></main></body></html>`}</script></body></html>
