function G(key){

  const L=(x,y,X,Y,opts='')=>'<line x1="'+x+'" y1="'+y+'" x2="'+X+'" y2="'+Y+'" '+opts+'/>';

  const dot=(x,y,l,dx=0,dy=-13)=>P(x,y)+T(x+dx,y+dy,l);
  const circle=(x,y,r)=>'<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="none"/>';
  const line=(xy,opts='')=>'<polyline points="'+xy+'" '+opts+'/>';
  const q=(x,y,w,h=w,extra='')=>'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" '+extra+'/>';

  const thin='stroke-width="2"',accent='stroke="'+gold+'"',grid='stroke="#9db7d6" stroke-width="1.4"';
  let shape='',desc='',vb='0 0 380 184';
  switch(key){

      for(let i=0;i<=10;i++){let x=40+i*29;shape+=L(x,i===0||i===10?81:88,x,i===0||i===10?111:104,thin)}
      shape+=T(40,142,'2')+T(330,142,'3')+dot(214,96,'A',0,-21);break;
    }

function selectSession(){
  el('serieslist').replaceChildren();

function reveal(id,open){
  const b=el(id),panel=el(id+'panel');
  b.setAttribute('aria-expanded',String(open));panel.hidden=!open;
  if(id==='answer')b.querySelector('span').textContent=open?'Masquer la réponse':'Afficher la réponse';
  if(id==='hint')b.querySelector('span').textContent=open?'Masquer l’indice':'Coup de pouce';
}
function toggle(id){
  const open=el(id).getAttribute('aria-expanded')!=='true';
  reveal(id,open);
  if(open&&id==='board')el('note').focus();
  if(open&&id!=='board'&&el(id+'panel').getBoundingClientRect().bottom>window.innerHeight){
    el(id+'panel').scrollIntoView({block:'nearest'});
  }
}
function draw(){
  const s=Math.floor(idx/5),[q,visual,h,a,reason]=questions[idx];
  el('sn').textContent='Séance '+pad(s+1);el('topic').textContent=sessions[s];
  el('count').textContent=(idx+1)+' / '+questions.length;
  el('num').textContent='Question '+pad(idx+1);
  el('question').textContent=q;el('question').classList.toggle('long',q.length>72);
  el('visual').innerHTML=visual;
  el('visual').classList.toggle('compact',[3,7,13,18,24,26,40,41,46].includes(idx));
  el('hintcopy').innerHTML=h;el('result').innerHTML=a;el('why').innerHTML=reason;
  ['hint','answer','board'].forEach(id=>reveal(id,false));
  el('note').value=drafts[idx];el('prev').disabled=idx===0;
  el('next').textContent=idx===questions.length-1?'Terminer':'Suivante';
  el('steps').replaceChildren();
  for(let i=s*5;i<s*5+5;i++){
    const b=document.createElement('button');b.textContent=pad(i+1);
    b.setAttribute('aria-label','Question '+(i+1));
    if(i===idx)b.setAttribute('aria-current','step');
    b.addEventListener('click',()=>go(i));el('steps').append(b);
  }
}
function go(i){
  if(i<0||i>=questions.length)return;
  idx=i;
  if(location.hash!=='#q-'+(i+1))history.replaceState(null,'','#q-'+(i+1));
  draw();el('question').focus({preventScroll:true});window.scrollTo(0,0);
}
function next(){if(idx===questions.length-1){el('done').showModal()}else{go(idx+1)}}
el('note').addEventListener('input',()=>{drafts[idx]=el('note').value});
el('hint').onclick=()=>toggle('hint'); el('answer').onclick=()=>toggle('answer'); el('board').onclick=()=>toggle('board');
el('menu').onclick=selectSession;el('again').onclick=()=>{el('done').close();selectSession()};
el('prev').onclick=()=>go(idx-1);el('next').onclick=next;
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>el(b.dataset.close).close());
document.querySelectorAll('dialog').forEach(d=>d.addEventListener('click',ev=>{
  if(ev.target!==d)return;
  const r=d.getBoundingClientRect();if(ev.clientX<r.left||ev.clientX>r.right||ev.clientY<r.top||ev.clientY>r.bottom)d.close();
}));
const fullscreenButton=el('full');
if(!document.fullscreenEnabled)fullscreenButton.hidden=true;
fullscreenButton.onclick=async()=>{
  try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}
  catch{fullscreenButton.title='Plein écran indisponible dans ce navigateur'}
};
document.addEventListener('fullscreenchange',()=>{
  const t=document.fullscreenElement?'Quitter le plein écran':'Plein écran';
  el('fulltext').textContent=t;fullscreenButton.title=t;fullscreenButton.setAttribute('aria-label',t)
});
window.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey||e.repeat||document.querySelector('dialog[open]')||e.target.isContentEditable||/TEXTAREA|INPUT|SELECT/.test(e.target.tagName))return;
  const k=e.key.toLowerCase();
  if(k==='arrowright'&&idx<questions.length-1){e.preventDefault();go(idx+1)}
  if(k==='arrowleft'&&idx>0){e.preventDefault();go(idx-1)}
  if(k==='r'){e.preventDefault();toggle('answer')}
  if(k==='c'){e.preventDefault();toggle('hint')}
});
window.addEventListener('hashchange',()=>{idx=fromHash();draw()});
idx=fromHash();draw();

</script></body></html>
