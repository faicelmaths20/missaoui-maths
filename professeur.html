<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espace professeur</title>

<style>
body{
  margin:0;
  font-family:Georgia,serif;
  background:#f7f6f1;
}

.container{
  max-width:800px;
  margin:40px auto;
}

.card{
  background:white;
  padding:30px;
  border-radius:20px;
  box-shadow:0 20px 50px rgba(0,0,0,.15);
  margin-bottom:20px;
}

input,button{
  width:100%;
  padding:12px;
  margin:10px 0;
  border-radius:10px;
}

button{
  background:#ef3b4d;
  color:white;
  font-weight:bold;
  border:none;
  cursor:pointer;
}

.hidden{display:none}
.file{padding:10px;background:#eee;margin:10px 0;border-radius:10px}
</style>

</head>

<body>

<div class="container">

<div class="card" id="loginBox">
<h2>👨‍🏫 Espace professeur</h2>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Mot de passe">

<button onclick="login()">Connexion</button>

<button onclick="loginGoogle()" style="background:#4285F4">
🔵 Google
</button>

</div>

<div class="card hidden" id="dashboard">
<h2>📚 Dashboard</h2>

<button onclick="logout()">Déconnexion</button>

<input id="titre" placeholder="Titre fichier">
<input type="file" id="file">

<button onclick="upload()">Uploader</button>

<div id="files"></div>

</div>

</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBx8_xMKIgAc2CDNSGjoPn7zxCkImvZKcs",
  authDomain: "missaouimaths.firebaseapp.com",
  projectId: "missaouimaths",
  storageBucket: "missaouimaths.firebasestorage.app",
  messagingSenderId: "781971966091",
  appId: "1:781971966091:web:d5522f8d70b008a844ac8e"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

function login(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  auth.signInWithEmailAndPassword(email, password)
    .then(()=>alert("Connecté ✅"))
    .catch(e=>alert(e.message));
}

function loginGoogle(){
  const provider = new firebase.auth.GoogleAuthProvider();

  auth.signInWithPopup(provider)
    .then(result=>{
      if(result.user.email==="missaoui.faicel@gmail.com"){
        alert("Connexion OK ✅");
      } else {
        alert("Accès refusé ❌");
        auth.signOut();
      }
    })
    .catch(e=>alert(e.message));
}
</script>

</body>
</html>
