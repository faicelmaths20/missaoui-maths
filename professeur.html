<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espace professeur</title>

<style>
body{
  margin:0;
  font-family:Georgia,serif;
  background:#f7f6f1;
}

.container{
  max-width:800px;
  margin:40px auto;
}

.card{
  background:white;
  padding:30px;
  border-radius:20px;
  box-shadow:0 20px 50px rgba(0,0,0,.15);
  margin-bottom:20px;
}

input,button{
  width:100%;
  padding:12px;
  margin:10px 0;
  border-radius:10px;
}

button{
  background:#ef3b4d;
  color:white;
  font-weight:bold;
  border:none;
  cursor:pointer;
}

.hidden{display:none}
.file{padding:10px;background:#eee;margin:10px 0;border-radius:10px}
</style>

</head>

<body>

<div class="container">

<div class="card" id="loginBox">
<h2>👨‍🏫 Espace professeur</h2>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Mot de passe">

<button onclick="login()">Connexion</button>

<button onclick="loginGoogle()" style="background:#4285F4">
🔵 Google
</button>

</div>

<div class="card hidden" id="dashboard">
<h2>📚 Dashboard</h2>

<button onclick="logout()">Déconnexion</button>

<input id="titre" placeholder="Titre fichier">
<input type="file" id="file">

<button onclick="upload()">Uploader</button>

<div id="files"></div>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";
import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* 🔴 TON CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyBx8_xMKIgAc2CDNSGjoPn7zxCkImvZKcs",
  authDomain: "missaouimaths.firebaseapp.com",
  projectId: "missaouimaths",
  storageBucket: "missaouimaths.firebasestorage.app",
  messagingSenderId: "781971966091",
  appId: "1:781971966091:web:d5522f8d70b008a844ac8e"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const storage = getStorage(app);
const db = getFirestore(app);

/* EMAIL LOGIN */
window.login = function(){
  let email = document.getElementById("email").value;
  let password = document.getElementById("password").value;

  signInWithEmailAndPassword(auth,email,password)
  .then(()=>alert("Connecté ✅"))
  .catch(e=>alert(e.message));
}

/* GOOGLE LOGIN */
const provider = new GoogleAuthProvider();

window.loginGoogle = function(){
  signInWithPopup(auth, provider)
  .then(res=>{
    if(res.user.email==="missaoui.faicel@gmail.com"){
      alert("Google OK ✅");
    }else{
      alert("Accès refusé ❌");
      signOut(auth);
    }
  })
  .catch(e=>alert(e.message));
}

/* LOGOUT */
window.logout = function(){
  signOut(auth);
}

/* AUTH STATE */
onAuthStateChanged(auth,user=>{
  if(user){
    document.getElementById("loginBox").classList.add("hidden");
    document.getElementById("dashboard").classList.remove("hidden");
    loadFiles();
  }else{
    document.getElementById("loginBox").classList.remove("hidden");
    document.getElementById("dashboard").classList.add("hidden");
  }
});

/* UPLOAD */
window.upload = async function(){
  let file = document.getElementById("file").files[0];
  let titre = document.getElementById("titre").value;

  let storageRef = ref(storage,"fichiers/"+file.name);

  await uploadBytes(storageRef,file);
  let url = await getDownloadURL(storageRef);

  await addDoc(collection(db,"fichiers"),{
    titre:titre,
    url:url
  });

  alert("Upload OK");
  loadFiles();
}

/* LOAD FILES */
async function loadFiles(){
  let div=document.getElementById("files");
  div.innerHTML="";

  let snap=await getDocs(collection(db,"fichiers"));

  snap.forEach(doc=>{
    let d=doc.data();
    div.innerHTML+=`<div class="file">
      <b>${d.titre}</b><br>
      <a href="${d.url}" target="_blank">ouvrir</a>
    </div>`;
  });
}

</script>

</body>
</html>
