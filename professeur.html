<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espace professeur</title>

<style>
body{
  margin:0;
  font-family:Georgia,serif;
  background:#f7f6f1;
  color:#19182b;
}
.container{
  max-width:850px;
  margin:50px auto;
  padding:25px;
}
.card{
  background:white;
  padding:30px;
  border-radius:24px;
  box-shadow:0 25px 60px rgba(0,0,0,.12);
  margin-bottom:25px;
}
h1,h2{margin-top:0}
input,select,button{
  width:100%;
  padding:14px;
  margin:10px 0;
  border-radius:12px;
  border:1px solid #ddd;
  font-size:16px;
}
button{
  background:#ef3b4d;
  color:white;
  font-weight:bold;
  border:none;
  cursor:pointer;
  box-shadow:0 7px 0 #9f1f2d;
}
button:active{
  transform:translateY(5px);
  box-shadow:0 2px 0 #9f1f2d;
}
.hidden{display:none}
.file-item{
  background:#f7f6f1;
  padding:15px;
  border-radius:14px;
  margin:10px 0;
}
a{color:#ef3b4d;font-weight:bold}
</style>
</head>

<body>

<div class="container">

  <div class="card" id="loginBox">
    <h1>👨‍🏫 Espace professeur</h1>
    <p>Connexion sécurisée avec email et mot de passe Firebase.</p>

    <input type="email" id="email" placeholder="Email professeur">
    <input type="password" id="password" placeholder="Mot de passe">

    <button onclick="loginProf()">Connexion professeur</button>
  </div>

  <div class="card hidden" id="dashboard">
    <h1>📚 Tableau professeur</h1>
    <p id="profEmail"></p>

    <button onclick="logoutProf()">Déconnexion</button>
  </div>

  <div class="card hidden" id="uploadBox">
    <h2>📁 Déposer un fichier</h2>

    <select id="typeFichier">
      <option value="cours">Cours</option>
      <option value="exercices">Exercices</option>
      <option value="correction">Correction</option>
      <option value="carte-mentale">Carte mentale</option>
      <option value="video">Vidéo</option>
    </select>

    <input type="text" id="titreFichier" placeholder="Titre du fichier">
    <input type="file" id="fileInput">

    <button onclick="uploadFile()">Téléverser</button>

    <p id="uploadStatus"></p>
  </div>

  <div class="card hidden" id="filesBox">
    <h2>📥 Fichiers disponibles</h2>
    <div id="filesList">Chargement...</div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { 
  getAuth, 
  signInWithEmailAndPassword, 
  signOut, 
  onAuthStateChanged 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import { 
  getStorage, 
  ref, 
  uploadBytes, 
  getDownloadURL 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

import { 
  getFirestore, 
  collection, 
  addDoc, 
  getDocs, 
  serverTimestamp 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* 🔴 REMPLACE ICI PAR TA CONFIG FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyBx8_xMKIgAc2CDNSGjoPn7zxCkImvZKcs",
  authDomain: "missaouimaths.firebaseapp.com",
  projectId: "missaouimaths",
  storageBucket: "missaouimaths.firebasestorage.app",
  messagingSenderId: "781971966091",
  appId: "1:781971966091:web:d5522f8d70b008a844ac8e"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const storage = getStorage(app);
const db = getFirestore(app);

/* Connexion professeur */
window.loginProf = async function(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  try{
    await signInWithEmailAndPassword(auth, email, password);
    alert("Connexion réussie ✅");
  }catch(error){
    alert("Erreur connexion : " + error.message);
  }
}

/* Déconnexion */
window.logoutProf = async function(){
  await signOut(auth);
}

/* Vérifier connexion */
onAuthStateChanged(auth, user => {
  if(user){
    document.getElementById("loginBox").classList.add("hidden");
    document.getElementById("dashboard").classList.remove("hidden");
    document.getElementById("uploadBox").classList.remove("hidden");
    document.getElementById("filesBox").classList.remove("hidden");
    document.getElementById("profEmail").innerText = "Connecté : " + user.email;
    loadFiles();
  }else{
    document.getElementById("loginBox").classList.remove("hidden");
    document.getElementById("dashboard").classList.add("hidden");
    document.getElementById("uploadBox").classList.add("hidden");
    document.getElementById("filesBox").classList.add("hidden");
  }
});

/* Upload fichier */
window.uploadFile = async function(){
  const file = document.getElementById("fileInput").files[0];
  const titre = document.getElementById("titreFichier").value;
  const type = document.getElementById("typeFichier").value;
  const status = document.getElementById("uploadStatus");

  if(!file || !titre){
    alert("Ajoute un titre et un fichier.");
    return;
  }

  try{
    status.innerText = "Téléversement en cours...";

    const chemin = "fichiers/" + type + "/" + Date.now() + "-" + file.name;
    const storageRef = ref(storage, chemin);

    await uploadBytes(storageRef, file);
    const url = await getDownloadURL(storageRef);

    await addDoc(collection(db, "fichiers"), {
      titre: titre,
      type: type,
      nom: file.name,
      url: url,
      date: serverTimestamp()
    });

    status.innerText = "Fichier ajouté avec succès ✅";
    document.getElementById("titreFichier").value = "";
    document.getElementById("fileInput").value = "";

    loadFiles();

  }catch(error){
    status.innerText = "Erreur : " + error.message;
  }
}

/* Afficher fichiers */
async function loadFiles(){
  const list = document.getElementById("filesList");
  list.innerHTML = "";

  const querySnapshot = await getDocs(collection(db, "fichiers"));

  if(querySnapshot.empty){
    list.innerHTML = "Aucun fichier pour le moment.";
    return;
  }

  querySnapshot.forEach(doc => {
    const f = doc.data();

    const div = document.createElement("div");
    div.className = "file-item";
    div.innerHTML = `
      <strong>${f.titre}</strong><br>
      Type : ${f.type}<br>
      <a href="${f.url}" target="_blank">Télécharger / ouvrir</a>
    `;

    list.appendChild(div);
  });
}
</script>

</body>
</html>
