<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page introuvable – Missaoui Maths</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&family=Outfit:wght@400;600&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Outfit',sans-serif;background:#f0f4ff;color:#1e293b;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;overflow:hidden;}
.bg{position:fixed;inset:0;z-index:0;}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:0.13;}
.b1{width:400px;height:400px;background:radial-gradient(circle,#6366f1,#8b5cf6);top:-80px;left:-60px;}
.b2{width:300px;height:300px;background:radial-gradient(circle,#3b82f6,#06b6d4);bottom:60px;right:-40px;}
.card{position:relative;z-index:1;max-width:480px;}
.num{font-family:'JetBrains Mono',monospace;font-size:8rem;font-weight:600;line-height:1;background:linear-gradient(135deg,#6366f1,#8b5cf6,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:0.5rem;animation:bounce 2s ease-in-out infinite;}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.title{font-family:'Nunito',sans-serif;font-size:1.8rem;font-weight:900;margin-bottom:0.6rem;}
.desc{color:#64748b;font-size:0.95rem;line-height:1.7;margin-bottom:2rem;}
.links{display:flex;flex-wrap:wrap;gap:0.7rem;justify-content:center;}
.btn{display:inline-flex;align-items:center;gap:0.4rem;font-size:0.88rem;font-weight:700;padding:0.65rem 1.4rem;border-radius:28px;text-decoration:none;transition:all 0.2s;}
.btn-primary{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:white;box-shadow:0 6px 20px rgba(99,102,241,0.35);}
.btn-primary:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(99,102,241,0.45);}
.btn-secondary{background:white;color:#6366f1;border:2px solid #e9d5ff;box-shadow:0 4px 14px rgba(0,0,0,0.06);}
.btn-secondary:hover{border-color:#6366f1;transform:translateY(-2px);}
</style>
</head>
<body>
<div class="bg"><div class="blob b1"></div><div class="blob b2"></div></div>
<div class="card">
  <div class="num">404</div>
  <div class="title">Oops… Page introuvable !</div>
  <div class="desc">Cette page n'existe pas ou a été déplacée. Retourne à l'accueil pour trouver ce que tu cherches.</div>
  <div class="links">
    <a href="index.html" class="btn btn-primary">🏠 Retour à l'accueil</a>
    <a href="francais.html" class="btn btn-secondary">📚 Voir les cours</a>
  </div>
</div>
</body>
</html>
