<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>QFM Seconde · Nombres et calcul littéral</title>
  <meta name="description" content="30 questions progressives avec coups de pouce et corrections. QFM Seconde, par Faicel Missaoui.">
  <style>
    :root{--bg:#0d0f14;--card:#151a22;--ink:#eee9df;--muted:#9eacb7;--green:#3eb89f;--gold:#d5b96f;--red:#db6258;--line:rgba(255,255,255,.11)}
    *{box-sizing:border-box}html{min-height:100%;background:var(--bg)}body{min-height:100vh;margin:0;color:var(--ink);font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at 8% 0%,rgba(62,184,159,.12),transparent 31rem),radial-gradient(circle at 92% 12%,rgba(213,185,111,.1),transparent 28rem),var(--bg)}
    button,input{font:inherit}.shell{min-height:100vh;display:flex;flex-direction:column;padding:0 20px}.header{width:min(1120px,100%);margin:auto auto 0;min-height:112px;display:grid;grid-template-columns:1.2fr 1fr .65fr;align-items:center;gap:22px;border-bottom:1px solid rgba(213,185,111,.38)}
    .brand{display:flex;align-items:center;gap:13px}.logo{width:68px;height:68px;object-fit:contain;filter:drop-shadow(0 8px 20px rgba(0,0,0,.28))}.name{margin:0;color:#f5ead0;font:700 clamp(1.18rem,2vw,1.48rem) Georgia,serif}.role{margin:4px 0 0;color:#93a1ad;font-size:.76rem}.title{text-align:center}.kicker,.contact span{display:block;color:var(--gold);font-size:.69rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase}.title h1{margin:7px 0 0;font:700 clamp(1.2rem,2.6vw,1.78rem)/1.08 Georgia,serif}.contact{text-align:right}.contact strong{display:block;margin-top:5px;font-size:1.2rem}
    .stage{width:min(920px,100%);margin:auto;flex:1;padding:48px 0 52px}.card{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:25px;background:linear-gradient(145deg,rgba(255,255,255,.035),transparent 42%),var(--card);box-shadow:0 28px 70px rgba(0,0,0,.35)}.card:before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:linear-gradient(var(--green),var(--gold))}.watermark{position:absolute;right:-45px;bottom:-66px;width:270px;height:270px;object-fit:contain;opacity:.035;pointer-events:none}
    .inside{position:relative;z-index:1;padding:30px 34px}.badge{display:inline-flex;align-items:center;border:1px solid rgba(62,184,159,.34);border-radius:999px;padding:5px 10px;background:rgba(62,184,159,.12);color:#88dfcc;font-size:.75rem;font-weight:700}.hero{min-height:520px;display:grid;align-content:center}.hero h2{max-width:690px;margin:16px 0 10px;font:700 clamp(2rem,5vw,3.45rem)/1.05 Georgia,serif;color:#f6f0e5}.lead{color:#aeb9c2;line-height:1.6}.skills{display:flex;flex-wrap:wrap;gap:9px;margin:22px 0}.skills span{padding:8px 12px;border:1px solid rgba(213,185,111,.24);border-radius:999px;background:rgba(213,185,111,.07);color:#dfcc98;font-size:.78rem}.field{display:grid;gap:9px;max-width:520px;color:#dfe5e9;font-size:.86rem;font-weight:700}.field em{color:#7f8d98;font-style:normal;font-weight:400}.field input{height:48px;border:1px solid rgba(255,255,255,.13);border-radius:12px;padding:0 14px;background:rgba(5,8,12,.36);color:#f4f0e8;outline:none}.field input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(62,184,159,.15)}
    .btn{min-height:48px;border:0;border-radius:13px;padding:0 20px;cursor:pointer;font-weight:800}.primary{margin-top:22px;background:var(--green);color:#06140f;box-shadow:0 12px 26px rgba(62,184,159,.2)}.primary:hover{background:#56c9b1}.btn:disabled{cursor:not-allowed;opacity:.45}.progressline{margin:0 4px 18px}.progresscopy{display:flex;justify-content:space-between;margin-bottom:10px;color:#9cabb6;font-size:.8rem;font-weight:700}.progresscopy strong{color:var(--gold)}.bar{height:7px;overflow:hidden;border-radius:99px;background:rgba(255,255,255,.08)}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--gold));transition:width .25s}
    .level{border-color:rgba(213,185,111,.33);background:rgba(213,185,111,.06);color:#d9c387}.question{margin:13px 0 22px;color:#f6f1e8;font:700 clamp(1.36rem,3vw,1.82rem)/1.35 Georgia,serif}.figure{display:block;width:min(520px,100%);height:auto;margin:0 auto 22px;border:1px solid rgba(255,255,255,.08);border-radius:19px;background:#111923;box-shadow:0 16px 32px rgba(0,0,0,.22)}
    .vartable{width:min(610px,100%);margin:0 auto 22px;display:grid;grid-template-columns:95px 1fr;overflow:hidden;border:1px solid rgba(255,255,255,.16);border-radius:16px;background:#111923}.vartable>div{min-height:52px;display:flex;align-items:center;border-bottom:1px solid rgba(255,255,255,.12)}.vartable>div:nth-last-child(-n+2){border-bottom:0}.vlabel{justify-content:center;border-right:1px solid rgba(255,255,255,.12);font:italic 1rem Georgia,serif}.vaxis,.varrows{justify-content:space-between;padding:0 28px}.vaxis strong,.varrows strong{color:#f1d792}.varrows{min-height:76px!important;color:#67cfb9;font-size:2rem}
    .answers{display:grid;gap:11px}.choice{min-height:58px;display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:11px;padding:12px 15px;border:1px solid rgba(255,255,255,.1);border-radius:14px;background:rgba(7,11,15,.38);cursor:pointer;transition:.16s}.choice:hover{transform:translateY(-1px);border-color:rgba(62,184,159,.45);background:rgba(62,184,159,.06)}.choice.selected{border-color:rgba(62,184,159,.78);background:rgba(62,184,159,.11)}.choice.correct{border-color:rgba(62,184,159,.85);background:rgba(62,184,159,.13)}.choice.wrong{border-color:rgba(219,98,88,.82);background:rgba(219,98,88,.12)}.letter{width:32px;height:32px;display:grid;place-items:center;border-radius:9px;background:rgba(255,255,255,.06);color:var(--gold);font-weight:800}.option{color:#e6e9e9;font-size:.94rem;line-height:1.5}.mark{font-size:1.2rem}.correct .mark{color:#58cdb4}.wrong .mark{color:#ef7f74}
    .feedback{margin-top:18px;padding:15px 17px;border:1px solid;border-radius:15px}.feedback.good{border-color:rgba(62,184,159,.42);background:rgba(62,184,159,.08);color:#75d8c3}.feedback.bad{border-color:rgba(219,98,88,.42);background:rgba(219,98,88,.08);color:#ef9188}.feedback strong{display:block}.feedback p{margin:8px 0 0;color:#c5cfd6;font-size:.9rem;line-height:1.6}.actions{display:flex;justify-content:flex-end}
    .result{text-align:center}.score{width:154px;height:154px;margin:18px auto;display:grid;place-content:center;border:2px solid rgba(62,184,159,.52);border-radius:50%;background:radial-gradient(circle,rgba(62,184,159,.15),rgba(62,184,159,.025));box-shadow:0 0 0 10px rgba(62,184,159,.045)}.score strong{font:700 3.1rem/.9 Georgia,serif;color:#f4ead0}.score span{color:#8fdcc9;font-weight:700}.result h2{font:700 2rem Georgia,serif}.resultlead{color:#aab6bf}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}.stats div{display:grid;gap:4px;padding:18px;border:1px solid rgba(255,255,255,.09);border-radius:15px;background:rgba(8,12,17,.34)}.stats strong{color:#d8c17d;font-size:1.45rem}.stats span{color:#8f9da8;font-size:.76rem}.review{text-align:left}.review h3{font:700 1.35rem Georgia,serif}.reviewitem{margin:10px 0;padding:16px;border:1px solid rgba(255,255,255,.09);border-radius:15px;background:rgba(7,10,14,.31)}.reviewitem b{color:#d9c27f}.reviewitem p{margin:6px 0;font-size:.84rem;line-height:1.5}.wrongtext{color:#e88e86}.righttext{color:#6fd2bd}.explain{color:#9caab5}.resultactions{display:flex;justify-content:center;flex-wrap:wrap;gap:11px;margin-top:22px}.whatsapp{background:#20b862;color:#fff}.restart{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.025);color:#e5e8e8}
    .footer{width:min(1120px,100%);margin:auto;padding:22px 0 26px;display:flex;justify-content:space-between;gap:20px;border-top:1px solid rgba(255,255,255,.07);color:#687783;font-size:.7rem}
    @media(max-width:760px){.shell{padding:0 13px}.header{min-height:auto;grid-template-columns:1fr auto;gap:15px;padding:15px 0 16px}.logo{width:53px;height:53px}.role{font-size:.64rem}.title{grid-column:1/-1;grid-row:2;padding-top:13px;border-top:1px solid rgba(255,255,255,.06)}.title h1{font-size:1.32rem}.contact strong{font-size:1rem}.stage{padding:26px 0 34px}.card{border-radius:19px}.inside{padding:25px 20px}.hero h2{font-size:2.25rem}.skills{display:grid}.vartable{grid-template-columns:70px 1fr}.vaxis,.varrows{padding:0 15px}.choice{grid-template-columns:30px 1fr auto;padding:11px 12px}.option{font-size:.86rem}.stats{grid-template-columns:1fr}.resultactions{display:grid}.resultactions button{width:100%}.footer{flex-direction:column;text-align:center}}
  
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.22;margin:0 .16em;font-family:Georgia,serif}.frac>span:first-child{border-bottom:1.3px solid currentColor;padding:0 .18em .13em}.frac>span:last-child{padding:.13em .18em 0}.root{display:inline-flex;white-space:nowrap;align-items:baseline}.root>span{border-top:1.2px solid currentColor;padding:0 .07em}.math,.formula{font-family:Georgia,serif}.formula{font-size:1.2em;margin-top:16px;line-height:1.8}.choice{width:100%;text-align:left;color:var(--ink)}.choice:disabled{opacity:1;cursor:default;transform:none}.choice:focus-visible,.btn:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:4px}.option{font-size:1.12rem}.question{font-size:1.55rem}.hint{margin:0 0 18px;border:1px solid #51472f;border-radius:12px;background:#24231d;padding:12px 16px;color:#e7d195}.hint summary{cursor:pointer;font-weight:700;min-height:26px}.hint p{color:#d6d7d4;line-height:1.6;font-size:1rem}.feedback p{font-size:1rem}.trap{border-top:1px solid var(--line);padding-top:8px}.textwater{position:absolute;left:12%;top:48%;transform:rotate(-27deg);font:700 3.5rem Georgia;opacity:.025;pointer-events:none;white-space:nowrap}.contact a{color:inherit;text-decoration:none}.minor{color:var(--muted);font-size:.85rem;line-height:1.55}.spark{display:inline-block;animation:spark .7s ease-out}.feedback.good{box-shadow:0 0 24px #3eb89f20}@keyframes spark{0%{transform:scale(.4);opacity:.2}60%{transform:scale(1.3)}100%{transform:scale(1)}}.review-start{background:var(--gold);color:#181a20}.actions{gap:12px;flex-wrap:wrap}.progresscopy{gap:10px;flex-wrap:wrap}.score strong{font-size:2.7rem}.skills{line-height:1.45}.contact{white-space:nowrap}.question:focus{outline:none}.sharetop{background:transparent;border:1px solid var(--line);color:var(--ink);margin:22px 0 0 8px}.resultactions .btn{margin-top:0}.reviewitem .formula{font-size:1.1rem}.header{margin:0 auto}.footer{margin:0 auto}.stage{width:min(920px,100%)}
@media(max-width:760px){.inside{padding:23px 17px}.name{font-size:1.05rem}.brand{gap:8px}.contact strong{font-size:.95rem}.logo{width:45px;height:45px}.role{font-size:.62rem;max-width:170px}.header{gap:8px}.question{font-size:1.25rem}.option{font-size:1.05rem}.formula{font-size:1.1em;overflow-wrap:anywhere}.choice{padding:14px 10px;min-height:64px}.hero{min-height:470px}.hero h2{font-size:2rem}.skills{display:flex}.sharetop{margin-left:0}.progresscopy{font-size:.78rem}.title h1{font-size:1.3rem}.textwater{font-size:2.5rem}.reviewitem{padding:12px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

const Q=[{"l": "1 · Ensembles de nombres", "q": "Quel est le plus petit ensemble auquel appartient 0 ?", "o": ["ℚ", "ℕ", "𝔻", "ℤ"], "a": 1, "h": "Souviens-toi de la convention utilisée pour le premier entier naturel.", "e": "0 est un entier naturel : le plus petit ensemble proposé est ℕ.", "t": "Un nombre peut appartenir à plusieurs ensembles. On demande ici le plus petit."}, {"l": "1 · Ensembles de nombres", "q": "Quel est le plus petit ensemble auquel appartient ce nombre ?<div class=\"formula\"><span class=\"frac\"><span>−18</span><span>3</span></span></div>", "o": ["ℤ", "𝔻", "ℕ", "ℚ"], "a": 0, "h": "Commence par effectuer la division.", "e": "−18 ÷ 3 = −6. Ce nombre est entier relatif, mais pas naturel : on choisit ℤ.", "t": "Un entier négatif ne devient pas naturel parce qu’il est écrit sous forme de fraction."}, {"l": "1 · Ensembles de nombres", "q": "Quel est le plus petit ensemble auquel appartient ce nombre ?<div class=\"formula\"><span class=\"frac\"><span>7</span><span>20</span></span></div>", "o": ["ℚ", "𝔻", "ℤ", "ℕ"], "a": 1, "h": "Cherche une fraction équivalente de dénominateur 100.", "e": "7/20 = 35/100 = 0,35 : c’est un décimal non entier. Le plus petit ensemble est 𝔻.", "t": "L’écriture fractionnaire ne signifie pas que le nombre est non décimal."}, {"l": "1 · Ensembles de nombres", "q": "Quel est le plus petit ensemble auquel appartient ce nombre ?<div class=\"formula\"><span class=\"frac\"><span>5</span><span>6</span></span></div>", "o": ["𝔻", "ℚ", "ℤ", "ℝ"], "a": 1, "h": "La fraction est irréductible. Regarde les facteurs premiers de son dénominateur.", "e": "5/6 est rationnel, mais non décimal : son dénominateur irréductible contient le facteur 3. On choisit ℚ.", "t": "Une valeur arrondie comme 0,833 ne remplace pas la valeur exacte 5/6."}, {"l": "1 · Ensembles de nombres", "q": "Quelle est la nature de ce nombre ?<div class=\"formula\"><span class=\"root\">√<span>45</span></span></div>", "o": ["Entier naturel", "Rationnel non décimal", "Irrationnel", "Décimal non entier"], "a": 2, "h": "Fais apparaître un carré parfait dans 45.", "e": "√45 = √(9 × 5) = 3√5. Comme √5 est irrationnel, 3√5 l’est aussi.", "t": "La racine carrée d’un entier n’est pas toujours entière."}, {"l": "1 · Ensembles de nombres", "q": "Quel est le plus petit ensemble auquel appartient ce quotient ?<div class=\"formula\"><span class=\"frac\"><span><span class=\"root\">√<span>32</span></span></span><span><span class=\"root\">√<span>2</span></span></span></span></div>", "o": ["ℝ", "𝔻", "ℕ", "ℚ"], "a": 2, "h": "Les deux radicands sont positifs et le dénominateur est non nul : regroupe le quotient sous une racine.", "e": "√32 / √2 = √16 = 4. Le nombre appartient à ℕ.", "t": "Le quotient de deux irrationnels peut être rationnel, et même entier."}, {"l": "2 · Puissances", "q": "Calculer.<div class=\"formula\">−4<sup>2</sup></div>", "o": ["16", "−16", "8", "−8"], "a": 1, "h": "L’exposant porte sur 4 ; aucun signe moins n’est placé dans une parenthèse.", "e": "−4² = −(4 × 4) = −16. En revanche, (−4)² = 16.", "t": "Les parenthèses changent la base de la puissance."}, {"l": "2 · Puissances", "q": "Calculer.<div class=\"formula\">3<sup>−2</sup></div>", "o": ["−6", "<span class=\"frac\"><span>−1</span><span>9</span></span>", "−9", "<span class=\"frac\"><span>1</span><span>9</span></span>"], "a": 3, "h": "Un exposant négatif signifie que l’on prend un inverse.", "e": "3⁻² = 1/3² = 1/9.", "t": "Un exposant négatif ne rend pas automatiquement le nombre négatif."}, {"l": "2 · Puissances", "q": "Écrire sous la forme d’une seule puissance de 2.<div class=\"formula\">2<sup>3</sup> × 2<sup>5</sup></div>", "o": ["4<sup>8</sup>", "2<sup>15</sup>", "2<sup>2</sup>", "2<sup>8</sup>"], "a": 3, "h": "Pour un produit de puissances de même base, on additionne les exposants.", "e": "2³ × 2⁵ = 2³⁺⁵ = 2⁸.", "t": "On ne multiplie pas les exposants dans un produit de puissances."}, {"l": "2 · Puissances", "q": "Simplifier.<div class=\"formula\"><span class=\"frac\"><span>(5<sup>2</sup>)<sup>3</sup></span><span>5<sup>4</sup></span></span></div>", "o": ["5<sup>10</sup>", "5<sup>1</sup>", "5<sup>−2</sup>", "5<sup>2</sup>"], "a": 3, "h": "Traite d’abord la puissance d’une puissance, puis le quotient.", "e": "(5²)³ / 5⁴ = 5⁶ / 5⁴ = 5⁶⁻⁴ = 5².", "t": "Dans (aᵐ)ⁿ, les exposants se multiplient ; dans un quotient, ils se soustraient."}, {"l": "2 · Puissances", "q": "Quelle est l’écriture scientifique du résultat ?<div class=\"formula\"><span class=\"frac\"><span>(3 × 10⁴)(2 × 10⁻⁶)</span><span>4 × 10⁻³</span></span></div>", "o": ["1,5 × 10¹", "1,5 × 10⁻¹", "15 × 10⁰", "1,5 × 10⁻⁵"], "a": 0, "h": "Sépare les coefficients et les puissances de 10. En écriture scientifique, le coefficient est entre 1 inclus et 10 exclu.", "e": "(3 × 2)/4 = 1,5 et 4 − 6 − (−3) = 1. Le résultat s’écrit 1,5 × 10¹.", "t": "15 × 10⁰ a la bonne valeur, mais ce n’est pas une écriture scientifique."}, {"l": "2 · Puissances", "q": "Calculer exactement.<div class=\"formula\">(2<sup>−2</sup>)<sup>3</sup> × 2<sup>4</sup></div>", "o": ["<span class=\"frac\"><span>1</span><span>16</span></span>", "2<sup>10</sup>", "4", "<span class=\"frac\"><span>1</span><span>4</span></span>"], "a": 3, "h": "Multiplie les exposants dans la parenthèse, puis additionne avec 4.", "e": "(2⁻²)³ × 2⁴ = 2⁻⁶ × 2⁴ = 2⁻² = 1/4.", "t": "Le produit (−2) × 3 vaut −6, et non −5."}, {"l": "3 · Racines carrées", "q": "Simplifier au maximum.<div class=\"formula\"><span class=\"root\">√<span>48</span></span></div>", "o": ["4<span class=\"root\">√<span>12</span></span>", "16<span class=\"root\">√<span>3</span></span>", "3<span class=\"root\">√<span>4</span></span>", "4<span class=\"root\">√<span>3</span></span>"], "a": 3, "h": "Décompose 48 en produit d’un carré parfait et d’un autre entier.", "e": "√48 = √(16 × 3) = 4√3.", "t": "Extraire le facteur 16 donne √16 = 4, et non 16."}, {"l": "3 · Racines carrées", "q": "Calculer.<div class=\"formula\"><span class=\"root\">√<span>(−9)<sup>2</sup></span></span></div>", "o": ["81", "−81", "−9", "9"], "a": 3, "h": "Une racine carrée désigne toujours un nombre positif ou nul.", "e": "√((−9)²) = √81 = 9. Plus généralement, √(x²) = |x|.", "t": "Le carré puis la racine ne restituent pas le signe d’un nombre négatif."}, {"l": "3 · Racines carrées", "q": "Réduire cette expression.<div class=\"formula\"><span class=\"root\">√<span>75</span></span> − 2<span class=\"root\">√<span>12</span></span></div>", "o": ["<span class=\"root\">√<span>51</span></span>", "7<span class=\"root\">√<span>3</span></span>", "<span class=\"root\">√<span>3</span></span>", "3<span class=\"root\">√<span>3</span></span>"], "a": 2, "h": "Simplifie chaque racine avant de regrouper les termes.", "e": "√75 − 2√12 = 5√3 − 2 × 2√3 = √3.", "t": "On ne soustrait pas les radicands pour simplifier une différence de racines."}, {"l": "3 · Racines carrées", "q": "Calculer.<div class=\"formula\"><span class=\"root\">√<span>18</span></span> × <span class=\"root\">√<span>8</span></span></div>", "o": ["<span class=\"root\">√<span>26</span></span>", "12", "6", "24"], "a": 1, "h": "Pour deux nombres positifs, le produit des racines est la racine du produit.", "e": "√18 × √8 = √144 = 12.", "t": "La règle concerne un produit ; √18 + √8 n’est pas égal à √26."}, {"l": "3 · Racines carrées", "q": "Pour quelles valeurs réelles de x cette expression est-elle définie ?<div class=\"formula\"><span class=\"root\">√<span>3x − 6</span></span></div>", "o": ["x ≤ 2", "Tout réel x", "x ≥ 2", "x > 2"], "a": 2, "h": "Le nombre situé sous la racine doit être positif ou nul.", "e": "3x − 6 ≥ 0 équivaut à x ≥ 2. L’égalité est admise car √0 existe.", "t": "Il faut inclure x = 2 : la racine peut être nulle."}, {"l": "3 · Racines carrées", "q": "Pour quelles valeurs réelles de x cette expression est-elle définie ?<div class=\"formula\"><span class=\"frac\"><span>1</span><span><span class=\"root\">√<span>7 − x</span></span></span></span></div>", "o": ["x ≤ 7", "x > 7", "x ≠ 7", "x < 7"], "a": 3, "h": "La racine doit exister et le dénominateur ne doit pas être nul.", "e": "Il faut 7 − x > 0, donc x < 7.", "t": "x = 7 est interdit, et x > 7 donne un radicand négatif. La condition x ≠ 7 ne suffit pas."}, {"l": "4 · Conjuguées et développement", "q": "Quelle est l’expression conjuguée de ce nombre ?<div class=\"formula\"><span class=\"root\">√<span>6</span></span> + 2</div>", "o": ["<span class=\"root\">√<span>6</span></span> − 4", "<span class=\"root\">√<span>6</span></span> − 2", "−<span class=\"root\">√<span>6</span></span> − 2", "<span class=\"root\">√<span>6</span></span> + 2"], "a": 1, "h": "Garde les deux termes dans le même ordre et change le signe entre eux.", "e": "La conjuguée de √6 + 2 est √6 − 2. Leur produit est 6 − 4 = 2.", "t": "L’expression opposée −√6 − 2 ne joue pas le même rôle que l’expression conjuguée."}, {"l": "4 · Conjuguées et développement", "q": "Écrire sans racine au dénominateur.<div class=\"formula\"><span class=\"frac\"><span>2</span><span><span class=\"root\">√<span>6</span></span> + 2</span></span></div>", "o": ["<span class=\"root\">√<span>6</span></span> − 2", "<span class=\"root\">√<span>6</span></span> + 2", "<span class=\"frac\"><span><span class=\"root\">√<span>6</span></span> − 2</span><span>2</span></span>", "2<span class=\"root\">√<span>6</span></span> − 4"], "a": 0, "h": "Multiplie en haut et en bas par la conjuguée du dénominateur.", "e": "2/(√6 + 2) = 2(√6 − 2)/(6 − 4) = √6 − 2.", "t": "Il faut multiplier le numérateur aussi, puis simplifier le facteur 2 commun."}, {"l": "4 · Conjuguées et développement", "q": "Écrire sans racine au dénominateur.<div class=\"formula\"><span class=\"frac\"><span>1</span><span>3 − <span class=\"root\">√<span>7</span></span></span></span></div>", "o": ["<span class=\"frac\"><span>3 + <span class=\"root\">√<span>7</span></span></span><span>2</span></span>", "3 + <span class=\"root\">√<span>7</span></span>", "<span class=\"frac\"><span>3 + <span class=\"root\">√<span>7</span></span></span><span>16</span></span>", "<span class=\"frac\"><span>3 − <span class=\"root\">√<span>7</span></span></span><span>2</span></span>"], "a": 0, "h": "La conjuguée est 3 + √7. Le dénominateur devient une différence de carrés.", "e": "1/(3 − √7) = (3 + √7)/(9 − 7) = (3 + √7)/2.", "t": "Le produit des conjuguées donne 9 − 7, et non 9 + 7."}, {"l": "4 · Conjuguées et développement", "q": "Quelle est la forme développée et réduite ?<div class=\"formula\">(2x − 3)<sup>2</sup></div>", "o": ["4x² − 6x + 9", "4x² + 9", "4x² − 12x + 9", "2x² − 12x + 9"], "a": 2, "h": "Dans (a − b)², pense aux deux carrés et au double produit.", "e": "(2x − 3)² = (2x)² − 2 × 2x × 3 + 3² = 4x² − 12x + 9.", "t": "Le terme du milieu est −12x ; il ne faut ni l’oublier ni oublier son facteur 2."}, {"l": "4 · Conjuguées et développement", "q": "Développer et réduire.<div class=\"formula\">(x + <span class=\"root\">√<span>5</span></span>)(x − <span class=\"root\">√<span>5</span></span>)</div>", "o": ["x² − 5", "x² + 5", "x² − 2√5x + 5", "x² − √5"], "a": 0, "h": "Reconnais un produit de deux expressions conjuguées.", "e": "(x + √5)(x − √5) = x² − (√5)² = x² − 5.", "t": "Les deux termes croisés s’annulent ; ce n’est pas le carré d’une différence."}, {"l": "4 · Conjuguées et développement", "q": "Développer et réduire.<div class=\"formula\">2(x − 3) − 3(x + 1)</div>", "o": ["−x − 3", "5x − 9", "−x + 9", "−x − 9"], "a": 3, "h": "Distribue aussi le signe moins : −3 multiplie les deux termes de la seconde parenthèse.", "e": "2x − 6 − 3x − 3 = −x − 9.", "t": "Le dernier terme vaut −3, et non +3."}, {"l": "5 · Factorisation et synthèse", "q": "Quelle factorisation est correcte ?<div class=\"formula\">6x² − 15x</div>", "o": ["3(2x − 5)", "3x(2x − 5)", "x(6x + 15)", "3x(2x − 15)"], "a": 1, "h": "Cherche un facteur commun aux coefficients et aux puissances de x.", "e": "6x² − 15x = 3x × 2x − 3x × 5 = 3x(2x − 5).", "t": "Développer le produit proposé permet de vérifier la factorisation."}, {"l": "5 · Factorisation et synthèse", "q": "Factoriser.<div class=\"formula\">x² − 8x + 16</div>", "o": ["(x − 4)(x + 4)", "(x + 4)²", "(x − 8)²", "(x − 4)²"], "a": 3, "h": "Vérifie si le terme du milieu est un double produit.", "e": "x² − 8x + 16 = x² − 2 × x × 4 + 4² = (x − 4)².", "t": "(x − 4)(x + 4) donne x² − 16 : il manque alors le terme en x."}, {"l": "5 · Factorisation et synthèse", "q": "Factoriser sans développer tous les produits.<div class=\"formula\">(x + 2)(3x − 1) − (x + 2)(x + 4)</div>", "o": ["(x + 2)(2x + 3)", "(x + 2)(2x − 5)", "(x + 2)(4x + 3)", "(x + 2)(3x − 5)"], "a": 1, "h": "Extrais la parenthèse commune, puis enlève correctement la seconde parenthèse.", "e": "On obtient (x + 2)[(3x − 1) − (x + 4)] = (x + 2)(2x − 5).", "t": "Le signe moins transforme +(x + 4) en −x − 4."}, {"l": "5 · Factorisation et synthèse", "q": "Quel est l’ensemble des solutions réelles de cette équation ?<div class=\"formula\">(2x + 1)<sup>2</sup> − (x − 2)<sup>2</sup> = 0</div>", "o": ["{3 ; −<span class=\"frac\"><span>1</span><span>3</span></span>}", "{−3 ; <span class=\"frac\"><span>1</span><span>3</span></span>}", "{<span class=\"frac\"><span>1</span><span>3</span></span>}", "{−3}"], "a": 1, "h": "Factorise la différence de deux carrés, puis utilise la règle du produit nul.", "e": "[(2x + 1) − (x − 2)][(2x + 1) + (x − 2)] = (x + 3)(3x − 1). Les solutions sont −3 et 1/3.", "t": "Les deux facteurs peuvent s’annuler : il faut donner les deux solutions."}, {"l": "5 · Factorisation et synthèse", "q": "Un rectangle a les dimensions ci-dessous, en cm. Quelle est son aire exacte ?<div class=\"formula\"><span class=\"root\">√<span>27</span></span> + <span class=\"root\">√<span>3</span></span> &nbsp; et &nbsp; <span class=\"root\">√<span>27</span></span> − <span class=\"root\">√<span>3</span></span></div>", "o": ["6 cm²", "24 cm²", "12√3 cm²", "30 cm²"], "a": 1, "h": "Multiplie les deux dimensions en reconnaissant une différence de carrés.", "e": "L’aire vaut (√27 + √3)(√27 − √3) = 27 − 3 = 24 cm². Les dimensions sont positives car √27 > √3.", "t": "Une aire est un produit de longueurs ; elle ne se calcule pas avec leur somme."}, {"l": "5 · Factorisation et synthèse", "q": "Après simplification, quel est le plus petit ensemble contenant ce nombre ?<div class=\"formula\"><span class=\"frac\"><span>1</span><span><span class=\"root\">√<span>3</span></span> − 1</span></span> − <span class=\"frac\"><span>1</span><span><span class=\"root\">√<span>3</span></span> + 1</span></span></div>", "o": ["ℚ", "ℕ", "𝔻", "ℝ"], "a": 1, "h": "Mets les fractions au même dénominateur et utilise le produit de deux conjuguées.", "e": "Le numérateur est (√3 + 1) − (√3 − 1) = 2. Le dénominateur vaut 3 − 1 = 2. Le résultat est 1, donc le plus petit ensemble est ℕ.", "t": "Des expressions contenant des irrationnels peuvent se simplifier en un entier naturel."}];

function start(){cursor=0;order=Q.map((_,i)=>i);review=false;selected=null;checked=false;hintOpen=false;render(true)}
function render(focus=false){const n=order[cursor],q=Q[n],answered=answers.filter(a=>a!==null).length,pct=100*(cursor+(checked?1:0))/order.length;
app.innerHTML=`<div class="progressline"><div class="progresscopy"><span>${review?'Révision · ':''}Question ${cursor+1} sur ${order.length}</span><strong>Score ${review?'initial ':''}: ${good()} / ${review?30:answered}${review?' · '+display(grade())+'/20':''}</strong></div><div class="bar" role="progressbar" aria-label="Progression" aria-valuemin="0" aria-valuemax="${order.length}" aria-valuenow="${cursor+(checked?1:0)}"><i style="width:${pct}%"></i></div></div><div class="card"><img class="watermark" src="${logo}" alt=""><div class="textwater" aria-hidden="true">Faicel Missaoui</div><div class="inside"><span class="badge level">${q.l}</span><h2 class="question" id="question" tabindex="-1">${q.q}</h2><details class="hint" ${hintOpen?'open':''} ontoggle="hintOpen=this.open"><summary>✧ Coup de pouce</summary><p>${q.h}</p></details><div class="answers" role="group" aria-labelledby="question">${q.o.map((o,j)=>`<button class="choice ${checked&&j===q.a?'correct':''} ${checked&&j===selected&&j!==q.a?'wrong':''}" ${checked?'disabled':''} onclick="choose(${j})"><span class="letter">${L[j]}</span><span class="option">${o}</span><span class="mark">${checked&&j===q.a?'✓':checked&&j===selected?'✕':''}</span></button>`).join('')}</div><div aria-live="polite">${checked?`<div class="feedback ${selected===q.a?'good':'bad'}"><strong>${selected===q.a?'<span class="spark">✦</span> '+['Bravo !','Très bien !','Bien joué !','Excellent !'][n%4]:'À revoir · Tu peux progresser !'}</strong><p><b>Bonne réponse : ${L[q.a]}.</b> ${q.o[q.a]}</p><p>${q.e}</p><p class="trap"><b>Le piège à éviter.</b> ${q.t}</p></div>`:''}</div><div class="actions">${checked?`<button class="btn primary" onclick="next()">${cursor===order.length-1?(review?'Retour au bilan':'Voir mon bilan'):'Question suivante'} →</button>`:'<p class="minor">Choisis A, B, C ou D pour valider ta réponse.</p>'}</div></div></div>`;
if(focus){document.getElementById('question').focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'})}}
function choose(j){if(checked||!Number.isInteger(j)||j<0||j>3)return;selected=j;checked=true;const n=order[cursor];if(review)reviewAnswers[n]=j;else answers[n]=j;render();}
function next(){if(!checked)return;if(cursor===order.length-1){result();return}cursor++;selected=null;checked=false;hintOpen=false;render(true)}
function result(){const mistakes=Q.map((q,n)=>({q,n,c:answers[n]})).filter(x=>x.c!==x.q.a),score=grade();const msg=score>=18?'Excellent travail : les méthodes sont solides.':score>=14?'Très bien ! Quelques points restent à consolider.':score>=10?'Tu progresses. Reprends les corrections pour consolider tes méthodes.':'Chaque erreur est une piste pour progresser. Reprends les questions avec leur coup de pouce.';
app.innerHTML=`<div class="card"><div class="inside result"><span class="badge">✓ Bilan du QFM</span><div class="score"><strong>${display(score)}</strong><span>/20</span></div><h2>Parcours terminé !</h2><p class="resultlead">${msg}</p><div class="stats"><div><strong>${good()} / 30</strong><span>bonnes réponses</span></div><div><strong>${mistakes.length}</strong><span>questions à revoir</span></div><div><strong>${Math.round(good()/30*100)} %</strong><span>de réussite</span></div></div><p class="minor">Note = bonnes réponses × 20 ÷ 30, arrondie au centième.<br>La révision des erreurs conserve cette note initiale.</p><div class="resultactions">${mistakes.length?'<button class="btn review-start" onclick="reviewErrors()">Revoir uniquement mes erreurs →</button>':''}<button class="btn restart" onclick="restart()">↻ Recommencer</button><button class="btn whatsapp" onclick="share()">Partager sur WhatsApp</button></div>${mistakes.length?`<details class="review" style="margin-top:28px"><summary>Afficher les corrections de mes ${mistakes.length} erreurs</summary>${mistakes.map(x=>`<article class="reviewitem"><b>Question ${x.n+1}</b><p>${x.q.q}</p><p class="wrongtext">Ta réponse : ${x.c===null?'Aucune':x.q.o[x.c]}</p><p class="righttext">Bonne réponse : ${x.q.o[x.q.a]}</p><p class="explain">${x.q.e}</p><p class="explain">${x.q.t}</p></article>`).join('')}</details>`:'<p class="feedback good">✦ Sans faute : bravo pour ce parcours !</p>'}</div></div>`;window.scrollTo({top:0,behavior:'instant'})}
function reviewErrors(){order=Q.map((_,i)=>i).filter(i=>answers[i]!==Q[i].a);if(!order.length)return;review=true;reviewAnswers={};cursor=0;selected=null;checked=false;hintOpen=false;render(true)}
function restart(){answers=Array(Q.length).fill(null);review=false;reviewAnswers={};order=Q.map((_,i)=>i);cursor=0;selected=null;checked=false;hintOpen=false;startScreen();window.scrollTo({top:0,behavior:'instant'})}
startScreen();

</script></body></html>
