<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Espace élève</title><link rel="stylesheet" href="css/style.css"></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-icon">M</span><span>Missaoui Maths</span></a><nav class="nav"><a href="index.html">Accueil</a><a href="3eme-ch7-statistiques.html">Cours statistiques</a></nav></header>
<div id="auth-view" class="auth-wrap"><div class="auth-card"><h1>🎓 Espace élève</h1><p class="small">Connexion avec email et mot de passe.</p><label>Email</label><input id="email" type="email"><label>Mot de passe</label><input id="password" type="password"><label>Nom complet</label><input id="name" type="text"><button class="btn-3d btn-red" id="loginBtn">Se connecter</button><button class="btn-3d" id="registerBtn" style="margin-top:10px">Créer un compte</button><div id="msg" class="notice" style="display:none"></div></div></div>
<div id="dash-view" class="dash" style="display:none"><div class="dash-head"><div><h1>👋 Bonjour <span id="student-name"></span></h1><p>Progression du chapitre Statistiques 3ème</p></div><button class="btn-3d" id="logoutBtn">Déconnexion</button></div><div class="stat-grid"><div class="stat"><b id="best-score">0%</b><br><span>Meilleur score</span></div><div class="stat"><b id="attempts">0</b><br><span>Tentatives</span></div><div class="stat"><b id="chapter-status">—</b><br><span>Chapitre</span></div></div><div class="chart"><h2>📊 Graphique de progression</h2><div class="chart-bars" id="chart"></div><div class="chart-label">Chaque barre représente une tentative du quiz.</div></div><a class="btn-3d btn-red" href="3eme-ch7-statistiques.html">Continuer le cours</a></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.1/firebase-app.js";import { getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged,updateProfile } from "https://www.gstatic.com/firebasejs/10.12.1/firebase-auth.js";import { getFirestore,doc,setDoc,getDoc } from "https://www.gstatic.com/firebasejs/10.12.1/firebase-firestore.js";import { firebaseConfig } from "./js/firebase-config.js";const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);const msg=document.getElementById("msg");function show(t,e=false){msg.style.display="block";msg.className="notice "+(e?"error":"ok");msg.textContent=t;}async function ensureUserDoc(user,name){await setDoc(doc(db,"users",user.uid),{email:user.email,name:name||user.displayName||user.email,role:"student",updatedAt:new Date().toISOString()},{merge:true});}
registerBtn.onclick=async()=>{try{const email=document.getElementById("email").value.trim(),pass=document.getElementById("password").value,name=document.getElementById("name").value.trim();const cred=await createUserWithEmailAndPassword(auth,email,pass);if(name)await updateProfile(cred.user,{displayName:name});await ensureUserDoc(cred.user,name);show("Compte créé.");}catch(e){show(e.message,true);}};
loginBtn.onclick=async()=>{try{const cred=await signInWithEmailAndPassword(auth,email.value.trim(),password.value);await ensureUserDoc(cred.user,name.value.trim());}catch(e){show(e.message,true);}};logoutBtn.onclick=()=>signOut(auth);
onAuthStateChanged(auth,async user=>{document.getElementById("auth-view").style.display=user?"none":"flex";document.getElementById("dash-view").style.display=user?"block":"none";if(!user)return;document.getElementById("student-name").textContent=user.displayName||user.email;const snap=await getDoc(doc(db,"users",user.uid,"progress","3eme-ch7-statistiques"));const data=snap.exists()?snap.data():{};const hist=data.history||[];const best=data.bestPercent||0;document.getElementById("best-score").textContent=best+"%";document.getElementById("attempts").textContent=hist.length;document.getElementById("chapter-status").textContent=best>=70?"Validé":"À revoir";const chart=document.getElementById("chart");chart.innerHTML="";(hist.length?hist:[{percent:0}]).slice(-8).forEach(h=>{const b=document.createElement("div");b.className="chart-bar";b.style.height=Math.max(4,h.percent||0)+"%";b.textContent=(h.percent||0)+"%";chart.appendChild(b);});});
</script></body></html>
