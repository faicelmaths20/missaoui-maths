<head>
<meta charset="utf-8">

<meta property="og:title" content="Division euclidienne · 30 automatismes de 6e">

<title>Division euclidienne · 6e · Faicel Missaoui</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:light;--ink:#142f51;--dim:#425876;--blue:#204d82;--line:#c3d1dc;--sky:#eef4f8;--gold:#ffcc68;--paper:#fff;--teal:#0b6451}
body{margin:0;background:#f2f6f9;color:var(--ink);font:1.0625rem/1.45 "Aptos","Inter",system-ui,-apple-system,"Segoe UI",sans-serif}
body:has(dialog[open]){overflow:hidden}
[hidden]{display:none!important}
button,input,select{font:inherit}
button,select{cursor:pointer}
button{color:var(--ink);font-weight:680;border:1px solid var(--line);border-radius:12px;background:white;padding:.6rem 1rem;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:.6rem}
button:hover{border-color:#597493;background:#edf4fa}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid #cb7404;outline-offset:3px}
svg.icon{width:1.23em;height:1.23em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{width:min(1216px,calc(100% - clamp(28px,7vw,112px)));margin:auto}
.mast{background:white;border-bottom:1px solid var(--line)}
.mast .wrap{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.6rem 0}
.logo{display:block;width:clamp(255px,32vw,414px);height:auto;max-width:100%}
.signature{text-align:right;font-weight:750;font-size:1.08rem;line-height:1.25}
.signature small{display:block;font-weight:500;color:var(--dim);font-size:.9rem;margin-top:.18rem}
main{padding:clamp(1rem,2.6vh,2rem) 0 1.75rem}
.topline,.ribbon,.controlrow,.pager,.practicebar,.topbtns,.stepbuttons,.actbuttons,.dialogtitle{display:flex;align-items:center;gap:.65rem}
.topline,.ribbon,.controlrow,.practicebar,.dialogtitle{justify-content:space-between}
.kicker,.boardlabel,.stage,.panelname,.eyebrow{font-size:.875rem;font-weight:780;letter-spacing:.095em;text-transform:uppercase}
.kicker,.eyebrow{color:#3e5a7d}
h1{font-size:clamp(1.85rem,3.5vw,3.3rem);line-height:1.05;margin:.2rem 0 .1rem;letter-spacing:-.05em;font-weight:770}
.topbtns{flex-wrap:wrap;justify-content:flex-end}
.progress{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:clamp(.9rem,2vh,1.5rem) 0 .8rem}
.track{height:6px;overflow:hidden;background:#d5e0e9;border-radius:8px}
.track i{height:100%;display:block;background:var(--blue);border-radius:inherit}
.card{border-radius:22px;overflow:hidden;background:white;border:1px solid #bfccd7;box-shadow:0 7px 18px #172c4610}
.board{background:linear-gradient(113deg,#142f51 0%,#1b3d66 74%,#214a78 100%);color:white;padding:clamp(1.25rem,3vw,2.5rem)}
.ribbon{justify-content:flex-start;gap:.85rem;flex-wrap:wrap}
.num{font-size:1rem;font-weight:760;letter-spacing:.015em;background:#fff;color:var(--ink);border-radius:7px;padding:.28rem .7rem}
.stage{color:#ffdb95;letter-spacing:.06em}
.boardbody{display:grid;align-items:center;grid-template-columns:minmax(0,1.68fr) minmax(0,1fr);gap:clamp(1rem,3.1vw,3rem);min-height:clamp(206px,30vh,310px);padding-top:1rem}
.given{color:#eff5ff;font-size:clamp(1.3rem,2.05vw,1.95rem);line-height:1.35;margin:0 0 .62rem;max-width:39em}
h2{font-size:clamp(1.95rem,3.3vw,3.35rem);line-height:1.13;letter-spacing:-.028em;margin:0;font-weight:720;text-wrap:pretty}
h2:focus{outline:none}
.visual{align-self:stretch;display:flex;align-items:center;justify-content:center;flex-direction:column;min-height:155px;border:1px solid #7891aa;border-radius:15px;overflow:hidden;background-color:#123153;background-image:linear-gradient(#829ebb1c 1px,transparent 1px),linear-gradient(90deg,#829ebb1c 1px,transparent 1px);background-size:22px 22px;padding:1rem .75rem}
.boardlabel{color:#dae9fa;text-align:center;letter-spacing:.1em;margin:0 0 .8rem}
.sketch{text-align:center;font-weight:740;font-variant-numeric:tabular-nums;line-height:1.3;color:var(--gold);font-size:clamp(1.4rem,2.8vw,2.65rem);max-width:100%}
.sketch.math{font-size:clamp(1.3rem,2.35vw,2.3rem);line-height:1.5}
.facts div+div{color:white;font-size:.79em;margin-top:2px;font-weight:620}
.counters{display:grid;grid-template-columns:repeat(7,1fr);gap:clamp(5px,1vw,14px);justify-content:center;padding:.25rem}
.counter{width:clamp(17px,2vw,32px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 32% 30%,#fff2bf 0,#ffcf68 31%,#edac40 88%);border:1px solid #ffde92;box-shadow:0 3px 0 #9a662d}
.potence{display:grid;grid-template-columns:1.25fr 1fr;width:max-content;min-width:130px;text-align:center;font:700 clamp(1.7rem,3vw,3rem)/1.08 "Aptos","Inter",system-ui,sans-serif}
.potence span{padding:.04em .36em .1em}
.potence span:nth-child(even){border-left:3px solid #eef6ff}
.potence span:nth-child(4){border-top:3px solid #eef6ff}
.potence span:nth-child(n+3){color:#e9f3ff}
.controlrow{padding:1rem clamp(1rem,2.8vw,2.4rem);gap:1rem;flex-wrap:wrap}
.primary{background:var(--ink);color:white;border-color:var(--ink)}
.primary:hover{background:#254e7c;color:white}
.hintbtn{background:#fff6df;border-color:#dbb664;color:#664812}
.hintbtn:hover,.hintbtn[aria-expanded=true]{background:#ffebbc;border-color:#ae8537}
.fillblue,.fillblue:hover{background:#e2edf9;border-color:#6482a3}
.pager{gap:.5rem}
.panel{margin:0 clamp(1rem,2.8vw,2.4rem) 1rem;padding:.85rem 1.15rem;border-left:5px solid #ae7d19;background:#fff5d9;border-radius:0 10px 10px 0;color:#4c360e}
.panel.answer{background:#e4f5ef;color:#0e4639;border-left-color:var(--teal)}
.panel p{margin:.2rem 0 0;font-size:clamp(1.2rem,2vw,1.85rem);line-height:1.35}
.panel strong{font-size:clamp(1.45rem,2.4vw,2.15rem)}
.practice{margin-top:.9rem}
.practicebar{color:var(--dim);flex-wrap:wrap;gap:.6rem}
.linkbtn{border-color:transparent;background:transparent;color:var(--blue);padding:.42rem .1rem;min-height:44px}
.linkbtn:hover{background:transparent;border-color:transparent;text-decoration:underline}
.shortcuts{font-size:.9rem}
form{margin:.45rem 0;padding:1rem;border:1px solid var(--line);border-radius:12px;background:white}
.fields{display:flex;gap:.8rem;align-items:end;flex-wrap:wrap}
label{display:flex;flex-direction:column;gap:.25rem;font-size:1rem;font-weight:640}
input,select{border:1px solid #839ab0;background:white;color:var(--ink);border-radius:8px;padding:.45rem .6rem;max-width:100%;min-height:45px;min-width:6rem}
input{width:8rem}
#feedback{margin:.5rem 0 0;font-weight:720;color:var(--blue)}
dialog{border:1px solid #9aaec1;border-radius:18px;background:#fff;color:var(--ink);padding:1.3rem;width:min(530px,calc(100% - 28px));max-height:85vh;overflow:auto;box-shadow:0 20px 55px #10264045}
dialog::backdrop{background:#10243bc4}
.dialogtitle{position:sticky;top:-1.3rem;background:white;z-index:1;padding:.35rem 0 .5rem}
h3{font-size:1.5rem;letter-spacing:-.025em;line-height:1.2;margin:.24rem 0}
.jumprow{border-top:1px solid var(--line);padding:.65rem 0}
.jumprow p{margin:0 0 .4rem;font-weight:650}
.jumprow div{display:grid;grid-template-columns:repeat(6,1fr);gap:.35rem}
.jumprow button{padding:.3rem}
.jumprow button[aria-current=step]{background:var(--ink);color:white}
#finish{padding:2rem;background:white;border:1px solid var(--line);border-radius:18px}
#finish p{font-size:1.22rem}
#finish button{margin:.2rem .4rem .2rem 0}
.presentation .shortcuts{display:none}.presentation .mast .logo{width:min(330px,90vw)}.presentation .mast .wrap{padding:.25rem 0}
.presentation main{padding-top:.75rem}
.presentation .wrap{width:min(1500px,96%)}
.presentation .boardbody{min-height:clamp(240px,40vh,510px)}
.presentation .given{font-size:clamp(1.4rem,2.65vw,2.75rem)}
.presentation h2{font-size:clamp(2.2rem,4.15vw,4.6rem)}
.presentation .panel p{font-size:clamp(1.45rem,2.3vw,2.45rem)}
@media(max-width:760px){.signature{font-size:1rem}.signature small{font-size:.82rem}.topline{align-items:end}.topbtns button{padding:.5rem .65rem}.shortcuts{display:none}.boardbody{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}.controlrow{padding:.85rem}.actbuttons,.pager{gap:.4rem}.controlrow button{padding:.5rem .75rem}}
@media(max-width:600px){.wrap{width:calc(100% - 24px)}.mast .wrap{flex-direction:column;align-items:flex-start;gap:3px;padding:.45rem 0}.logo{width:min(100%,360px);align-self:center}.signature{text-align:center;align-self:center;font-size:.9rem}.signature small{display:none}main{padding-top:.9rem}.topline{flex-wrap:wrap;gap:.5rem}.topbtns{justify-content:flex-start}.topbtns button{min-height:44px;padding:.35rem .6rem;font-size:.94rem}.kicker{font-size:.78rem}.board{padding:1rem}.boardbody{display:flex;flex-direction:column;align-items:stretch;gap:.95rem;min-height:0}.ribbon{gap:.5rem}.stage,.boardlabel{font-size:.78rem}.stage{letter-spacing:.025em}.num{font-size:.88rem}.given{font-size:1.27rem}.visual{min-height:96px;padding:.65rem}.boardlabel{margin-bottom:.35rem}.sketch{font-size:1.55rem}.sketch.math{font-size:1.65rem}.counters{gap:7px}.counter{width:19px}.potence{min-width:95px;font-size:1.5rem}.controlrow{display:grid;gap:.65rem}.actbuttons,.pager{display:grid;grid-template-columns:1fr 1fr}.controlrow button{font-size:.94rem;padding:.45rem .25rem;gap:.3rem}.card{border-radius:15px}.progress{margin:.7rem 0}.presentation .boardbody{min-height:0}.panel{margin:0 .85rem .9rem}.practice{margin-top:.35rem}.jumprow{font-size:1rem}}
@media(max-height:680px) and (min-width:761px){.mast .logo{width:280px}.mast .wrap{padding:.24rem 0}main{padding:.65rem 0}.board{padding:1.15rem 1.55rem}.boardbody{min-height:158px}.progress{margin:.6rem 0}.controlrow{padding:.65rem 1.5rem}.presentation .boardbody{min-height:195px}}
</style>
</head>

<script>
const stages = [

  "Calculer de tête",
  "Compléter une division",
  "Interpréter le reste",
  "Relever les défis"
];

function field(label, value, options) {
  return {label, value: String(value), options};
}
function pair(q, r) {
  return [field("Quotient", q), field("Reste", r)];
}
function slate(title, lines, style = "facts") {
  return {title, lines, style};
}
function division(a, b) {
  return slate("Division à compléter", [a, b], "division");
}
function question(given, ask, board, fields, hint, answer, why) {
  return {given, ask, board, fields, hint, answer, why};
}
const questions = [
  question("On partage équitablement 14 jetons entre 3 élèves.",
    "Combien de jetons entiers chaque élève reçoit-il au maximum ?",
    slate("Jetons à partager", [14], "tokens"), [field("Jetons par élève", 4)],
    "Imagine que tu donnes un jeton à chacun, puis que tu recommences. Chaque tour utilise 3 jetons.",
    "4 jetons par élève.", "14 = 3 × 4 + 2. Il reste 2 jetons, trop peu pour faire un tour de plus."),
  question("On range 23 cubes dans des sachets de 5. On remplit le plus de sachets possible.",
    "Combien de cubes restent en dehors des sachets ?",
    slate("Le rangement", ["23 cubes", "5 par sachet"]), [field("Cubes restants", 3)],
    "Compte de 5 en 5. Arrête-toi juste avant de dépasser 23.",
    "3 cubes restent.", "23 = 5 × 4 + 3. Les 4 sachets pleins contiennent 20 cubes."),
  question("Il y a 24 élèves. On forme des équipes de 6.",
    "Combien d’équipes complètes peut-on former ?",
    slate("Les équipes", ["24 élèves", "6 par équipe"]), [field("Équipes", 4)],
    "Cherche par quel nombre multiplier 6 pour obtenir 24.",
    "4 équipes.", "24 = 6 × 4 + 0. Tous les élèves ont une équipe."),
  question("On effectue la division euclidienne de 38 par 5.",
    "Lis l’égalité. Quel est le quotient ?",
    slate("L’égalité", ["38 = 5 × 7 + 3"], "math"), [field("Quotient", 7)],
    "Le quotient indique combien de groupes complets de 5 on peut former.",
    "Le quotient est 7.", "38 contient 7 groupes complets de 5. Le reste est 3, et 3 < 5."),
  question("On effectue la division euclidienne de 47 par 6.",
    "Comment appelle-t-on le nombre 47 ?",
    division(47, 6), [field("Nom du nombre 47", "dividende", ["diviseur", "quotient", "dividende", "reste"])],
    "Repère le nombre que l’on partage. Le nombre de parts joue un autre rôle.",
    "47 est le dividende.", "Le dividende est le nombre à diviser. Ici, 6 est le diviseur."),
  question("Dans une division euclidienne, le diviseur est 8.",
    "Quel est le plus grand reste possible ?",
    slate("Le diviseur", ["8"], "math"), [field("Plus grand reste", 7)],
    "Avec 8 unités restantes, on pourrait encore former un groupe. Quel entier vient juste avant 8 ?",
    "Le plus grand reste est 7.", "Les restes possibles sont 0, 1, 2, 3, 4, 5, 6 et 7."),
  question("Effectue la division euclidienne de 34 par 4.", "Quels sont le quotient et le reste ?",
    division(34, 4), pair(8, 2), "Cherche le plus grand multiple de 4 inférieur ou égal à 34.",
    "Quotient 8 · Reste 2", "4 × 8 = 32 et 34 − 32 = 2. Donc 34 = 4 × 8 + 2."),
  question("Effectue la division euclidienne de 48 par 6.", "Quels sont le quotient et le reste ?",
    division(48, 6), pair(8, 0), "48 figure dans la table de 6. Que reste-t-il lorsque tout est partagé ?",
    "Quotient 8 · Reste 0", "48 = 6 × 8 + 0. La division est exacte."),
  question("Effectue la division euclidienne de 59 par 7.", "Quels sont le quotient et le reste ?",
    division(59, 7), pair(8, 3), "7 × 9 dépasse 59. Essaie avec un groupe de moins.",
    "Quotient 8 · Reste 3", "7 × 8 = 56 et 59 − 56 = 3. Donc 59 = 7 × 8 + 3."),
  question("On veut former des groupes de 12 avec seulement 9 jetons.",
    "Dans la division de 9 par 12, quels sont le quotient et le reste ?",
    division(9, 12), pair(0, 9), "Peux-tu former un seul groupe complet de 12 jetons ?",
    "Quotient 0 · Reste 9", "9 = 12 × 0 + 9. Les 9 jetons restent, et 9 < 12."),
  question("Effectue la division euclidienne de 76 par 10.", "Quels sont le quotient et le reste ?",
    division(76, 10), pair(7, 6), "Décompose 76 en dizaines entières et en unités restantes.",
    "Quotient 7 · Reste 6", "76 = 10 × 7 + 6. On compte 7 dizaines et 6 unités."),
  question("Effectue la division euclidienne de 96 par 9.", "Quels sont le quotient et le reste ?",
    division(96, 9), pair(10, 6), "Prends d’abord 10 groupes de 9. Que manque-t-il pour atteindre 96 ?",
    "Quotient 10 · Reste 6", "96 = 9 × 10 + 6 et 6 < 9."),
  question("Dans la division de 95 par 8, le reste est 7.", "Quel nombre manque dans l’égalité ?",
    slate("L’égalité à compléter", ["95 = 8 × □ + 7"], "math"), [field("Quotient", 11)],
    "Enlève le reste à 95. Cherche ensuite combien de groupes de 8 tu obtiens.",
    "Le quotient est 11.", "95 − 7 = 88 et 88 = 8 × 11. Ainsi, 95 = 8 × 11 + 7."),
  question("Le diviseur est 12, le quotient est 9 et le reste est 5.", "Retrouve le dividende.",
    slate("L’égalité à compléter", ["□ = 12 × 9 + 5"], "math"), [field("Dividende", 113)],
    "Calcule d’abord le nombre d’unités dans les 9 groupes, puis ajoute les unités restantes.",
    "Le dividende est 113.", "12 × 9 = 108, puis 108 + 5 = 113. Le reste 5 est inférieur à 12."),
  question("Le dividende est 143, le quotient est 11 et le reste est nul.", "Quel est le diviseur ?",
    slate("L’égalité à compléter", ["143 = □ × 11"], "math"), [field("Diviseur", 13)],
    "11 × 10 = 110. Combien de fois 11 faut-il encore ajouter pour arriver à 143 ?",
    "Le diviseur est 13.", "143 = 13 × 11 + 0. On vérifie que 11 × 10 + 11 × 3 = 143."),
  question("Effectue la division euclidienne de 167 par 12.", "Quels sont le quotient et le reste ?",
    division(167, 12), pair(13, 11), "12 × 14 = 168. Si tu retires un groupe de 12, combien te manque-t-il pour atteindre 167 ?",
    "Quotient 13 · Reste 11", "167 = 12 × 13 + 11. Avec un groupe de plus, on atteindrait 168."),
  question("Effectue la division euclidienne de 156 par 15.", "Quels sont le quotient et le reste ?",
    division(156, 15), pair(10, 6), "Commence par 10 groupes de 15 et compare leur total à 156.",
    "Quotient 10 · Reste 6", "156 = 15 × 10 + 6. Les 6 unités restantes ne forment pas un groupe de 15."),
  question("Pose ou effectue de tête la division de 427 par 4.", "Quels sont le quotient et le reste ?",
    division(427, 4), pair(106, 3), "Décompose 427 en 400 + 27. Combien de groupes de 4 obtiens-tu avec chaque partie ?",
    "Quotient 106 · Reste 3", "400 = 4 × 100 et 27 = 4 × 6 + 3. On obtient 427 = 4 × 106 + 3."),
  question("Un album contient 8 cartes par page. Inès y range ses 58 cartes, page après page.",
    "Combien de pages remplit-elle entièrement ?",
    slate("L’album", ["58 cartes", "8 par page"]), [field("Pages pleines", 7)],
    "Cherche combien de paquets complets de 8 cartes tu peux faire.",
    "7 pages pleines.", "58 = 8 × 7 + 2. Sept pages contiennent 56 cartes et il reste 2 cartes."),
  question("Inès range toujours ses 58 cartes, avec 8 places par page.", "Combien de pages lui faut-il au minimum pour tout ranger ?",
    slate("Le même album", ["58 cartes", "8 par page"]), [field("Pages nécessaires", 8)],
    "Sept pages offrent 56 places. Où ranger les cartes qui restent ?",
    "Il lui faut 8 pages.", "58 = 8 × 7 + 2. Il faut 7 pages pleines et une huitième pour les 2 dernières cartes."),
  question("On partage 74 caramels entre 9 enfants. Chacun en reçoit autant et le plus possible.", "Combien de caramels restent à partager ?",
    slate("Le partage", ["74 caramels", "9 enfants"]), [field("Caramels restants", 2)],
    "Calcule d’abord le total distribué si chaque enfant reçoit 8 caramels.",
    "Il reste 2 caramels.", "74 = 9 × 8 + 2. Les enfants reçoivent 72 caramels en tout."),
  question("On veut ranger 54 balles dans des boîtes de 9.", "Combien de boîtes faut-il au minimum ?",
    slate("Le rangement", ["54 balles", "9 par boîte"]), [field("Boîtes nécessaires", 6)],
    "54 est-il un multiple de 9 ? Vérifie s’il reste une balle après avoir rempli les boîtes.",
    "6 boîtes suffisent.", "54 = 9 × 6 + 0. Les 6 boîtes sont pleines et toutes les balles sont rangées."),
  question("On dispose 85 chaises par rangées de 6 et on remplit chaque rangée avant de commencer la suivante.",
    "Combien de chaises faut-il ajouter pour compléter la dernière rangée ?",
    slate("La salle", ["85 chaises", "6 par rangée"]), [field("Chaises à ajouter", 5)],
    "Combien de chaises sont déjà dans la dernière rangée ? Combien lui en manque-t-il pour en avoir 6 ?",
    "Il faut ajouter 5 chaises.", "85 = 6 × 14 + 1. La dernière rangée contient 1 chaise et il en manque 6 − 1 = 5."),
  question("On range 135 plants sur des plateaux de 12. On remplit chaque plateau avant de passer au suivant.",
    "Combien de plants met-on sur le dernier plateau ?",
    slate("La serre", ["135 plants", "12 par plateau"]), [field("Plants sur le dernier plateau", 3)],
    "Commence par remplir 10 plateaux. Peux-tu en remplir encore un avec les plants restants ?",
    "3 plants.", "135 = 12 × 11 + 3. Après les 11 plateaux pleins, le douzième reçoit 3 plants."),
  question("Nora écrit 86 = 7 × 11 + 9 pour diviser 86 par 7.",
    "L’égalité est vraie. Corrige le quotient et le reste.",
    slate("La proposition de Nora", ["86 = 7 × 11 + 9"], "math"), pair(12, 2),
    "Compare 9 au diviseur 7. Peux-tu former un groupe de plus avec les 9 unités restantes ?",
    "Quotient 12 · Reste 2", "Le reste doit être inférieur à 7. Or 9 = 7 + 2, donc 86 = 7 × 12 + 2."),
  question("Avec 119 perles, on fait 9 colliers de 12 perles et il reste 11 perles. On ajoute une perle.",

    slate("Avant l’ajout", ["119 = 12 × 9 + 11"], "math"), pair(10, 0),
    "Ajoute la perle aux 11 qui restent. Que peux-tu fabriquer maintenant ?",
    "Quotient 10 · Reste 0", "Les 12 perles permettent un collier de plus. Ainsi, 120 = 12 × 10 + 0."),
  question("Une division euclidienne a pour diviseur 9 et pour quotient 7.", "Quel est le plus grand dividende possible ?",
    slate("Le dividende cherché", ["9 × 7 + reste"], "math"), [field("Plus grand dividende", 71)],
    "Garde les 7 groupes de 9. Quel est le plus grand reste autorisé quand on divise par 9 ?",
    "Le plus grand dividende est 71.", "Le reste maximal est 8. On calcule 9 × 7 + 8 = 71. Avec 72, le quotient serait déjà 8."),
  question("Je suis un entier strictement compris entre 50 et 56. Quand on me divise par 8, le reste est 3.",
    "Quel nombre suis-je ?",
    slate("Les indices", ["50 < □ < 56", "Reste 3"], "math"), [field("Nombre cherché", 51)],
    "Si tu enlèves 3 au nombre cherché, tu dois obtenir un multiple de 8.",
    "Le nombre est 51.", "51 = 8 × 6 + 3. Le nombre suivant qui laisse aussi un reste de 3 est 59, déjà trop grand."),
  question("Un sac de billes permet de faire des groupes de 7, avec 5 billes restantes. On réunit deux sacs identiques.",
    "Quel sera le reste si l’on refait des groupes de 7 ?",
    slate("Deux sacs", ["5 billes restantes", "dans chaque sac"]), [field("Nouveau reste", 3)],
    "Garde les groupes déjà formés et réunis seulement les billes qui restaient dans chaque sac.",
    "Le nouveau reste est 3.", "Les deux restes donnent 5 + 5 = 10 billes. On forme un groupe de 7 de plus et il reste 3 billes."),
  question("J’ai entre 40 et 70 jetons. Par groupes de 6, il en reste 2. Par groupes de 5, il en reste 3.",
    "Combien ai-je de jetons ?",
    slate("Deux conditions", ["Par 6 : reste 2", "Par 5 : reste 3"]), [field("Nombre de jetons", 68)],
    "Pars de 44, qui laisse un reste de 2 par 6. Avance de 6 en 6, puis teste le reste par 5.",
    "Il y a 68 jetons.", "Les candidats par 6 sont 44, 50, 56, 62 et 68. Seul 68 laisse aussi un reste de 3 par 5 : 68 = 5 × 13 + 3.")
];

const el = id => document.getElementById(id);
const count = questions.length;
const perStage = 6;
let index = 0;
let isDone = false;
const typed = questions.map(() => []);
const mapDialog = el("map");

function textNode(tag, text) {
  const node = document.createElement(tag);
  node.textContent = text;
  return node;
}
function togglePanel(buttonId, panelId, open) {
  const button = el(buttonId);
  el(panelId).hidden = !open;
  button.setAttribute("aria-expanded", String(open));
  if (buttonId === "ansbtn") button.classList.toggle("fillblue", open);
}
function drawBoard(board) {
  el("boardlabel").textContent = board.title;
  const sketch = el("sketch");
  sketch.className = "sketch " + board.style;
  sketch.replaceChildren();
  sketch.removeAttribute("aria-label");
  sketch.removeAttribute("role");
  if (board.style === "tokens") {
    sketch.setAttribute("role", "img");
    sketch.setAttribute("aria-label", board.lines[0] + " jetons");
    const counters = document.createElement("div");
    counters.className = "counters";
    for (let i = 0; i < board.lines[0]; i++) {
      const token = document.createElement("span");
      token.className = "counter";
      counters.append(token);
    }
    sketch.append(counters);
  } else if (board.style === "division") {
    sketch.setAttribute("role", "img");
    sketch.setAttribute("aria-label", "Division de " + board.lines[0] + " par " + board.lines[1] + ", reste et quotient à compléter.");
    const frame = document.createElement("div");
    frame.className = "potence";
    for (const value of [...board.lines, "⋯", "⋯"]) frame.append(textNode("span", value));
    sketch.append(frame);
  } else {
    for (const line of board.lines) sketch.append(textNode("div", line));
  }
}
function makeFields(items) {
  const fields = el("fields");
  fields.replaceChildren();
  items.forEach((item, k) => {
    const label = textNode("label", item.label);
    const input = document.createElement(item.options ? "select" : "input");
    if (item.options) {
      input.add(new Option("Choisir…", ""));
      item.options.forEach(option => input.add(new Option(option, option)));
    } else {
      input.type = "text";
      input.inputMode = "numeric";
      input.pattern = "[0-9]+";
      input.maxLength = 10;
      input.autocomplete = "off";
    }
    input.name = "answer" + k;
    input.required = true;
    input.value = typed[index][k] || "";
    input.addEventListener("input", () => {
      typed[index][k] = input.value;
      el("feedback").hidden = true;
    });
    label.append(input);
    fields.append(label);
  });
  const check = textNode("button", "Vérifier");
  check.type = "submit";
  check.className = "primary";
  fields.append(check);
}
function paintProgress(n) {
  const progress = el("progress");
  progress.replaceChildren();
  stages.forEach((_, k) => {
    const track = document.createElement("span");
    track.className = "track";
    const bar = document.createElement("i");
    const filled = Math.max(0, Math.min(perStage, n - k * perStage));
    bar.style.width = (100 * filled / perStage) + "%";
    track.append(bar);
    progress.append(track);
  });
}
function markMap() {
  const buttons = el("maplist").querySelectorAll("button");
  buttons.forEach((b, k) => {
    if (k === index && !isDone) b.setAttribute("aria-current", "step");
    else b.removeAttribute("aria-current");
  });
}
function go(i, focus = true) {
  index = Math.min(Math.max(0, i), count - 1);
  isDone = false;
  const q = questions[index];
  el("activity").hidden = false;
  el("practice").hidden = false;
  el("finish").hidden = true;
  el("num").textContent = "Question " + (index + 1) + " / " + count;
  el("stage").textContent = stages[Math.floor(index / perStage)];
  for (const key of ["given", "ask", "hint", "answer", "why"]) el(key).textContent = q[key];
  drawBoard(q.board);
  togglePanel("hintbtn", "hintpanel", false);
  togglePanel("ansbtn", "anspanel", false);
  togglePanel("entrybtn", "entry", false);
  el("feedback").hidden = true;
  el("prev").disabled = index === 0;
  el("next").textContent = index === count - 1 ? "Terminer" : "Suivante";
  makeFields(q.fields);
  paintProgress(index + 1);
  markMap();
  if (focus) {
    el("ask").focus({preventScroll:true});
    window.scrollTo(0,0);
    try { history.replaceState(null, "", "#q" + (index + 1)); } catch {}
  }
}
function next() {
  if (index < count - 1) { go(index + 1); return; }
  isDone = true;
  el("activity").hidden = true;
  el("practice").hidden = true;
  el("finish").hidden = false;
  markMap();
  el("finishhead").focus();
}
function makeMap() {
  stages.forEach((stage, block) => {
    const row = document.createElement("div");
    row.className = "jumprow";
    row.append(textNode("p", stage));
    const buttons = document.createElement("div");
    for (let i = block * perStage; i < (block + 1) * perStage; i++) {
      const b = textNode("button", i + 1);
      b.type = "button";
      b.setAttribute("aria-label", "Question " + (i + 1) + " – " + stage);
      b.addEventListener("click", () => { mapDialog.close(); go(i); });
      buttons.append(b);
    }
    row.append(buttons);
    el("maplist").append(row);
  });
}
function openMap() {
  mapDialog.showModal();
}
function project(enabled) {
  document.body.classList.toggle("presentation", enabled);
  el("project").setAttribute("aria-pressed", String(enabled));
  el("projecttext").textContent = enabled ? "Quitter la projection" : "Projeter";
}
el("project").addEventListener("click", async () => {
  const enabled = !document.body.classList.contains("presentation");
  project(enabled);
  try {
    if (enabled && document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
    if (!enabled && document.fullscreenElement) await document.exitFullscreen();
  } catch { /* The enlarged layout also works inside mobile browsers. */ }
});
document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement) project(false); });
el("openmap").addEventListener("click", openMap);
el("review").addEventListener("click", openMap);
el("closemap").addEventListener("click", () => mapDialog.close());
el("prev").addEventListener("click", () => go(index - 1));
el("next").addEventListener("click", next);
el("again").addEventListener("click", () => { typed.forEach(x => x.length = 0); go(0); });
function reveal(button, panel) {
  const open = el(panel).hidden;
  if (button === "hintbtn" && open) togglePanel("ansbtn", "anspanel", false);
  if (button === "ansbtn" && open) togglePanel("hintbtn", "hintpanel", false);
  togglePanel(button, panel, open);
  if (open) el(panel).scrollIntoView({block:"nearest"});
}
el("hintbtn").addEventListener("click", () => reveal("hintbtn", "hintpanel"));
el("ansbtn").addEventListener("click", () => reveal("ansbtn", "anspanel"));
el("entrybtn").addEventListener("click", () => {
  const open = el("entry").hidden;
  togglePanel("entrybtn", "entry", open);
  if (open) el("entry").querySelector("input,select").focus();
});
el("entry").addEventListener("submit", event => {
  event.preventDefault();
  const inputs = Array.from(el("entry").querySelectorAll("input,select"));
  const misses = [];
  questions[index].fields.forEach((item, k) => {
    const value = inputs[k].value.trim();
    const valid = item.options ? value === item.value : /^\d+$/.test(value) && Number(value) === Number(item.value);
    if (!valid) misses.push(item.label.toLowerCase());
  });
  const feedback = el("feedback");
  feedback.textContent = misses.length ? (inputs.length === 1 ? "Essaie encore. Le coup de pouce peut t’aider." : "À revoir : " + misses.join(" et ") + ".") : "Bravo, ta réponse est juste !";
  feedback.hidden = false;
});
document.addEventListener("keydown", event => {
  if (event.altKey || event.ctrlKey || event.metaKey || mapDialog.open || isDone || /^(INPUT|SELECT|TEXTAREA)$/.test(event.target.tagName)) return;
  if (event.key === "ArrowLeft" && index > 0) { event.preventDefault(); go(index - 1); }
  if (event.key === "ArrowRight") { event.preventDefault(); next(); }
});
function startIndex() {
  const match = /^#q([1-9]\d*)$/.exec(location.hash);
  const n = match ? Number(match[1]) : 1;
  return n >= 1 && n <= count ? n - 1 : 0;
}
makeMap();
go(startIndex(), false);
window.addEventListener("hashchange", () => go(startIndex(), false));

</script>
</body></html>
